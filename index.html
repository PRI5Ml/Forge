wall_sit:[["Párate con la espalda contra una pared.", "Deslízate hacia abajo hasta que los muslos queden paralelos al piso, rodillas a 90°.", "Mantén la espalda pegada a la pared y los brazos fuera de las piernas.", "Sostén el tiempo indicado."],"Las rodillas sobre los tobillos, sin pasar las puntas de los pies."],
l_sit:[["Siéntate en el piso (o en paralelas o bloques) con las piernas estiradas.", "Pon las manos junto a la cadera y empuja fuerte hacia abajo.", "Despega la cadera y las piernas del piso, con las piernas estiradas al frente.", "Sostén el tiempo indicado."],"¿Muy difícil? Dobla las rodillas (tuck) y estíralas a medida que te fortalezcas."],
windshield_wipers:[["Cuélgate de una barra y sube las piernas hasta que apunten al techo.", "Mantén las piernas juntas y estiradas.", "Gíralas hacia un lado y luego llévalas al otro lado.", "Cada lado cuenta como una rep."],"Muy avanzado. Apréndelo primero acostado en el piso."],
dragon_flag:[["Acuéstate en un banco y sujétalo por detrás de la cabeza.", "Sube el cuerpo hasta que solo la parte alta de la espalda toque el banco, con el cuerpo recto.", "Baja el cuerpo recto despacio hacia el banco.", "Detente justo encima y vuelve a subir."],"Empieza solo con la bajada lenta o dobla las rodillas para hacerlo más fácil."],
front_lever:[["Cuélgate de la barra con los brazos estirados.", "Lleva las rodillas al pecho.", "Jala con los brazos estirados hasta que la espalda quede plana y paralela al piso.", "Sostén el tiempo indicado."],"Empuja la barra hacia la cadera con los brazos estirados. Al fortalecerte, estira las piernas."],
handstand_hold:[["Pon las manos a un palmo de la pared.", "Impúlsate para apoyar los talones en la pared.", "Empuja el piso con los brazos estirados y el cuerpo firme.", "Sostén el tiempo indicado."],"Aprende primero a bajar con seguridad: baja un pie o sal de lado."],
run_400:[["Calienta con 5 minutos de trote suave.","Corre 400 m (una vuelta a la pista, aprox. un cuarto de milla) más rápido que tu ritmo meta de 3 millas.","Camina o trota despacio unos 90 segundos.","Repite en cada serie. Registra el tiempo de cada una."],"Mantén todas las repeticiones con tiempos parecidos. Si las últimas son mucho más lentas, empieza un poco más suave la próxima vez."],
run_800:[["Calienta con 5 minutos de trote suave.","Corre 800 m (dos vueltas, aprox. media milla) a un ritmo duro pero constante.","Camina o trota despacio 2 minutos.","Repite en cada serie. Registra el tiempo de cada una."],"Desarrollan la velocidad que puedes mantener 3 millas. Intenta que cada 800 tenga casi el mismo tiempo."],
run_tempo:[["Calienta con 5 minutos de trote suave.","Corre 2 millas a un ritmo cómodamente duro: puedes decir unas palabras, pero no platicar.","Enfría caminando unos minutos.","Registra tu tiempo total."],"Las carreras a ritmo sostenido suben el ritmo que aguantas sin reventarte. No salgas a toda velocidad."],
run_3mi:[["Calienta con 5–10 minutos de trote suave y unos sprints cortos.","Corre 3 millas lo más rápido que puedas mantener toda la distancia.","Enfría caminando.","Registra tu tiempo total."],"Empieza un poco más lento de lo que crees y termina fuerte. Las pruebas de práctica te muestran dónde estás."],
run_880:[["Calienta con trote suave y unos sprints cortos.","Corre 880 yardas (media milla, dos vueltas a la pista) lo más rápido que puedas, como en Movement to Contact.","Camina 3 minutos.","Repite en cada serie. Registra el tiempo de cada una."],"A veces hazlo con botas y uniforme, como en la prueba real."],
run_1_5mi:[["Calienta con 5–10 minutos de trote suave y unos sprints cortos.","Corre 1.5 millas (6 vueltas a una pista de 400 m) lo más rápido que puedas mantener.","Enfría caminando.","Registra tu tiempo."],"Corre la primera vuelta un poco más lento que tu ritmo meta y luego mantenlo. Casi todos empiezan muy rápido."],
row_2k:[["Pon el remo en 2,000 metros. Ajusta la correa sobre la parte más ancha del pie.","En cada remada: empuja con las piernas, inclínate un poco hacia atrás y jala el mango hacia las costillas bajas.","Regresa al revés: brazos, luego cuerpo, luego rodillas. Mantén 26–32 remadas por minuto.","Registra tu tiempo cuando el monitor llegue a 0 m."],"Las piernas hacen casi todo el trabajo. No jales con los brazos antes de tiempo."],
swim_500yd:[["Calienta con 100 yardas suaves.","Nada 500 yardas (20 largos de una alberca de 25 yardas) con cualquier estilo.","Puedes impulsarte y descansar en la pared, pero el reloj sigue corriendo.","Registra tu tiempo."],"Busca un ritmo que puedas mantener. Respira cada 2–3 brazadas."],
swim_450m:[["Calienta con 100 metros suaves.","Nada 450 metros (18 largos de una alberca de 25 m, o 9 de una de 50 m) con cualquier estilo.","Puedes descansar en la pared, pero el reloj sigue corriendo.","Registra tu tiempo."],"Busca un ritmo que puedas mantener. Respira cada 2–3 brazadas."],
cat_cow:[["Empieza en cuatro puntos, manos bajo los hombros y rodillas bajo la cadera.","Inhala mientras bajas el abdomen y subes el pecho y el coxis (vaca).","Exhala mientras redondeas la espalda hacia arriba y metes la barbilla (gato).","Muévete lento con la respiración todo el tiempo."],"Hazlo suave y sin dolor. Se trata de moverse, no de forzar el rango."],
world_greatest:[["Da una zancada larga con el pie derecho adelante, rodilla de atrás sin tocar el suelo.","Pon la mano izquierda en el suelo y baja el codo derecho hacia el pie derecho.","Gira y estira el brazo derecho hacia el techo, siguiéndolo con la mirada.","Sostén una o dos respiraciones, cambia de lado y sigue alternando."],"Aprieta el glúteo de atrás para abrir el frente de esa cadera."],
hip_flexor_stretch:[["Arrodíllate sobre una rodilla con el otro pie adelante, ambas rodillas a unos 90°. Acolchona la rodilla si hace falta.","Mete la cadera y aprieta el glúteo de la pierna arrodillada.","Lleva la cadera un poco hacia adelante hasta sentir el estiramiento al frente de esa cadera.","Sostén y cambia de lado."],"No arquees la espalda baja. Basta un pequeño movimiento con el glúteo apretado."],
hamstring_stretch:[["De pie, pon un talón en un escalón o banco bajo, pierna estirada y punta arriba.","Mantén la espalda recta e inclínate desde la cadera.","Detente cuando sientas el estiramiento detrás del muslo.","Sostén y cambia de pierna."],"Lleva el pecho hacia los dedos del pie, no la nariz a la rodilla."],
pigeon_stretch:[["Desde posición de flexión, lleva una rodilla hacia adelante detrás de esa muñeca, con la espinilla cruzada.","Estira la otra pierna hacia atrás.","Endereza la cadera y baja el pecho hacia el suelo hasta donde sea cómodo.","Sostén y cambia de lado."],"¿Muy intenso? Pon una almohada bajo la cadera de adelante, o hazlo boca arriba (figura 4)."],
calf_stretch:[["Párate frente a una pared con las manos apoyadas.","Lleva un pie atrás, talón abajo y pierna de atrás estirada.","Inclínate hacia la pared hasta sentir el estiramiento en la pantorrilla.","Sostén, dobla un poco la rodilla de atrás para la pantorrilla baja y cambia."],"Mantén el talón de atrás en el suelo y los dedos hacia adelante."],
thoracic_rotation:[["Acuéstate de lado con las rodillas a 90° y los brazos estirados al frente, palmas juntas.","Mantén las rodillas juntas y en el suelo.","Abre el brazo de arriba hacia el otro lado, girando la espalda alta, con la mirada en la mano.","Pausa, regresa y repite; luego cambia de lado."],"Deja que la respiración te ayude a girar un poco más cada vez."],
chest_doorway:[["Párate en una puerta y apoya el antebrazo en el marco, codo a la altura del hombro.","Da un paso adelante con el pie del mismo lado.","Gira el cuerpo un poco hacia afuera hasta sentir el estiramiento en el pecho.","Sostén y cambia de lado."],"Mantén el hombro abajo y atrás, sin encogerlo."],
childs_pose:[["Arrodíllate y siéntate sobre los talones, rodillas al ancho de la cadera o más.","Camina las manos hacia adelante y baja el pecho hacia el suelo.","Apoya la frente y respira lento hacia la espalda.","Sostén todo el tiempo."],"Las rodillas más abiertas dan más espacio a la cadera y la espalda baja."],
cl_rev_crunch:[["Acuéstate boca arriba con las manos detrás de la cabeza o cruzadas sobre el pecho. Cruza un tobillo sobre el otro, con las rodillas dobladas.","Lleva la cadera y las rodillas hacia el pecho mientras levantas los hombros, hasta que las rodillas toquen los codos o los muslos toquen los antebrazos.","Baja hasta que los omóplatos toquen el suelo.","Repite durante 2 minutos. Registra tus repeticiones."],"Mantén un ritmo constante. Los omóplatos deben tocar el suelo en cada repetición para que cuente."],
hamr:[["Marca dos líneas a 20 m y pon un audio de HAMR con pitidos (gratis en la mayoría de apps de música).","Corre a la otra línea antes de cada pitido, luego gira y regresa.","Los pitidos se aceleran cada nivel. Sigue hasta que no llegues a la línea antes del pitido 3 veces seguidas.","Registra cuántas vueltas completaste."],"Gira firme en la línea con un paso corto y rápido. No empieces muy rápido; los primeros niveles son calentamiento."],
hrp:[["Acuéstate boca abajo con las manos planas junto al pecho.","Empuja hasta estirar los brazos, con una línea recta de la cabeza a los talones.","Baja hasta que el pecho toque el suelo. Levanta ambas manos del suelo y estira los brazos hacia los lados, luego regresa las manos bajo los hombros.","Repite durante 2 minutos. Registra tus repeticiones."],"Mantén el cuerpo firme. La cadera caída o el cuerpo doblado no cuentan el día de la prueba."],
sdc:[["Marca dos líneas a 25 m de distancia. El evento son 5 recorridos de 50 m (ida y vuelta).","Corre 50 m, luego arrastra un trineo de 90 lb 50 m caminando hacia atrás.","Desplázate de lado 50 m, luego carga dos pesas rusas de 40 lb 50 m.","Corre los últimos 50 m. Registra tu tiempo total."],"Toca la línea con la mano y el pie en cada vuelta. ¿Sin trineo? Arrastra un saco pesado. ¿Sin pesas rusas? Usa mancuernas pesadas."],
run_2mi:[["Calienta con 5–10 minutos de trote suave y unos sprints cortos.","Corre 2 millas lo más rápido que puedas mantener toda la distancia (8 vueltas a una pista de 400 m más 19 m).","Enfría caminando.","Registra tu tiempo."],"El ritmo parejo gana. Corre la primera milla no más rápido que tu ritmo meta."],
shuttle_sprint:[["Marca dos líneas a 25 yardas de distancia.","Corre a la línea lejana y regresa 6 veces (300 yardas en total). Toca la línea con el pie o la mano en cada vuelta.","Descansa unos 3 minutos.","Repite en cada serie. Registra el tiempo de cada una."],"Mantente bajo en los giros. Los cambios de dirección rápidos ganan el circuito Maneuver Under Fire."],
swim_free:[["Impúlsate de la pared y nada estilo libre (crol) a ritmo constante.","Estira cada brazo largo, rota el cuerpo de lado a lado y respira de lado.","Patea constante desde la cadera con los tobillos sueltos.","Registra la distancia y tu tiempo total; la app calcula tu ritmo por 100."],"Saca el aire bajo el agua para estar listo para respirar al girar la cabeza."],
swim_breast:[["Impúlsate de la pared y deslízate con los brazos estirados al frente.","Abre las manos hacia afuera y atrás hasta el pecho, luego llévalas al frente otra vez.","Patea como rana: talones hacia los glúteos, pies afuera y luego júntalos.","Brazada, respira, patada, deslízate. Registra la distancia y tu tiempo total."],"El deslizamiento es donde descansas y ganas velocidad. No lo apresures. Es el estilo de supervivencia acuática de los Marines."],
swim_intervals:[["Nada cada repetición en estilo libre al ritmo que indica el plan.","Descansa en la pared el tiempo indicado.","Empieza la siguiente repetición a tiempo.","Registra el tiempo de cada una."],"Intenta que cada repetición esté a pocos segundos de la primera."],
kickboard:[["Sostén una tabla al frente con los brazos estirados.","Patea desde la cadera con las piernas casi rectas y los tobillos sueltos y en punta.","Haz patadas pequeñas y rápidas; los pies apenas deben salir del agua.","Registra el tiempo de cada una."],"Patear fuerte desde las rodillas cansa rápido. Impulsa desde la cadera."],
pull_buoy:[["Pon un pull buoy entre los muslos para que las piernas floten sin patear.","Nada estilo libre usando solo los brazos.","Enfócate en estirarte largo y jalar fuerte hasta la cadera.","Registra el tiempo de cada una."],"Excelente para resistencia de brazos y espalda, y suave con piernas lesionadas."],
tread:[["En agua profunda, mantente vertical con la cabeza fuera del agua.","Mueve las manos de lado a lado frente a ti.","Patea lento tipo batidora o patada de crol.","Mantente tranquilo y constante todo el tiempo. Registra tus minutos."],"Respirar relajado lo hace mucho más fácil. El pánico gasta energía rápido."],
aqua_jog:[["En agua profunda (un cinturón de flotación ayuda), mantente vertical.","Corre en el lugar: sube las rodillas y mueve los brazos como en tierra.","Mantén un esfuerzo constante; casi no avanzarás.","Mantente todo el tiempo. Registra tus minutos."],"Los atletas lo usan para mantener su condición lesionados: todo el movimiento de correr, sin impacto."],
walk:[["Camina afuera o en una pista a paso rápido, moviendo los brazos.","Busca un ritmo en el que respires más fuerte pero aún puedas hablar.","Mantente así todo el tiempo.","Registra tus minutos."],"Caminar es suave para las articulaciones y una de las mejores formas de quemar calorías extra cada día."],
incline_walk:[["Pon la caminadora a paso de caminata (unos 5 km/h / 3 mph) con 8–12% de inclinación.","Camina erguido sin agarrarte de los barandales.","Mantén un ritmo constante todo el tiempo.","Registra tus minutos."],"Agarrarte de los barandales reduce las calorías que quemas. Baja la inclinación antes de agarrarte."],
jog:[["Trota a un ritmo suave en el que puedas platicar, afuera o en caminadora.","Pisa suave debajo de la cadera con pasos cortos y rápidos.","Mantente todo el tiempo; está bien caminar ratos.","Registra tus minutos."],"Suave significa que podrías platicar. La mayoría de tus carreras deben sentirse así."],
bike:[["Ajusta el asiento para que la rodilla quede un poco doblada abajo del pedaleo.","Pedalea a ritmo constante con suficiente resistencia para sentirlo.","Mantente así todo el tiempo.","Registra tus minutos."],"Bajo impacto y suave para las articulaciones, ideal en días de pesas."],
bike_intervals:[["Calienta 2–3 minutos pedaleando suave.","Pedalea fuerte 30 segundos (resistencia alta o rápido).","Pedalea suave 90 segundos.","Repite hasta completar el tiempo. Registra tus minutos."],"Los intervalos queman mucho en poco tiempo. Lo fuerte debe sentirse fuerte, y lo suave debe dejarte recuperar."],
rower:[["Ajusta los pies en las correas y toma el agarre con los brazos estirados.","Empuja primero con las piernas, luego inclínate un poco atrás y jala el agarre a las costillas bajas.","Regresa al revés: brazos al frente, inclínate adelante y dobla las rodillas.","Mantén un ritmo constante todo el tiempo. Registra tus minutos."],"Es piernas, luego espalda, luego brazos. La mayor fuerza viene de las piernas, no de los brazos."],
elliptical:[["Súbete y toma los agarres suavemente.","Empuja y jala con los brazos mientras las piernas se mueven con fluidez.","Sube la resistencia hasta que cueste trabajo.","Mantente todo el tiempo. Registra tus minutos."],"Cero impacto, buena opción si correr te molesta las articulaciones."],
stair_climber:[["Súbete y empieza a una velocidad lenta y constante.","Párate derecho y da pasos completos sin recargarte en los barandales.","Sube la velocidad hasta que sea un reto.","Mantente todo el tiempo. Registra tus minutos."],"Recargarte en los barandales lo hace mucho más fácil. Sostenlos solo para el equilibrio."],
jump_rope:[["Sostén los mangos a la altura de la cadera con la cuerda detrás de ti.","Gira la cuerda con las muñecas, no con los brazos.","Salta solo lo necesario para pasarla, cayendo suave en la parte delantera del pie.","Toma descansos cortos si los necesitas. Registra tus minutos totales."],"Quema muchas calorías pero es de alto impacto para pantorrillas y tobillos. Aumenta poco a poco."],
arm_bike:[["Siéntate frente a la bicicleta de brazos con los agarres a la altura de los hombros.","Pedalea con los brazos en un círculo fluido.","Sube la resistencia hasta que cueste trabajo.","Mantente todo el tiempo. Registra tus minutos."],"Excelente cardio cuando una lesión de pierna, rodilla o tobillo no te deja usar otras máquinas."],
flak_run:[["Ponte el chaleco o portaplacas con placas al frente y atrás. Ajústalo para que no rebote.","Calienta unos minutos caminando y trotando suave con él.","Corre la distancia planeada a un ritmo constante que puedas mantener.","Registra la distancia y tu tiempo total; la app calcula tu ritmo."],"Aumenta poco a poco: empieza con distancias más cortas que tus carreras normales. Detente si te duelen la espalda, los hombros o las rodillas."],
flak_run_side:[["Ponte el chaleco o portaplacas con placas al frente, atrás y a los lados. Ajústalo para que nada se mueva.","Calienta unos minutos caminando y trotando suave con él.","Corre la distancia planeada a un ritmo constante que puedas mantener.","Registra la distancia y tu tiempo total; la app calcula tu ritmo."],"Las placas laterales agregan peso y limitan la respiración. Al principio corre menos y más lento que con placas al frente y atrás."],
bear_crawl:[["Apóyate en manos y pies, con las rodillas apenas sobre el piso y la espalda plana.","Avanza gateando 25 yardas, moviendo mano y pie contrarios a la vez.","Levántate y descansa unos 45 segundos.","Repite en cada serie. Registra el tiempo de cada una."],"Mantén la cadera baja y la espalda plana. Desarrolla la fuerza para gatear del circuito del CFT."],
ammo_press:[["Sostén una mancuerna, pesa rusa o caja de munición de 30 lb a la altura de los hombros con ambas manos.","Empújala hacia arriba hasta bloquear los brazos.","Bájala de nuevo a la barbilla.","Repite tantas veces como puedas en el tiempo indicado. Registra tus repeticiones."],"Exhala en cada empuje y encuentra un ritmo constante. En la prueba solo cuentan las repeticiones con los brazos bloqueados."],
farmer_carry:[["Levanta una mancuerna pesada en cada mano y párate derecho.","Camina 50 yardas con pasos cortos y rápidos, con los hombros hacia atrás.","Bájalas con control.","Descansa y repite. Registra el peso por mano y los viajes como repeticiones."],"No dejes que las pesas se balanceen ni que se redondeen los hombros. Fortalece el agarre para cargar y arrastrar."],
neg_pullup:[["Salta o súbete para tener la barbilla sobre la barra.","Baja lo más despacio que puedas, unos 5 segundos, hasta estirar los brazos.","Suéltate, acomódate y repite.","Registra las repeticiones de cada serie."],"La bajada lenta construye fuerza para tus primeras dominadas, o para hacer más."],
burpee:[["Párate derecho, baja en sentadilla y pon las manos en el piso.", "Salta con los pies hacia atrás a posición de flexión y haz una flexión.", "Salta con los pies de vuelta a las manos.", "Salta con los brazos arriba."],"Mantén un ritmo que puedas sostener. Quita la flexión para hacerlo más fácil."],

bench:[["Acuéstate en el banco con los ojos debajo de la barra y los pies apoyados en el piso.","Toma la barra un poco más abierta que el ancho de hombros, junta los omóplatos y desengancha.","Baja la barra con control hasta la mitad del pecho, con los codos a unos 45° del cuerpo.","Empuja de nuevo hasta estirar los brazos."],"Mantén los glúteos en el banco y las muñecas alineadas sobre los codos. Usa un compañero o barras de seguridad cuando cargues pesado."],
incline_bb:[["Pon el banco a unos 30–45°. Acuéstate con los ojos debajo de la barra.","Toma la barra un poco más abierta que los hombros, junta los omóplatos y desengancha.","Baja la barra a la parte alta del pecho, justo debajo de las clavículas.","Empuja hacia arriba y un poco hacia atrás hasta estirar los brazos."],"Una inclinación más baja (unos 30°) mantiene el trabajo en la parte alta del pecho en vez de los hombros."],
db_bench:[["Siéntate en un banco plano con las mancuernas sobre los muslos, luego acuéstate y llévalas junto al pecho.","Empuja las mancuernas hasta estirar los brazos sobre el pecho.","Baja despacio hasta que los codos queden un poco por debajo del banco.","Empuja de nuevo, acercando las mancuernas arriba."],"Mantén los codos a unos 45° del cuerpo, no totalmente abiertos."],
incline_db:[["Pon el banco a 30–45° y siéntate con las mancuernas a la altura de los hombros.","Empuja las mancuernas sobre la parte alta del pecho.","Baja despacio hasta sentir un estiramiento en el pecho.","Empuja de nuevo sin chocar las pesas."],"Mantén los omóplatos pegados al banco todo el tiempo."],
db_fly:[["Acuéstate en un banco plano con las mancuernas sobre el pecho y las palmas enfrentadas.","Mantén los codos un poco flexionados.","Abre los brazos en arco hasta sentir un estiramiento en el pecho.","Aprieta el pecho para subir las mancuernas por el mismo arco."],"Piensa en «abrazar un árbol». Usa poco peso: el estiramiento de abajo es donde ocurren las lesiones."],
cable_fly:[["Pon ambas poleas a la altura de los hombros o más arriba y toma un agarre en cada mano.","Da un paso al frente con un pie, brazos abiertos y codos un poco flexionados.","Junta las manos frente al pecho en un arco amplio.","Regresa despacio hasta sentir el estiramiento y repite."],"Mantén fija la flexión del codo. Si los codos se doblan y se estiran, se vuelve un press."],
pec_deck:[["Ajusta el asiento para que los agarres queden a la altura del pecho.","Siéntate derecho con la espalda en el respaldo y toma los agarres o almohadillas.","Junta los brazos frente a ti apretando el pecho.","Abre despacio hasta sentir un estiramiento ligero."],"Mantén los hombros abajo y atrás. No dejes que se vayan hacia delante al final."],
chest_press:[["Ajusta el asiento para que los agarres queden a la mitad del pecho.","Siéntate con la espalda plana en el respaldo y toma los agarres.","Empuja hacia delante hasta estirar los brazos sin bloquearlos.","Regresa despacio hasta sentir el estiramiento en el pecho."],"Una gran opción para aprender a empujar con seguridad, sin necesidad de compañero."],
pushup:[["Pon las manos un poco más abiertas que los hombros, con el cuerpo en línea recta de la cabeza a los talones.","Aprieta el abdomen y los glúteos.","Baja el pecho hasta quedar justo encima del piso, con los codos a unos 45° del cuerpo.","Empuja de nuevo hasta estirar los brazos."],"¿Muy difícil? Pon las manos en un banco. ¿Muy fácil? Eleva los pies o usa una mochila con peso."],
dip:[["Toma las barras paralelas y sostente con los brazos estirados.","Inclina el pecho un poco hacia delante.","Baja hasta que los brazos queden más o menos paralelos al piso.","Empuja de nuevo hasta estirar los brazos."],"Inclinarte trabaja más el pecho; mantenerte derecho trabaja más los tríceps. No bajes más de lo cómodo para tus hombros."],
ohp:[["Pon la barra a la altura de la parte alta del pecho. Tómala justo por fuera de los hombros y desengancha con la barra sobre los hombros.","Párate con los pies al ancho de cadera, aprieta glúteos y abdomen.","Empuja la barra hacia arriba, llevando la cabeza un poco atrás para que pase.","Bloquea arriba con la barra sobre la mitad del pie y baja a los hombros."],"No te inclines hacia atrás. Glúteos y abdomen firmes protegen tu espalda baja."],
db_ohp:[["Siéntate en un banco vertical con las mancuernas a la altura de los hombros, palmas al frente.","Mantén la espalda en el respaldo y los pies firmes.","Empuja las mancuernas hasta casi estirar los brazos.","Baja con control a la altura de los hombros."],"Detente justo antes de bloquear los codos para mantener la tensión en los hombros."],
arnold:[["Siéntate derecho con las mancuernas frente a los hombros y las palmas hacia ti.","Al empujar hacia arriba, gira las palmas hacia el frente.","Termina con los brazos arriba y las palmas al frente.","Invierte el giro al bajar al inicio."],"Muévete despacio. El giro es lo importante, no lo apresures."],
shoulder_press_m:[["Ajusta el asiento para que los agarres queden a la altura de los hombros.","Siéntate con la espalda en el respaldo y toma los agarres.","Empuja hasta casi estirar los brazos.","Baja despacio a la altura de los hombros."],"Mantén la espalda baja en el respaldo; no la arquees para empujar más peso."],
lat_raise:[["Párate con mancuernas ligeras a los costados.","Con los codos un poco flexionados, sube los brazos hacia los lados.","Detente a la altura de los hombros, con los meñiques un poco arriba.","Baja despacio."],"Poco peso y sin balancearte. Guía el movimiento con los codos, no con las manos."],
cable_lat_raise:[["Pon la polea en el punto más bajo. Párate de lado y toma el agarre con la mano más lejana.","Con el codo un poco flexionado, sube el brazo hacia el lado.","Detente a la altura del hombro.","Baja despacio contra la tensión del cable."],"El cable mantiene la tensión abajo, donde las mancuernas no. Hazlo lento."],
rear_fly:[["Toma mancuernas ligeras e inclínate desde la cadera hasta que el pecho quede casi paralelo al piso.","Deja colgar las mancuernas bajo el pecho, con los codos un poco flexionados.","Sube los brazos hacia los lados apretando la parte alta de la espalda.","Baja despacio."],"Mantén el cuello neutro y no encojas los hombros. Poco peso, técnica estricta."],
face_pull:[["Pon una cuerda en la polea a la altura del pecho o más arriba.","Toma la cuerda con los pulgares hacia atrás y aléjate hasta estirar los brazos.","Jala la cuerda hacia la cara, separando las manos con los codos altos.","Aprieta la parte posterior de los hombros y regresa despacio."],"Termina como en una pose de doble bíceps. Excelente para la salud de los hombros y la postura."],
pike_pushup:[["Empieza en posición de flexión, acerca los pies y sube la cadera formando una V invertida.","Dobla los codos para bajar la coronilla hacia el piso entre las manos.","Empuja de nuevo hasta estirar los brazos.","Mantén la cadera alta todo el tiempo."],"Subir los pies a un banco lo hace más difícil y más parecido a un press militar."],
band_pull_apart:[["Sostén una banda frente a ti a la altura de los hombros con los brazos estirados y las manos al ancho de hombros.","Separa la banda llevando los brazos hacia los lados.","Junta los omóplatos cuando la banda toque tu pecho.","Regresa despacio."],"Mantén los hombros lejos de las orejas. Ideal como calentamiento."],
deadlift:[["Párate con los pies al ancho de cadera y la barra sobre la mitad del pie.","Inclínate y toma la barra justo por fuera de las piernas. Dobla las rodillas hasta que las espinillas toquen la barra.","Aprieta el abdomen, endereza la espalda y tensa la barra.","Empuja el piso con los pies, mantén la barra pegada a las piernas y ponte de pie. Baja llevando la cadera atrás."],"La espalda debe quedar recta, nunca redondeada. Si se redondea, el peso es demasiado."],
bb_row:[["Toma la barra con agarre prono, las manos un poco más abiertas que las piernas.","Inclínate hacia delante hasta unos 45° o más, rodillas flexionadas y espalda recta.","Jala la barra hacia las costillas bajas, llevando los codos atrás.","Baja con control."],"No te enderces para mover el peso. Mantén el mismo ángulo del torso en cada rep."],
db_row:[["Apoya una rodilla y la mano del mismo lado en un banco, con la espalda recta.","Sostén una mancuerna con la mano libre, el brazo colgando.","Jala la mancuerna hacia la cadera, con el codo cerca del cuerpo.","Baja despacio hasta estirar el brazo."],"Piensa en «llevar el codo al bolsillo trasero» para trabajar los dorsales, no solo el brazo."],
pullup:[["Cuélgate de la barra con agarre prono, las manos un poco más abiertas que los hombros.","Baja y lleva atrás los hombros para empezar el movimiento.","Sube hasta que la barbilla pase la barra.","Baja completamente con control."],"¿Aún no te sale una? Usa una banda, una máquina asistida o haz solo la bajada lenta."],
chinup:[["Cuélgate de la barra con las palmas hacia ti y las manos al ancho de hombros.","Baja los hombros y luego sube.","Lleva la barbilla por encima de la barra.","Baja completamente despacio."],"Suelen ser más fáciles que las dominadas porque los bíceps ayudan más. Una gran primera meta."],
lat_pulldown:[["Siéntate con los muslos bajo las almohadillas y toma la barra más abierta que los hombros.","Inclínate un poco atrás y baja los hombros.","Jala la barra a la parte alta del pecho, llevando los codos abajo.","Deja subir la barra despacio hasta estirar los brazos."],"No jales por detrás del cuello ni balancees el cuerpo para mover el peso."],
cable_row:[["Siéntate con los pies en la plataforma, rodillas un poco flexionadas, y toma el agarre.","Siéntate derecho con la espalda recta y los brazos estirados.","Jala el agarre hacia el abdomen juntando los omóplatos.","Regresa despacio hasta estirar los brazos."],"Mantén el torso quieto. No te balancees para mover el peso."],
sa_cable_row:[["Pon un agarre simple en una polea a la altura del pecho (o siéntate en un remo bajo con un solo agarre).","Sostén el agarre con una mano, el brazo estirado y el torso quieto.","Lleva el codo hacia atrás pasando las costillas y aprieta el omóplato.","Deja que el brazo se estire despacio y cambia de lado."],"No gires el torso para terminar la repetición. Registra el peso de un brazo."],
dual_cable_row:[["Pon las dos poleas de un cruce de poleas a la altura del pecho con un agarre en cada una.","Da un paso atrás con un agarre en cada mano y los brazos estirados al frente.","Lleva ambos codos hacia atrás pasando las costillas y junta los omóplatos.","Regresa despacio hasta estirar los brazos."],"Mantén el pecho arriba y el cuerpo quieto; solo se mueven los brazos y omóplatos. Registra el peso de un lado."],
machine_row:[["Ajusta el asiento para que los agarres queden a la altura del pecho, con el pecho en el respaldo.","Toma los agarres con los brazos estirados.","Jala hacia atrás llevando los codos más allá de los costados.","Regresa despacio."],"Haz una pausa de un segundo apretando atrás en cada rep."],
db_shrug:[["Párate con mancuernas a los costados.","Sube los hombros directo hacia las orejas.","Sostén un segundo arriba.","Baja despacio."],"Sube y baja en línea recta. No gires los hombros."],
band_row:[["Ancla una banda a la altura del pecho, o pásala por los pies estando sentado.","Sostén los extremos con los brazos estirados.","Jala las manos hacia el abdomen juntando los omóplatos.","Regresa despacio."],"Aléjate más para tener más resistencia."],
back_ext:[["Ajusta la almohadilla justo debajo de los huesos de la cadera y engancha los pies.","Cruza los brazos sobre el pecho.","Baja el torso doblándote desde la cadera hasta sentir el estiramiento en los isquiotibiales.","Sube hasta que tu cuerpo quede en línea recta."],"Detente en línea recta. No arquees de más la espalda baja arriba."],
good_morning:[["Apoya una barra ligera en la parte alta de la espalda, como en una sentadilla.","Párate con los pies al ancho de cadera y las rodillas un poco flexionadas.","Lleva la cadera atrás bajando el pecho hasta sentir un fuerte estiramiento en los isquiotibiales.","Empuja la cadera adelante para volver a ponerte de pie."],"Empieza muy ligero. La espalda debe quedar recta todo el tiempo."],
weighted_back_ext:[["Colócate como en la extensión de espalda, sosteniendo un disco contra el pecho.","Baja el torso doblándote desde la cadera.","Sube hasta que tu cuerpo quede recto.","Controla el peso al bajar."],"Domina primero la versión sin peso y luego agrega peso poco a poco."],
bird_dog:[["Empieza en cuatro puntos, con las manos bajo los hombros y las rodillas bajo la cadera.","Aprieta el abdomen y mantén la espalda recta.","Estira un brazo al frente y la pierna contraria atrás hasta que queden rectos.","Sostén un segundo, regresa y cambia de lado."],"Imagina un vaso de agua sobre tu espalda baja: no lo derrames."],
superman:[["Acuéstate boca abajo con los brazos estirados por encima de la cabeza.","Aprieta los glúteos y la espalda baja.","Levanta brazos, pecho y piernas del piso a la vez.","Sostén, con el cuello alineado con la columna."],"Mira al piso, no al frente, para proteger el cuello."],
bb_curl:[["Párate con una barra en agarre supino al ancho de hombros.","Mantén los codos pegados a los costados.","Sube la barra hacia los hombros.","Baja despacio hasta estirar los brazos."],"Sin balanceo. Si tienes que inclinarte atrás, el peso es demasiado."],
db_curl:[["Párate con mancuernas a los costados, palmas al frente.","Mantén los codos a los costados.","Sube las pesas apretando los bíceps.","Baja despacio hasta abajo."],"Bajar despacio (2–3 segundos) construye tanto músculo como subir."],
hammer_curl:[["Párate con mancuernas a los costados, palmas hacia el cuerpo.","Mantén las palmas hacia dentro todo el tiempo.","Sube las pesas hacia los hombros.","Baja despacio."],"Trabaja más los antebrazos y la parte externa del bíceps que el curl normal."],
cable_curl:[["Pon una barra recta o una cuerda en la polea baja.","Párate frente a la máquina y toma el agarre en supino.","Sube el agarre hacia los hombros con los codos a los costados.","Baja despacio."],"El cable mantiene la tensión todo el recorrido; haz las reps suaves."],
incline_curl:[["Pon una banca a unos 45° y recuéstate con una mancuerna en cada mano.","Deja los brazos colgando rectos, con las palmas al frente.","Sube las mancuernas sin mover los brazos hacia adelante.","Baja despacio hasta abajo."],"La inclinación estira el bíceps; usa menos peso que en el curl de pie."],
db_preacher:[["Siéntate en un banco predicador con la parte de atrás del brazo plana sobre el cojín.","Sostén una mancuerna con la palma hacia arriba y el brazo casi estirado.","Sube la mancuerna hacia el hombro.","Baja despacio hasta casi estirar el brazo. Cambia de brazo, o hazlo con ambos a la vez."],"No dejes caer el peso abajo; contrólalo para proteger el codo. Registra el peso por mancuerna."],
ez_preacher:[["Siéntate en un banco predicador con los brazos planos sobre el cojín.","Toma una barra Z en los agarres inclinados, palmas arriba.","Sube la barra hacia la barbilla.","Baja despacio hasta casi estirar los brazos."],"Mantén las axilas pegadas a la parte alta del cojín y no rebotes abajo."],
preacher:[["Ajusta el asiento para que los brazos queden planos sobre la almohadilla.","Toma los agarres en supino.","Sube hasta que los antebrazos queden verticales.","Baja despacio hasta casi estirar los brazos."],"No dejes caer el peso rápido abajo; ahí es donde se lastiman los codos."],
band_curl:[["Párate sobre el centro de una banda y sostén los extremos, palmas al frente.","Mantén los codos a los costados.","Sube las manos hacia los hombros.","Baja despacio."],"Abre más los pies sobre la banda para más resistencia."],
skull:[["Acuéstate en un banco con una barra o barra Z sobre el pecho y los brazos estirados.","Mantén los brazos quietos y un poco inclinados hacia atrás.","Dobla los codos para bajar la barra hacia la frente.","Estira los brazos para subirla de nuevo."],"Poco peso y despacio. Baja la barra justo detrás de la cabeza si te molestan los codos."],
pushdown:[["Pon una barra o cuerda en la polea alta y tómala con los codos doblados.","Pega los codos a los costados.","Empuja hacia abajo hasta estirar los brazos.","Deja subir el agarre despacio hasta que los antebrazos queden paralelos al piso."],"Solo se mueven los antebrazos. Los codos quedan pegados a los costados."],
sa_cable_ext:[["Pon un agarre simple en una polea alta y párate de frente a la máquina.","Toma el agarre con una mano y pega el codo al costado, con el antebrazo hacia arriba.","Empuja el agarre hacia abajo hasta estirar el brazo y aprieta el tríceps.","Deja que suba despacio hasta que el antebrazo pase la horizontal y repite. Cambia de brazo."],"Solo se mueve el antebrazo. Registra el peso de un brazo."],
dual_cable_ext:[["Pon las dos poleas de un cruce de poleas en alto con un agarre en cada una.","Toma un agarre en cada mano, da la espalda a la máquina y da un paso al frente con las piernas separadas.","Empieza con los codos doblados, las manos detrás de la cabeza y los brazos junto a las orejas.","Estira los brazos hacia adelante y arriba, y dobla los codos despacio para volver al inicio."],"Mantén los codos altos y quietos. Registra el peso de un lado."],
oh_ext:[["Sostén una mancuerna con ambas manos por encima de la cabeza, de pie o sentado.","Mantén los codos apuntando al frente y cerca de la cabeza.","Baja la mancuerna detrás de la cabeza doblando los codos.","Estira los brazos para subirla de nuevo."],"Mantén las costillas abajo; no arquees la espalda para terminar la rep."],
cg_bench:[["Acuéstate en el banco y toma la barra más o menos al ancho de hombros.","Desengancha y mantén los codos cerca del cuerpo.","Baja la barra a la parte baja del pecho.","Empuja de nuevo hasta estirar los brazos."],"Con las manos al ancho de hombros basta. Más cerrado es duro para las muñecas."],
bench_dip:[["Siéntate en el borde de un banco con las manos junto a la cadera, dedos al frente.","Desliza los glúteos fuera del banco con las piernas al frente.","Baja doblando los codos a unos 90°.","Empuja de nuevo hasta estirar los brazos."],"Dobla las rodillas para hacerlo más fácil. Mantén la espalda cerca del banco."],
band_pushdown:[["Ancla una banda en alto, por ejemplo sobre una puerta o una barra de dominadas.","Tómala con los codos doblados y pegados a los costados.","Empuja hacia abajo hasta estirar los brazos.","Regresa despacio."],"Aprieta fuerte los tríceps abajo en cada rep."],
wrist_curl:[["Siéntate y apoya los antebrazos en los muslos o un banco, palmas arriba y muñecas fuera del borde.","Sostén una mancuerna en cada mano.","Sube las muñecas lo más que puedas.","Baja despacio, dejando rodar el peso hacia los dedos."],"Movimiento corto, poco peso y muchas reps (15–20) funciona mejor para los antebrazos."],
rev_wrist_curl:[["Apoya los antebrazos en un banco o los muslos, palmas abajo y muñecas fuera del borde.","Sostén mancuernas ligeras.","Sube el dorso de las manos hacia ti.","Baja despacio."],"Usa menos peso que en el curl de muñeca normal. Estos músculos son más pequeños."],
btb_wrist_curl:[["Párate con una barra detrás de la espalda, palmas hacia atrás.","Deja los brazos colgando estirados.","Sube la barra doblando solo las muñecas.","Baja despacio."],"Permite usar más peso que el curl de muñeca sentado. Mantén los brazos quietos."],
rev_curl:[["Párate con una barra en agarre prono (palmas abajo) al ancho de hombros.","Mantén los codos a los costados.","Sube la barra hacia los hombros.","Baja despacio."],"Usa más o menos la mitad del peso de tu curl normal. Fortalece antebrazos y agarre."],
cable_wrist_curl:[["Pon una barra recta en la polea baja y arrodíllate o siéntate frente a ella.","Apoya los antebrazos en un banco o los muslos, palmas arriba.","Sube las muñecas.","Baja despacio."],"Mantén los antebrazos quietos; solo se mueven las muñecas."],
dead_hang:[["Toma una barra de dominadas con agarre prono, manos al ancho de hombros.","Levanta los pies y cuélgate con los brazos estirados.","Mantén los hombros un poco activos, no totalmente caídos.","Aguanta lo más que puedas; registra los segundos."],"Excelente para la fuerza de agarre y descomprimir la espalda. El magnesio ayuda."],
plate_pinch:[["Junta dos discos con los lados lisos hacia fuera.","Pellízcalos con los dedos de un lado y el pulgar del otro.","Levántalos y sostenlos a tu costado.","Aguanta lo más que puedas y cambia de mano."],"Empieza con dos discos de 10 lb (5 kg) y aumenta el tiempo."],
squat:[["Apoya la barra en la parte alta de la espalda (no en el cuello), con las manos justo por fuera de los hombros.","Párate con los pies al ancho de hombros y las puntas un poco hacia fuera. Aprieta el abdomen.","Siéntate hacia abajo y atrás hasta que la cadera quede al menos a la altura de las rodillas, con las rodillas en dirección de los pies.","Empuja con todo el pie para ponerte de pie."],"Pecho arriba y talones abajo. Usa siempre barras de seguridad o un compañero en series pesadas."],
front_squat:[["Apoya la barra en la parte delantera de los hombros, con las yemas de los dedos debajo y los codos altos.","Párate con los pies al ancho de hombros.","Baja en sentadilla con el torso derecho y los codos arriba.","Empuja de nuevo hasta ponerte de pie."],"Si te duelen las muñecas, cruza los brazos sobre la barra para sostenerla."],
goblet:[["Sostén una mancuerna vertical contra el pecho con ambas manos.","Párate con los pies un poco más abiertos que los hombros, puntas hacia fuera.","Baja en sentadilla entre las rodillas con el pecho arriba.","Empuja de nuevo hasta ponerte de pie."],"La mejor sentadilla para principiantes. Te enseña a mantenerte derecho."],
kb_goblet:[["Sostén una kettlebell por los lados del asa a la altura del pecho.","Párate con los pies un poco más abiertos que los hombros.","Baja en sentadilla con los codos por dentro de las rodillas.","Empuja de nuevo hasta ponerte de pie."],"Usa los codos para empujar suavemente las rodillas hacia fuera abajo."],
leg_press:[["Siéntate con la espalda plana en el respaldo y los pies al ancho de hombros en la plataforma.","Quita los seguros.","Baja la plataforma hasta que las rodillas queden a unos 90°.","Empuja de nuevo sin bloquear las rodillas."],"Nunca bloquees las rodillas arriba ni dejes que la espalda baja se despegue del respaldo."],
leg_ext:[["Ajusta el asiento para que las rodillas queden alineadas con el eje de la máquina.","Engancha la almohadilla justo arriba de los tobillos.","Estira las piernas apretando los cuádriceps.","Baja despacio."],"Haz una pausa de un segundo arriba para apretar más."],
leg_curl:[["Ajusta la máquina para que las rodillas queden alineadas con el eje y la almohadilla justo arriba de los talones.","Baja la almohadilla de los muslos para sujetar las piernas.","Lleva los talones hacia abajo y atrás lo más que puedas.","Regresa despacio."],"Lleva las puntas de los pies hacia las espinillas para trabajar más los isquiotibiales."],
lying_leg_curl:[["Acuéstate boca abajo con la almohadilla justo arriba de los talones y las rodillas justo fuera del banco.","Toma los agarres y mantén la cadera pegada al banco.","Lleva los talones hacia los glúteos.","Baja despacio."],"No despegues la cadera del banco para terminar la rep."],
hip_abduction:[["Siéntate en la máquina con las almohadillas por fuera de las rodillas.","Siéntate derecho y toma los agarres.","Empuja las rodillas hacia fuera lo más que puedas.","Regresa despacio sin dejar que las pesas se toquen."],"Inclinarte un poco hacia delante trabaja más los glúteos."],
hip_adduction:[["Siéntate en la máquina con las almohadillas por dentro de las rodillas.","Empieza con las piernas solo tan abiertas como te sea cómodo.","Junta las rodillas apretando.","Abre de nuevo despacio."],"No empieces demasiado abierto. Un estiramiento grande con carga puede lastimar la ingle."],
cable_adduction:[["Pon una tobillera en la polea baja y colócala en el tobillo de adentro.","Párate de lado a la máquina, sosteniéndote para equilibrarte.","Cruza la pierna con la tobillera por delante de la otra.","Regresa despacio."],"Mantén el cuerpo derecho. Solo se mueve la pierna."],
copenhagen:[["Acuéstate de lado y apoya la rodilla o el tobillo interno de la pierna de arriba en un banco.","Apóyate en el antebrazo.","Sube la cadera hasta que el cuerpo quede en línea recta, con la pierna de abajo colgando.","Sostén el tiempo indicado y cambia de lado."],"Empieza con el banco bajo la rodilla; bajo el tobillo es mucho más difícil."],
sumo_squat:[["Párate con los pies muy abiertos, puntas hacia fuera, sosteniendo una mancuerna entre las piernas.","Mantén el pecho arriba.","Baja derecho empujando las rodillas hacia fuera sobre los pies.","Sube apretando aductores y glúteos."],"Las rodillas deben apuntar hacia el mismo lado que los pies."],
cable_abduction:[["Pon una tobillera en la polea baja y colócala en el tobillo de afuera.","Párate de lado a la máquina, sosteniéndote para equilibrarte.","Sube la pierna con la tobillera hacia el lado.","Regresa despacio."],"Mantén las puntas de los pies al frente y el cuerpo derecho."],
side_leg_raise:[["Acuéstate de lado con las piernas estiradas y una sobre otra.","Apoya la cabeza en el brazo.","Sube la pierna de arriba a unos 45°.","Baja despacio."],"Mantén las puntas de los pies al frente, no hacia arriba, para trabajar la cadera externa."],
band_walk:[["Pon una minibanda alrededor de las piernas, justo arriba de las rodillas o los tobillos.","Baja a un cuarto de sentadilla con los pies al ancho de hombros.","Da pasos laterales manteniendo la banda tensa.","Da 10–15 pasos hacia cada lado. Cada paso cuenta como una rep."],"Mantente abajo y no juntes los pies."],
fire_hydrant:[["Empieza en cuatro puntos.","Mantén la rodilla doblada a 90°.","Sube una rodilla hacia el lado hasta que el muslo quede casi a la altura de la cadera.","Baja y repite, luego cambia de lado."],"Mantén la cadera nivelada. No te inclines para subir más."],
rdl:[["Párate con una barra a la altura de los muslos, pies al ancho de cadera.","Con las rodillas suaves, lleva la cadera atrás y desliza la barra por las piernas.","Baja hasta sentir un fuerte estiramiento en los isquiotibiales (normalmente a media espinilla).","Empuja la cadera adelante para ponerte de pie."],"La barra se queda pegada a las piernas y la espalda recta. Es una bisagra de cadera, no una sentadilla."],
db_rdl:[["Párate con mancuernas frente a los muslos.","Con las rodillas suaves, lleva la cadera atrás y baja las mancuernas por las piernas.","Detente al sentir un fuerte estiramiento en los isquiotibiales.","Empuja la cadera adelante para ponerte de pie."],"Mantén las mancuernas cerca de las piernas todo el recorrido."],
lunge:[["Párate con mancuernas a los costados.","Da un paso largo al frente.","Baja hasta que ambas rodillas queden a unos 90°, con la rodilla de atrás justo encima del piso.","Empuja con el talón de adelante para volver al inicio. Alterna piernas."],"Mantén la rodilla de adelante sobre el pie, sin que se vaya hacia dentro."],
bss:[["Párate un paso largo delante de un banco, con mancuernas.","Apoya el empeine del pie de atrás en el banco.","Baja derecho hasta que el muslo de adelante quede casi paralelo al piso.","Empuja con el pie de adelante para subir. Termina una pierna y cambia."],"Encuentra la posición del pie sin peso primero. ¡Prepárate para sudar!"],
step_up:[["Párate frente a un banco o cajón con mancuernas.","Apoya todo un pie en el cajón.","Empuja con ese pie para subir al cajón.","Baja despacio. Termina una pierna y cambia."],"No te impulses con el pie de atrás. Que la pierna de adelante haga el trabajo."],
hip_thrust:[["Siéntate en el piso con la parte alta de la espalda contra un banco y una barra acolchada sobre la cadera.","Apoya los pies en el piso, más o menos al ancho de hombros.","Sube la cadera hasta que el cuerpo quede plano de los hombros a las rodillas.","Aprieta los glúteos arriba y baja."],"Mete la barbilla y mantén las costillas abajo. No arquees la espalda baja arriba."],

function scheme(ex){
  if(ex.inc==='run')return{sets:DIST.has(ex.id)?1:3,lo:0,hi:0};
  if(ex.inc==='cardio')return{sets:1,lo:S.settings.exp==='beginner'?10:S.settings.exp==='advanced'?25:20,hi:0};
  const g=S.settings.goal,x=S.settings.exp;let sets,lo,hi;
  if(ex.inc==='sec'){sets=3;lo=30;hi=60;}
  else if(ex.inc==='bw'){sets=3;lo=8;hi=20;if(g==='strength'){lo=5;hi=12;}}
  else if(g==='strength'){if(ex.c){sets=5;lo=3;hi=6;}else{sets=3;lo=8;hi=12;}}
  else if(g==='endurance'){sets=3;lo=12;hi=20;}
  else if(g==='fatloss'){sets=3;if(ex.c){lo=8;hi=12;}else{lo=12;hi=15;}}
  else{if(ex.c){sets=4;lo=6;hi=10;}else{sets=3;lo=10;hi=15;}}
  if(x==='beginner'&&sets>3)sets--;
  if(x==='advanced'&&ex.c)sets++;
  return{sets,lo,hi};
}

const USMC={
 pull:{m:{max:T_('20 23 23 23 21 20 19 18'),min:T_('4 5 5 5 5 5 4 3'),mp:40},f:{max:T_('7 11 12 11 10 8 6 4'),min:T_('1 3 4 3 3 2 2 2'),mp:60}},

 manuf:{lower:1,m:{max:T_('2:07 2:04 2:05 2:10 2:16 2:23 2:40 2:52'),min:T_('3:17 3:18 3:22 3:30 3:42 3:59 4:14 6:09'),mp:40},
      f:{max:T_('2:55 2:45 2:42 2:49 2:53 2:57 3:35 3:44'),min:T_('4:53 4:34 4:40 4:44 4:56 5:01 5:06 6:33'),mp:40}}};
const AGE_LBL=['17–20','21–25','26–30','31–35','36–40','41–45','46–50','51+'];
const ageIx=a=>{a=+a||0;return a<=20?0:a<=25?1:a<=30?2:a<=35?3:a<=40?4:a<=45?5:a<=50?6:7;};
const usmcSex=()=>S.settings.combatArms||S.settings.sex!=='f'?'m':'f';
function usmcPts(ev,v){
  const E=USMC[ev],t=E.n||E[usmcSex()],i=ageIx(S.settings.age),mx=t.max.length?t.max[i]:t.max,mn=t.min.length?t.min[i]:t.min;
  v=+v;if(!(v>0))return null;
  if(E.step)v=Math.ceil(v/E.step)*E.step;// run times are scored in 10-second steps
  const d=E.lower?(v-mx):(mx-v),r=E.lower?(mn-mx):(mx-mn);
  const top=E.top||100;if(d<=0)return top;if(d>r)return 0;
  return Math.floor(top-(top-t.mp)*d/r+0.5);
}
const USMC_EV={pft:[['pull','Pull-ups','Dominadas','reps'],['plank','Plank','Plancha','time'],['run','3-mile run','Carrera de 3 millas','time']],

function usmcLatest(){

function usmcRows(){tipsFor(usmcTest);
  const el=$('#usmcrows');if(!el)return;let tot=0,all=true,n=0;
  el.innerHTML=usmcEvs(usmcTest).map(([ev,en,es,kind])=>{const raw=usmcVals[ev],v=kind==='time'?(typeof raw==='number'?raw:tsec(raw)):+raw,p=v?usmcPts(ev,v):null;
    if(p!=null){n++;tot+=p;if(p===0)all=false;}
    const shown=raw===''||raw==null?'':kind==='time'&&typeof raw==='number'?fmtT(raw):raw;
    return`<div class="usrow"><div><b>${L(en,es)}</b><input type="text" inputmode="decimal" data-usmc="${ev}" value="${esc(shown)}" placeholder="${kind==='time'?'m:ss':L('reps','reps')}"></div><span class="uspts" style="color:${p==null?'var(--muted)':p===0?'var(--bad)':'var(--text)'}">${p==null?'—':p===0?L('below min','bajo mín.'):p}</span></div>`;}).join('')+

// men: abdomen (at navel) - neck; women: waist (narrowest) + buttocks - neck. Neck rounds up, the others down, to the 1/4 inch.
function afBfa(hIn,neck,a,b){
  const f=S.settings.sex==='f',M=AF_BF_META[f?'F':'M'];if(!(hIn>0&&neck>0&&a>0&&(!f||b>0)))return null;
  const cv=f?q4dn(a)+q4dn(b)-q4up(neck):q4dn(a)-q4up(neck),h=Math.round(hIn*2)/2;
  const out={cv,h,lim:M.lim};let ti=-1;
  for(let j=M.h0.length-1;j>=0;j--)if(h>=M.h0[j]){ti=j;break;}
  const col=ti<0?-1:Math.round((h-M.h0[ti])*2);if(ti<0||col>9){out.offH=1;return out;}
  const rows=afBfCol(M.t[ti],col),r=Math.round((cv-M.c0)*4);
  if(r<0){out.bf=rows[0];out.below=1;}else if(r>=rows.length){out.bf=rows[rows.length-1];out.above=1;}else out.bf=rows[r];
  out.pass=!out.above&&out.bf<=M.lim;return out;
}

function afSum(v,pick){
  const r=afWhtr(toIn(afVal('w',v.w)),toIn(afVal('h',v.h))),bc=afWhtrPts(r);
  const one=k=>{const x=afVal(k,v[k]);return x?afPts(k,x):null;};
  const s=one(pick.str),c=one(pick.core),walk=pick.card==='walk';
  const cd=walk?null:one(pick.card),go=walk?(()=>{const x=afVal('walk',v.walk);return x?x<=afWalkMax():null;})():null;
  const parts=[bc,s,c,walk?(go==null?null:0):cd],full=parts.every(x=>x!=null);
  const tot=[bc,s,c,cd].reduce((a,b)=>a+(b||0),0),fails=(s===0)+(c===0)+(!walk&&cd===0)+(walk&&go===false);
  return{r,bc,s,c,cd,go,walk,full,tot:walk?Math.round(((bc||0)+(s||0)+(c||0))/50*1000)/10:tot,fails};
}
function afVerdict(x){

function afRows(){tipsFor('pfra');

      let sc=pr.reduce((a,b)=>a+b,0)/pr.length+Math.random()*15;
      if(ex.c)sc+=i<Math.ceil(N/2)?20:-5;
      if(lastIds.has(ex.id))sc-=10;
      if(Math.min(...pr)<40)sc-=60;
      const core=x=>x.p.some(m=>m==='abs'||m==='obliques');
      if(f!=='core'&&core(ex)&&chosen.some(core))sc-=60;
      if(f!=='calis'&&hasWeights&&!isLoad(ex)&&!core(ex)&&!['pullup','chinup','dip'].includes(ex.id))sc-=15;
      if(sc>bs){bs=sc;best=ex;}
    }
    if(!best)break;
    chosen.push(best);
    best.p.forEach(m=>{sim[m]-=30;hits[m]=(hits[m]||0)+1;});
    best.s.forEach(m=>sim[m]-=10);
  }
  chosen.sort((a,b)=>b.c-a.c);
  return{focus:f,list:chosen,skipped};
}

// pick a partner: opposite muscle first (push/pull, biceps/triceps, quads/hams), never overlapping the first exercise, never loading an injury
function ssPartner(base,list){
  const have=new Set(list.map(e=>e.exId)),rec=recovery(),ant=new Set([].concat(...base.p.map(m=>SS_ANT[m]||[]))),main=new Set(SS_ANT[base.p[0]]||[]);

    const n=['cal','p','c','f'].filter(k=>r[k]!=='').length;
    if(n===4&&!est){const m=9*r.f+4*r.c+4*r.p;if(Math.abs(m-r.cal)>Math.max(40,.3*m)){foodForm({name:'',sv:1,cal:r.cal,p:r.p,c:r.c,f:r.f},{t:`Check the calories: the label reader found ${r.cal}, but the protein, carbs and fat add up to about ${Math.round(m)}. Fix whichever number is wrong.`});const c=$('#f_cal');if(c)c.style.borderColor='var(--warn)';return;}}
    foodForm({name:'',sv:1,cal:r.cal,p:r.p,c:r.c,f:r.f},n===4?{ok:1,t:est?'Found protein, carbs and fat. Calories were estimated from them, so check against the label.':'Found all 4 values. Check them against the label, then add.'}:n?{t:`Found ${n} of 4 values. Fill in the rest from the label.`}:{t:"Couldn't read the label. Try a closer, straight-on photo in good light, or type the numbers in."});

// Parse OCR text from a nutrition label -> {cal,p,c,f} (per serving). Values '' if not found.
function parseLabel(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean),low=lines.map(l=>l.toLowerCase());
  const tokOf=rest=>{
    const toks=rest.replace(/[()]/g,' ').split(/\s+/).filter(Boolean);let val=null,pct=null;
    for(const t of toks){
      if(/%$/.test(t)){if(val&&pct==null){const q=parseFloat(t.replace(/[oO]/g,'0'));if(isFinite(q))pct=q;}continue;}
      if(val)continue;
      const m=t.match(/^([\dOoIl][\dOoIl.,]*)(mg|g|kcal|cal)?[.,:;]?$/);
      if(!m||!(/\d/.test(m[1])||m[2]))continue;
      const raw=m[1].replace(/[oO]/g,'0').replace(/[lI]/g,'1').replace(',','.');if(!/^\d+(\.\d+)?$/.test(raw))continue;
      val={raw,unit:(m[2]||'').toLowerCase()};
    }
    return val?Object.assign(val,{pct}):null;
  };
  const find=(prefer,fallback,bad)=>{
    for(const re of [prefer,fallback]){if(!re)continue;
      for(let i=0;i<low.length;i++){const m=low[i].match(re);if(!m||(bad&&bad.test(low[i])))continue;
        const t=tokOf(lines[i].slice(m.index+m[0].length));if(t)return t;}}
    return null;
  };
  const cands=(t,dv)=>{if(!t)return[];let v=+t.raw;if(t.unit==='mg')v=v/1000;const out=[];
    if(!t.unit&&/9$/.test(t.raw)&&t.raw.length>1&&!t.raw.includes('.'))out.push(+t.raw.slice(0,-1));
    out.push(v);
    if(t.pct!=null&&dv)out.sort((a,b)=>Math.abs(a-t.pct*dv/100)-Math.abs(b-t.pct*dv/100));
    return out;};
  // calories
  let cal='';
  for(const l of low){const m=l.match(/(\d[\d.,]*)\s*kcal/);if(m){cal=parseFloat(m[1].replace(',','.'));break;}}
  if(cal===''){for(let i=0;i<low.length;i++){if(!/calories|calorie/.test(low[i])||/from fat/.test(low[i]))continue;
    const t=tokOf(lines[i].slice(low[i].search(/calorie/)).replace(/^\S+/,''))||(lines[i+1]?tokOf(lines[i+1]):null);if(t){cal=+t.raw;break;}}}
  const F=find(/total\s*fat/,/\bfat\b/,/saturat|trans|poly|mono|from fat|sat\./);
  const C=find(/total\s*carb[a-z]*/,/carbohydrates?|\bcarbs?\b/,/of which|sugar|fib(er|re)/);
  const P=find(/protein/,null,null);
  const cf=cands(F,78),cc=cands(C,275),cp=cands(P,50);
  const pick={f:cf[0]??'',c:cc[0]??'',p:cp[0]??''};
  if(cal!==''&&cf.length&&cc.length&&cp.length){let best=1e9;
    cf.forEach((f,i)=>cc.forEach((c,j)=>cp.forEach((p,k)=>{const s=Math.abs(9*f+4*c+4*p-cal)+3*(i+j+k);if(s<best){best=s;pick.f=f;pick.c=c;pick.p=p;}})));}
  return{cal,p:pick.p,c:pick.c,f:pick.f};
}

// ---------- body weight log ----------
function logWeight(v,day){
  v=parseFloat(v);if(!(v>0))return;day=day||dk(Date.now());
  S.weights=S.weights.filter(x=>x.d!==day);S.weights.push({d:day,w:v,u:U()});S.weights.sort((a,b)=>a.d<b.d?-1:1);

const dayNum=d=>{const[y,m,x]=d.split('-').map(Number);return Math.round(new Date(y,m-1,x).getTime()/864e5);};
function weightTrend(){
  // Smoothed trend (exponential moving average, 10% per day) so daily water swings don't hide the real direction.
  const pts=S.weights.map(x=>({d:x.d,n:dayNum(x.d),w:+conv(x.w,x.u)}));let ema=null,prev=null;
  for(const p of pts){if(ema==null)ema=p.w;else ema+=(1-Math.pow(.9,p.n-prev))*(p.w-ema);p.t=ema;prev=p.n;}
  let rate=null;if(pts.length>=3){const last=pts[pts.length-1],ref=pts.filter(p=>p.n<=last.n-7);const base=ref.length?ref[ref.length-1]:pts[0];
    if(last.n-base.n>=5)rate=(last.t-base.t)/(last.n-base.n)*7;}
  return{pts,rate};
}
function weightChart(pts){
  const P=pts.slice(-90),W=340,H=160,pl=8,pr=8,pt=12,pb=22;
  const vs=P.flatMap(p=>[p.w,p.t]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<2){mn-=1;mx+=1;}const pad=(mx-mn)*.1;mn-=pad;mx+=pad;
  const n0=P[0].n,n1=P[P.length-1].n,x=n=>n1===n0?W/2:pl+(n-n0)/(n1-n0)*(W-pl-pr),y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=P.map(p=>x(p.n).toFixed(1)+','+y(p.t).toFixed(1)).join(' ');
  return`<svg viewBox="0 0 ${W} ${H}" class="chart">${P.map(p=>`<circle cx="${x(p.n).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="2.6" fill="#8b92a1" opacity=".55"/>`).join('')}<polyline points="${line}" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="${pl}" y="${H-5}" class="ct">${shortDate(new Date(n0*864e5+432e5))}</text><text x="${W-pr}" y="${H-5}" class="ct" text-anchor="end">${shortDate(new Date(n1*864e5+432e5))}</text><text x="${W-pr}" y="${pt+4}" class="ct" text-anchor="end">${Math.round(mx)}</text><text x="${W-pr}" y="${H-pb}" class="ct" text-anchor="end">${Math.round(mn)}</text></svg>`;
}
function goalCheck(rate){

}

async function lookupBarcode(raw){

  else if(kcal('_100g')!=null&&sq>0){const k=sq/100;v={cal:kcal('_100g')*k,p:(get('proteins','_100g')??0)*k,c:(get('carbohydrates','_100g')??0)*k,f:(get('fat','_100g')??0)*k};msg=`Found ${name}. Values are per serving (${prod.serving_size||sq+' g'}). Check them, then add.`;}
  else if(kcal('_100g')!=null){v={cal:kcal('_100g'),p:get('proteins','_100g'),c:get('carbohydrates','_100g'),f:get('fat','_100g')};msg=`Found ${name}. Values are per 100 g, so set servings to match (e.g. 0.5 for 50 g).`;}
  if(!v){foodForm({name,sv:1,cal:'',p:'',c:'',f:'',bc:code},{alt:1,t:`Found ${name}, but it has no nutrition info. Scan the nutrition label instead.`});return;}

// ---------- streaks & motivation ----------
// A streak survives rest days: it only breaks after 3+ days in a row with no workout.
const MAX_REST=2,MILESTONES=[3,7,14,21,30,50,75,100,150,200,250,300,365];
const todayNum=()=>dayNum(dk(Date.now()));
function workoutDays(){return[...new Set(S.workouts.map(w=>dayNum(dk(w.end))))].sort((a,b)=>a-b);}
// Field mode (service members only): pick the day you leave and the day you're back.
// Days in between don't break the streak or add to it. On the day you're back you must work out, or the streak resets.
// Only those two dates are kept so the streak math can bridge the gap. Nothing else is stored or sent.
const fieldOK=()=>!!S.settings.branch&&S.settings.branch!=='none';
const dnDate=n=>new Date(n*864e5+12*3600e3);          // day number -> a Date in the middle of that day
const fieldList=()=>fieldOK()?(S.settings.fieldB||[]):[];
const fieldPlan=()=>{const t=todayNum();return fieldList().find(([a,b])=>b>=t)||null;};   // the current or upcoming field period
const fieldNow=()=>{const t=todayNum();return fieldList().find(([a,b])=>a<=t&&t<b)||null;};
function fieldExcused(days,t){const ex=new Set();
  for(const[a,b]of fieldList()){if(b<t&&!days.has(b))continue;for(let d=a;d<b&&d<=t;d++)ex.add(d);}
  return ex;}
function fieldSave(a,b){const t=todayNum(),days=new Set(workoutDays());
  S.settings.fieldB=(S.settings.fieldB||[]).filter(([x,y])=>y<t&&days.has(y));   // keep finished periods that still bridge a streak; drop the old plan
  if(a!=null)S.settings.fieldB.push([a,b]);save();}
function fieldForm(){const p=fieldPlan(),t=todayNum(),v=n=>dk(dnDate(n).getTime());
  showModal(`<div data-notr="1"><div class="sheethead"><h3>🏕 ${L('Field time','Tiempo en el campo')}</h3><button class="icon" data-a="close" aria-label="Close">✕</button></div>
  <p class="muted small" style="margin-top:0">${L('Days in the field won\'t break your streak. <b>Work out on the day you\'re back</b> or your streak resets.','Los días en el campo no romperán tu racha. <b>Entrena el día que regreses</b> o tu racha se reinicia.')}</p>
  <div class="field"><label class="lbl">${L('Leaving','Salida')}</label><input type="date" id="fleave" value="${p?v(p[0]):v(t)}" min="${v(t-14)}"></div>
  <div class="field"><label class="lbl">${L('Back','Regreso')}</label><input type="date" id="fback" value="${p?v(p[1]):''}" min="${v(t)}"></div>
  <button class="btn primary" data-a="fieldsave">${L('Save','Guardar')}</button>
  ${p?(p[0]<=t?`<button class="btn ghost" data-a="fieldback">🏠 ${L('I\'m back early (today)','Regresé antes (hoy)')}</button>`:`<button class="btn ghost" data-a="fieldclear">${L('Cancel field time','Cancelar tiempo en el campo')}</button>`):''}</div>`);}
function fieldFormSave(){const lv=$('#fleave').value,bk=$('#fback').value,t=todayNum();
  if(!lv||!bk){toast(L('Pick both dates','Elige ambas fechas'));return;}
  const a=dayNum(lv),b=dayNum(bk);
  if(b<=a){toast(L('The back date has to be after the leaving date','La fecha de regreso debe ser después de la salida'));return;}
  if(b<t){toast(L('The back date can\'t be in the past','La fecha de regreso no puede ser pasada'));return;}
  if(a<t-14){toast(L('The leaving date can be at most 2 weeks ago','La salida puede ser como máximo hace 2 semanas'));return;}
  if(b-a>90){toast(L('Field time can be up to 90 days','El tiempo en el campo puede ser de hasta 90 días'));return;}
  fieldSave(a,b);closeModal();render();toast(L(`🏕 Field time saved: ${shortDate(dnDate(a))} – ${shortDate(dnDate(b))}`,`🏕 Tiempo en el campo guardado: ${shortDate(dnDate(a))} – ${shortDate(dnDate(b))}`));}
function fieldStatus(){const p=fieldPlan(),t=todayNum();if(!p)return L('Going to the field? Pick the day you leave and the day you\'re back, and missed days in between won\'t break your streak.','¿Vas al campo? Elige el día que sales y el día que regresas, y los días sin entrenar en medio no romperán tu racha.');
  const r=`${shortDate(dnDate(p[0]))} – ${shortDate(dnDate(p[1]))}`;
  return p[1]===t?L(`Back today (${r}). Work out today to keep your streak.`,`Regreso hoy (${r}). Entrena hoy para mantener tu racha.`):p[0]<=t?L(`In the field: ${r}. Your streak is paused. Work out on the day you\'re back.`,`En el campo: ${r}. Tu racha está en pausa. Entrena el día que regreses.`):L(`Planned: ${r}. Work out on the day you\'re back.`,`Planeado: ${r}. Entrena el día que regreses.`);}
function streakInfo(){
  const arr=workoutDays(),days=new Set(arr),t=todayNum(),ex=fieldExcused(days,t);
  const runs=[];let start=null,last=null,count=0,exc=0,excAtLast=0,miss=0;
  if(arr.length)for(let d=arr[0];d<=t;d++){
    if(days.has(d)){if(start==null){start=d;count=0;exc=0;}count++;last=d;miss=0;excAtLast=exc;}
    else if(ex.has(d)){if(start!=null)exc++;}
    else if(start!=null&&++miss>MAX_REST){runs.push({start,end:last,count,exc:excAtLast});start=null;miss=0;}}
  const alive=start!=null;if(alive)runs.push({start,end:last,count,exc:excAtLast});

function injAreasRender(){const el=$('#injareas');if(!el||!injDraft)return;

function vRecovery(){
  const f=fatigue();
  const rows=Object.keys(MUSCLES).map(m=>{
    const r=Math.round(100-f[m]),ready=f[m]>15?Math.ceil(TAU*Math.log(f[m]/15)):0,lt=lastTrained(m);
    return`<div class="rec"><div class="rechead"><span>${MUSCLES[m]}</span><span class="${cls(r)}">${r}%</span></div><div class="track"><div class="fill ${cls(r)}" style="width:${r}%"></div></div><div class="muted small">${ready?'Ready in ~'+ready+'h':'Ready to train'}${lt?' · trained '+ago(lt):''}</div></div>`;
  }).join('');
  return`<h1>Recovery</h1><p class="muted small">Estimated from your logged sets. Muscles typically recover over 2–3 days, and the generator favors the freshest ones.</p><div class="card">${rows}</div>`;
}

function chart(pts){
  const W=340,H=170,pl=10,pr=10,pt=16,pb=24,vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1;}const pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  const x=i=>pts.length===1?W/2:pl+i*(W-pl-pr)/(pts.length-1);

  const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const area=x(0).toFixed(1)+','+(H-pb)+' '+line+' '+x(pts.length-1).toFixed(1)+','+(H-pb);
  return`<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b35" stop-opacity=".35"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#cg)"/><polyline points="${line}" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="#ff6b35"/>`).join('')}<text x="${pl}" y="${H-6}" class="ct">${shortDate(pts[0].t)}</text><text x="${W-pr}" y="${H-6}" class="ct" text-anchor="end">${shortDate(pts[pts.length-1].t)}</text></svg>`;

  if(out.vat!==''){const raw=find(/\bvat\b|visceral/i,/volume|area|in3|cm3|cm2|in2/i,(c,l)=>{for(const x of c){if(x.u==='%')continue;const unit=x.u.startsWith('lb')?'lb':x.u==='kg'?'kg':x.u==='g'?'g':lineUnit(l);const v=toUser(x.v,unit);if(v>=0&&v<=30)return Math.round(v*100)/100;}return null;});if(raw!=null)out.vat=raw;}
  const ag=after(/\ba\s*[\/jl1|i]\s*g\b(\s*ratio)?|android\s*\/?\s*gynoid(\s*ratio)?/,.3,2.5);if(ag!=null)out.ag=ag;
  const ts=after(/\bt[\s-]*score/,-6,6);if(ts!=null)out.t=ts;
  const zs=after(/\bz[\s-]*score/,-6,6);if(zs!=null)out.z=zs;
  const rmr=after(/\brmr\b\)?|resting\s*metabolic\s*rate(\s*\(rmr\))?/,800,5000);if(rmr!=null)out.rmr=Math.round(rmr);
  for(let i=0;i<lines.length;i++){const h=lines[i].toLowerCase();if(!(/fat\s*mass/.test(h)&&/total\s*mass/.test(h)))continue;
    const cols=[['fat',h.search(/fat\s*mass/)],['lean',h.search(/lean/)],['weight',h.search(/total\s*mass/)],['bf',h.search(/%\s*fat|fat\s*%/)]].filter(c=>c[1]>=0).sort((a,b)=>a[1]-b[1]);
    const g=/\(\s*g\s*\)/.test(h);
    for(let j=i+1;j<Math.min(lines.length,i+40);j++){if(!/^total\b/i.test(lines[j]))continue;const v=nums(lines[j].replace(/^total/i,'')).map(x=>x.v);if(v.length<cols.length)break;
      cols.forEach(([k],ix)=>{const x=v[ix];if(k==='bf'){if(x>=2&&x<=70)out.bf=Math.round(x*10)/10;}else{const m=toUser(x,g?'g':lineUnit(h));out[k]=Math.round(m*10)/10;if(k==='lean'&&/lean\s*\+\s*bmc/.test(h))out._leanBmc=1;}});break;}
    break;}
  // a lean figure that includes bone (Hologic "Lean + BMC") -> subtract BMC so lean is soft tissue only
  if(out.lean!==''&&out.bmc!==''&&(out._leanBmc||lines.some(l=>/lean\s*\+\s*bmc/i.test(l))))out.lean=Math.round((out.lean-out.bmc)*10)/10;delete out._leanBmc;
  if(out.weight===''&&out.fat!==''&&out.lean!=='')out.weight=Math.round((out.fat+out.lean+(out.bmc||0))*10)/10;
  const dm=fixNum(String(text)).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(dm){let y=+dm[3];if(y<100)y+=2000;const m=+dm[1],d=+dm[2];if(m>=1&&m<=12&&d>=1&&d<=31&&y>=2000){const iso=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(iso<=dk(Date.now()))out.d=iso;}}
  return out;
}

const MUSCLE_WORDS={chest:'chest pecs pec pectoral pectorals pecho pectorales',shoulders:'shoulders shoulder delts delt deltoid deltoids hombros hombro deltoides',
 triceps:'triceps tricep tri triceps arms arm brazos brazo',biceps:'biceps bicep bis biceps arms arm brazos brazo',forearms:'forearms forearm grip wrist wrists antebrazos antebrazo agarre muneca munecas arms arm brazos brazo',

 lowerback:'lower back low back lumbar erectors erector back espalda baja lumbares espalda',abs:'abs ab abdominals abdominal core six pack abdomen abdominales',
 obliques:'obliques oblique side abs core oblicuos oblicuo',quads:'quads quad quadriceps quadricep thighs thigh cuadriceps muslos muslo legs leg piernas pierna',
 hamstrings:'hamstrings hamstring hammies isquiotibiales isquios femoral femorales legs leg piernas pierna',adductors:'adductors adductor inner thighs inner thigh groin aductores aductor ingle legs leg piernas pierna',
 abductors:'abductors abductor outer hips outer hip hip abductors abductores abductor cadera legs leg piernas pierna',glutes:'glutes glute gluteus butt booty glúteos gluteos gluteo legs leg piernas pierna',
 calves:'calves calf gastrocnemius soleus pantorrillas pantorrilla gemelos gemelo legs leg piernas pierna'};
let MW=null;
function musclesFor(qf){
  if(qf.length<3)return new Set();
  if(!MW){MW={};const f=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    for(const m in MUSCLE_WORDS){const w=f(MUSCLE_WORDS[m]+' '+MUSCLES[m]);const words=new Set(w.split(' '));
      // two-word names like "upper back", "inner thigh"
      const parts=w.split(' ');for(let i=0;i<parts.length-1;i++)words.add(parts[i]+' '+parts[i+1]);MW[m]=[...words];}}
  const out=new Set();for(const m in MW)if(MW[m].some(w=>w===qf||(w.startsWith(qf)&&qf.length>=4)||(qf.startsWith(w)&&w.length>=4&&qf.length-w.length<=2)))out.add(m);
  return out;
}
function renderPickerList(){
  if(!S.active)return;

  const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),qf=fold(q);
  const MM=q?musclesFor(qf):new Set(),how={};
  if(q)list=list.filter(ex=>{
    if(ex.p.some(m=>MM.has(m)))return how[ex.id]=1;
    if(ex.s.some(m=>MM.has(m)))return how[ex.id]=2;
    if([ex.name,tr(ex.name),...ex.p.map(m=>MUSCLES[m]),...ex.p.map(m=>tr(MUSCLES[m]))].some(s=>fold(s).includes(qf)))return how[ex.id]=3;
    return false;});
  else if(pick.mode==='swap'){const cur=EX(S.active.exercises[pick.i].exId);if(cur)list=list.filter(ex=>ex.p.some(m=>cur.p.includes(m)));}
  list.sort((a,b)=>(hasEq(b)-hasEq(a))||((how[a.id]||0)-(how[b.id]||0))||tr(a.name).localeCompare(tr(b.name),LOC()));
  $('#plist').innerHTML=(!q&&pick.mode!=='swap'?tplPickerHtml():'')+list.map(ex=>`<button class="pitem ${hasEq(ex)?'':'dim'}" data-a="pick" data-id="${esc(ex.id)}"><b>${esc(ex.name)}</b><span class="muted small">${ex.p.map(m=>MUSCLES[m]).join(', ')}${how[ex.id]===2?' · also works '+ex.s.filter(m=>MM.has(m)).map(m=>MUSCLES[m]).join(', '):''}${hasEq(ex)?'':' · needs '+ex.eq.filter(k=>!S.settings.equip.includes(k)).map(k=>EQUIP[k]).join(', ')}</span>${injuryFor(ex)?`<span class="small warn">⚠️ May aggravate: ${INJ_AREAS[injuryFor(ex).area]}</span>`:''}</button>`).join('')||'<p class="muted">No matches.</p>';

      const n0=Math.min(...e.sets.map(s=>runVal(ex,s,a.unit)).filter(v=>v>0));if(isFinite(b0)&&isFinite(n0)&&n0<b0)prs.push(esc(ex.name)+' — '+(DIST.has(ex.id)?fmtPace(n0,ex):fmtT(n0)));continue;}
    let before=0;

    let now=0,bs=null;for(const s of e.sets){const v=metric(ex,+conv(s.w,a.unit)||0,s.r);if(v>now){now=v;bs=s;}}
    const added=bs&&+conv(bs.w,a.unit)>0?'+'+conv(bs.w,a.unit)+' '+U()+' × '+bs.r+(ex.inc==='sec'?'s':''):null;
    if(before>0&&now>before)prs.push(esc(ex.name)+' — '+(isLoad(ex)?'est. 1RM '+Math.round(now)+' '+U():added?added:ex.inc==='sec'?now+'s':now+' reps'));
  }
  const w={id:uid(),start:a.start,end:Date.now(),focus:a.focus,unit:a.unit,exercises:exs};

  const ups=Object.keys(MUSCLES).filter(m=>after[m]&&(!before[m]||after[m].i>before[m].i));
  const upHtml=ups.length?'<h3>Rank ups ⬆</h3>'+ups.map(m=>`<div class="rk">${badge(after[m].i,32)}<div class="rkbody"><b>${MUSCLES[m]}</b> <span style="color:${rankColor(after[m].i)};font-weight:700">${rankName(after[m].i)}</span></div></div>`).join(''):'';
  const usHtml=w.focus==='aft'?aftDone(exs):w.focus==='pfra'?afDone(exs):w.focus==='prt'?nvDone(exs):TESTS.has(w.focus)&&S.settings.age>=17?(()=>{const v=usmcLatest(),evs=usmcEvs(w.focus),ids={pull:'pullup',push:'pushup',plank:'plank',run:'run_3mi',mtc:'run_880',acl:'ammo_press'};
    const inW=evs.filter(([ev])=>exs.some(e=>e.exId===ids[ev]));if(!inW.length)return'';
    const ps=inW.map(([ev])=>usmcPts(ev,v[ev])),tot=ps.reduce((x,y)=>x+(y||0),0),full=inW.length===3&&ps.every(x=>x!=null);
    return`<div data-notr="1"><h3>🎖 ${L('Estimated test points','Puntos estimados de la prueba')}</h3>${inW.map(([ev,en,es],k)=>{const p=ps[k];return`<div class="pr">${L(en,es)}: <b>${p==null?'—':p===0?L('below min','bajo mín.'):p}</b></div>`;}).join('')}${full?(()=>{const [c,col]=usmcClass(tot,ps.every(x=>x>0));return`<div class="ustot"><span>${L('Total','Total')}</span><b>${tot}</b><span style="color:${col};font-weight:700">${c}</span></div>`;})():''}</div>`;})():'';
  if(TESTS.has(w.focus)&&usHtml)recordScore(w.focus,scoreOf(w.focus));
  if(gOn()&&prs.length){G().prDay={d:dk(w.end),n:prs.length};}
  const gRes=gOn()?workoutXP(w,prs.length,ups.length):null;gameTick();
  const ckcal=exs.reduce((a,e)=>{const x=EX(e.exId);if(!x)return a;if(x.inc==='cardio')return a+cardioKcal(e.exId,e.sets.reduce((q,s)=>q+(+s.r||0),0));
    if(SWIM.has(x.id)){const kg=U()==='lb'?bodyW()*0.45359237:bodyW(),min=e.sets.reduce((q,s)=>q+tsec(s.r),0)/60;return a+(kg?Math.round(SWIM_MET*kg*min/60):0);}return a;},0);
  const cHtml=ckcal?`<div class="ustot" style="margin:0 0 12px"><span>🔥 ${L('Cardio','Cardio')}</span><b>≈ ${ckcal}</b><span class="muted small">kcal</span></div><button class="btn ghost" style="margin:0 0 12px" data-a="addburn" data-k="${ckcal}">${L("Add to today's calories burned","Sumar a las calorías quemadas de hoy")}</button>`:'';

async function exportData(){
  const name='forge-backup-'+new Date().toISOString().slice(0,10)+'.json';
  S.settings.lastBackup=Date.now();save();
  const file=new File([JSON.stringify(S)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Forge backup'});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function toCode(){const b=new TextEncoder().encode(JSON.stringify(S));let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return'FORGE1:'+btoa(s);}
function fromCode(t){t=(t||'').replace(/\s+/g,'');const i=t.indexOf('FORGE1:');if(i<0)throw 0;const s=atob(t.slice(i+7)),b=new Uint8Array(s.length);for(let k=0;k<s.length;k++)b[k]=s.charCodeAt(k);return JSON.parse(new TextDecoder().decode(b));}
function restore(d){if(!d||!d.settings||!Array.isArray(d.workouts))throw 0;
  if(!ask('Replace the data on this phone with this backup ('+d.workouts.length+' workouts)?'))return false;
  S=merge(d);rebuild();save();render();toast('Backup restored');return true;}
async function copyBackup(){
  const code=toCode();S.settings.lastBackup=Date.now();save();if(tab==='workout')render();
  try{await navigator.clipboard.writeText(code);toast('Backup copied — paste it in Notes or a message to yourself');return;}catch(e){}
  showModal(`<div class="sheethead"><h3>Copy backup</h3><button class="icon" data-a="close" aria-label="Close">✕</button></div><p class="muted small">Tap in the box, Select All, then Copy.</p><textarea id="bkout" readonly>${esc(code)}</textarea>`);
  const t=$('#bkout');t.focus();t.select();
}
function pasteBackup(){showModal(`<div class="sheethead"><h3>Paste backup</h3><button class="icon" data-a="close" aria-label="Close">✕</button></div><p class="muted small">Paste the backup text you copied from your old phone. It starts with FORGE1:</p><textarea id="bkin" placeholder="FORGE1:..."></textarea><button class="btn primary" data-a="dorestore">Restore</button>`);}
function importFile(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.settings||!Array.isArray(d.workouts))throw 0;
    if(!ask('Replace your current data with this backup ('+d.workouts.length+' workouts)?'))return;
    S=merge(d);rebuild();save();render();toast('Backup restored');}catch(e){toast("That file isn't a Forge backup");}};
  rd.readAsText(f);
}

    case'delw8':if(ask('Delete this weight entry?')){S.weights=S.weights.filter(x=>x.d!==b.dataset.d);const l=S.weights[S.weights.length-1];if(l){S.settings.bw=+conv(l.w,l.u);S.settings.bwUnit=U();}save();render();}break;

    case'injheal':if(ask('Mark this injury as healed? Those exercises will come back in generated workouts.')){S.injuries=(S.injuries||[]).filter(x=>x.id!==b.dataset.id);save();render();toast('Glad you\'re healed! 💪');}break;

    case'savenut':{const x=readNut();if(!calcTargets(x,x.bw)){toast('Fill in your age, height and body weight');break;}
      logWeight(x.bw);if(x.goal==='lose'&&x.gw>0)setGoalW(x.gw);if(x.sex)S.settings.sex=x.sex;if(x.age>=13)S.settings.age=Math.round(x.age);S.settings.nut={goal:x.goal,sex:x.sex,age:x.age,cm:x.cm,act:x.act,auto:true};save();closeModal();render();toast('Targets set');break;}
    case'picklang':{const l=b.dataset.l;S.settings.lang=l;S.settings.langChosen=true;save();document.documentElement.lang=l;modalLocked=false;closeModal();render();if(!S.settings.onboarded)onboarding();break;}
