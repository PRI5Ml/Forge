// Mifflin-St Jeor BMR x activity = maintenance calories; goal adjusts it.
function calcTargets(n,bwOverride){
  if(!n)return null;const bw=bwOverride!=null?bwOverride:bodyW();
  const kg=U()==='lb'?bw*0.45359237:bw,cm=+n.cm,age=+n.age;
  if(!(kg>25&&cm>100&&age>=13))return null;
  const bmr=10*kg+6.25*cm-5*age+(n.sex==='f'?-161:5),tdee=bmr*(+n.act||1.375);
  const mult={lose:.8,maintain:1,gain:1.1}[n.goal]||1;
  let cal=Math.max(tdee*mult,n.sex==='f'?1200:1500);cal=Math.round(cal/10)*10;
  const lbs=kg/0.45359237,p=Math.round(lbs*({lose:1,maintain:.8,gain:.9}[n.goal]||.8));
  const f=Math.round(cal*(n.goal==='maintain'?.3:.25)/9),c=Math.max(50,Math.round((cal-4*p-9*f)/4));
  return{cal,p,c,f,tdee:Math.round(tdee/10)*10};
}

function fileToCanvas(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{

  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
  const th=document.createElement('canvas'),tk=Math.min(1,360/Math.max(w,h));th.width=Math.round(w*tk);th.height=Math.round(h*tk);th.getContext('2d').drawImage(c,0,0,th.width,th.height);scanThumb=th.toDataURL('image/jpeg',.7);

// Even out shadows/uneven light, then boost contrast (helps text recognition a lot).
function cleanLight(d){
  const w=d.width,h=d.height,p=d.data,g=new Float32Array(w*h);
  for(let i=0,j=0;j<w*h;i+=4,j++)g[j]=.299*p[i]+.587*p[i+1]+.114*p[i+2];
  const W=w+1,I=new Float64Array(W*(h+1));

// Parse OCR text from a nutrition label -> {cal,p,c,f} (per serving). Values '' if not found.
function parseLabel(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean),low=lines.map(l=>l.toLowerCase());
  const tokOf=rest=>{
    const toks=rest.replace(/[()]/g,' ').split(/\s+/).filter(Boolean);let val=null,pct=null;
    for(const t of toks){
      if(/%$/.test(t)){if(val&&pct==null){const q=parseFloat(t.replace(/[oO]/g,'0'));if(isFinite(q))pct=q;}continue;}
      if(val)continue;
      const m=t.match(/^([\dOoIl][\dOoIl.,]*)(mg|g|kcal|cal)?[.,:;]?$/);
      if(!m||!(/\d/.test(m[1])||m[2]))continue;
      const raw=m[1].replace(/[oO]/g,'0').replace(/[lI]/g,'1').replace(',','.');if(!/^\d+(\.\d+)?$/.test(raw))continue;
      val={raw,unit:(m[2]||'').toLowerCase()};
    }
    return val?Object.assign(val,{pct}):null;
  };
  const find=(prefer,fallback,bad)=>{
    for(const re of [prefer,fallback]){if(!re)continue;
      for(let i=0;i<low.length;i++){const m=low[i].match(re);if(!m||(bad&&bad.test(low[i])))continue;
        const t=tokOf(lines[i].slice(m.index+m[0].length));if(t)return t;}}
    return null;
  };
  const cands=(t,dv)=>{if(!t)return[];let v=+t.raw;if(t.unit==='mg')v=v/1000;const out=[];
    if(!t.unit&&/9$/.test(t.raw)&&t.raw.length>1&&!t.raw.includes('.'))out.push(+t.raw.slice(0,-1));
    out.push(v);
    if(t.pct!=null&&dv)out.sort((a,b)=>Math.abs(a-t.pct*dv/100)-Math.abs(b-t.pct*dv/100));
    return out;};
  // calories
  let cal='';
  for(const l of low){const m=l.match(/(\d[\d.,]*)\s*kcal/);if(m){cal=parseFloat(m[1].replace(',','.'));break;}}
  if(cal===''){for(let i=0;i<low.length;i++){if(!/calories|calorie/.test(low[i])||/from fat/.test(low[i]))continue;
    const t=tokOf(lines[i].slice(low[i].search(/calorie/)).replace(/^\S+/,''))||(lines[i+1]?tokOf(lines[i+1]):null);if(t){cal=+t.raw;break;}}}
  const F=find(/total\s*fat/,/\bfat\b/,/saturat|trans|poly|mono|from fat|sat\./);
  const C=find(/total\s*carb[a-z]*/,/carbohydrates?|\bcarbs?\b/,/of which|sugar|fib(er|re)/);
  const P=find(/protein/,null,null);
  const cf=cands(F,78),cc=cands(C,275),cp=cands(P,50);
  const pick={f:cf[0]??'',c:cc[0]??'',p:cp[0]??''};
  if(cal!==''&&cf.length&&cc.length&&cp.length){let best=1e9;
    cf.forEach((f,i)=>cc.forEach((c,j)=>cp.forEach((p,k)=>{const s=Math.abs(9*f+4*c+4*p-cal)+3*(i+j+k);if(s<best){best=s;pick.f=f;pick.c=c;pick.p=p;}})));}
  return{cal,p:pick.p,c:pick.c,f:pick.f};
}

}

  const n0=P[0].n,n1=P[P.length-1].n,x=n=>n1===n0?W/2:pl+(n-n0)/(n1-n0)*(W-pl-pr),y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);

// ---------- streaks & motivation ----------
// A streak survives rest days: it only breaks after 3+ days in a row with no workout.
const MAX_REST=2,MILESTONES=[3,7,14,21,30,50,75,100,150,200,250,300,365];
const todayNum=()=>dayNum(dk(Date.now()));
function workoutDays(){return[...new Set(S.workouts.map(w=>dayNum(dk(w.end))))].sort((a,b)=>a-b);}
function streakInfo(){
  const days=workoutDays(),t=todayNum();
  const runs=[];let start=null,prev=null,count=0;
  for(const d of days){if(prev!=null&&d-prev>MAX_REST+1){runs.push({start,end:prev,count});start=null;count=0;}if(start==null)start=d;prev=d;count++;}
  if(start!=null)runs.push({start,end:prev,count});
  const last=runs[runs.length-1],alive=last&&t-last.end<=MAX_REST;
  const cur=alive?{len:last.end-last.start+1,count:last.count,start:last.start,rest:t-last.end}:{len:0,count:0,rest:null};
  const best=Math.max(cur.len,...runs.map(r=>r.end-r.start+1),0);
  return{cur,best,lastDay:days[days.length-1]};
}

  return`<div class="card streak"><div class="stkrow"><div class="flame ${c.len?'':'off'}">🔥</div><div style="flex:1"><div class="big">${c.len} <span class="muted small" style="font-weight:400">${c.len===1?'day streak':'day streak'}</span></div>

// ---------- injuries: generated workouts skip exercises that load an injured area ----------
const INJ_AREAS={shoulder:'Shoulder',elbow:'Elbow',wrist:'Wrist / hand',neck:'Neck',upperback:'Upper back',lowerback:'Lower back',hip:'Hip',knee:'Knee',ankle:'Ankle / foot',
  chest:'Chest strain',biceps:'Biceps strain',triceps:'Triceps strain',abs:'Abs / hernia',quads:'Quad strain',hamstrings:'Hamstring strain',groin:'Groin strain',calves:'Calf strain'};
// words people use (English + Spanish) -> area
const INJ_WORDS=[
 ['shoulder',/shoulder|rotator|labrum|\bac joint|delt|hombro|manguito|deltoid/],
 ['elbow',/elbow|tennis elbow|golfer|codo|epicond/],
 ['wrist',/wrist|hand|carpal|finger|thumb|knuckle|mu[nñ]eca|mano|dedo|pulgar/],
 ['neck',/neck|cervical|cuello/],
 ['upperback',/upper back|thoracic|rhomboid|shoulder blade|espalda alta|om[oó]plato|dorsal/],
 ['lowerback',/lower back|low back|lumbar|disc|disk|sciatica|spine|spinal|espalda baja|ci[aá]tica|columna|hernia de disco|\bback\b|espalda/],
 ['hip',/\bhip|hip flexor|cadera|psoas/],
 ['knee',/knee|\bacl\b|\bmcl\b|\bpcl\b|menisc|patell|rodilla|ligamento cruzado|r[oó]tula/],
 ['ankle',/ankle|foot|feet|achilles|plantar|heel|toe|tobillo|\bpie|talón|talon|aquiles|fascitis/],
 ['chest',/\bchest|\bpec|pectoral|pecho/],
 ['biceps',/bicep|b[ií]ceps/],
 ['triceps',/tricep|tr[ií]ceps/],
 ['abs',/hernia|abdom|stomach|\babs\b|\bcore\b|oblique|obl[ií]cuo|est[oó]mago/],
 ['quads',/\bquad|thigh|cu[aá]driceps|muslo/],
 ['hamstrings',/hamstring|isquio/],
 ['groin',/groin|adductor|ingle|aductor/],
 ['calves',/\bcalf|calves|\bshin|pantorrilla|gemelo|espinilla/]
];
function detectAreas(text){const t=' '+String(text||'').toLowerCase()+' ';let out=[];for(const [a,re] of INJ_WORDS)if(re.test(t))out.push(a);
  if(out.includes('upperback')&&!/lower|low back|lumbar|baja|disc|disk|sciat|ci[aá]t/.test(t))out=out.filter(a=>a!=='lowerback');   // "upper back" isn't the lower back
  if(/disc|disk|discal|hernia de disco/.test(t)&&!/abdom|inguinal|umbilical|stomach|est[oó]mago/.test(t))out=out.filter(a=>a!=='abs'); // disc hernia = spine
  return out;}
const ids=s=>new Set(s.split(' '));
const HANG=ids('pullup chinup wide_pullup archer_pullup scap_pullup muscle_up dead_hang hanging_raise knee_raise toes_to_bar oblique_raise windshield_wipers front_lever lat_pulldown');
const HANDS=ids('pushup diamond_pushup decline_pushup archer_pushup pseudo_planche pike_pushup hspu handstand_hold plank side_plank mountain_climber burpee bench_dip dip l_sit ab_wheel bird_dog front_squat plate_pinch dead_hang copenhagen');
const SPINE=ids('squat front_squat deadlift rdl db_rdl good_morning bb_row ohp kb_swing sit_up decline_situp v_up leg_raise hanging_raise toes_to_bar russian_twist weighted_twist burpee jump_squat superman back_ext weighted_back_ext hip_thrust leg_press windshield_wipers dragon_flag flutter_kick');
const KNEE=ids('leg_curl lying_leg_curl nordic_curl pistol_squat jump_squat burpee copenhagen cossack_squat bss mountain_climber lunge bw_lunge step_up sumo_squat wall_sit kb_swing');
const ANKLE=ids('jump_squat burpee lunge bw_lunge step_up pistol_squat band_walk cossack_squat mountain_climber bss calf_raise sl_calf db_calf lp_calf seated_calf');
const HIPX=ids('leg_raise hanging_raise knee_raise toes_to_bar mountain_climber flutter_kick v_up sit_up decline_situp');
const NECK=ids('squat good_morning db_shrug sit_up decline_situp crunch v_up hspu handstand_hold bb_row');
function injuryHits(ex,area){
  const P=m=>ex.p.includes(m),Sx=m=>ex.s.includes(m),A=m=>P(m)||Sx(m);
  switch(area){
    case'shoulder':return A('shoulders')||P('chest')||HANG.has(ex.id)||['dip','bench_dip','squat','front_squat','good_morning','oh_ext','skull'].includes(ex.id);
    case'elbow':return P('triceps')||P('biceps')||P('forearms')||Sx('triceps')||ex.id==='dip'||ex.id==='muscle_up';
    case'wrist':return A('forearms')||HANDS.has(ex.id)||['bb_curl','skull','cg_bench','bench','incline_bb','rev_curl','btb_wrist_curl'].includes(ex.id);
    case'neck':return P('traps')||NECK.has(ex.id);
    case'upperback':return P('traps')||P('lats')||HANG.has(ex.id);
    case'lowerback':return A('lowerback')||SPINE.has(ex.id);
    case'hip':return P('glutes')||P('adductors')||P('abductors')||(P('quads')&&ex.c)||P('hamstrings')||HIPX.has(ex.id);
    case'knee':return P('quads')||KNEE.has(ex.id);
    case'ankle':return P('calves')||ANKLE.has(ex.id);
    case'chest':return A('chest');
    case'biceps':return A('biceps');
    case'triceps':return A('triceps');
    case'abs':return P('abs')||P('obliques')||ex.inc==='big'||HANG.has(ex.id)&&ex.p.includes('abs');
    case'quads':return P('quads');
    case'hamstrings':return A('hamstrings');
    case'groin':return A('adductors')||ex.id==='sumo_squat'||ex.id==='cossack_squat';
    case'calves':return A('calves')||ex.id==='jump_squat'||ex.id==='burpee';
  }
  return false;
}
const activeInjuries=()=>(S.injuries||[]).filter(i=>i.areas&&i.areas.length);
function injuryFor(ex){for(const inj of activeInjuries())for(const a of inj.areas)if(injuryHits(ex,a))return{inj,area:a};return null;}
function injuryChip(){
  const list=activeInjuries();if(!list.length)return`<button class="injchip" data-a="injform">🩹 Injured? Add it and workouts will avoid it</button>`;
  const areas=[...new Set(list.flatMap(i=>i.areas))].map(a=>INJ_AREAS[a]).join(', ');
  return`<button class="injchip on" data-a="tab" data-t="settings">🩹 Working around: <b>${areas}</b></button>`;
}
function injuryCard(){
  const list=S.injuries||[],skipped=list.length?BUILTIN.filter(injuryFor).length:0;
  return`<div class="card" id="injcard"><h3>Injuries</h3>
  ${list.length?list.map(i=>`<div class="injrow"><div style="flex:1;min-width:0"><b>${esc(i.text||'Injury')}</b><div class="muted small">${i.areas.map(a=>INJ_AREAS[a]).join(', ')}</div></div><button class="btn ghost sm" style="width:auto" data-a="injedit" data-id="${esc(i.id)}">Edit</button><button class="btn ghost sm" style="width:auto" data-a="injheal" data-id="${esc(i.id)}">Healed ✓</button></div>`).join('')+`<p class="muted small" style="margin:10px 0 0">${skipped} exercises are skipped in generated workouts.</p>`:'<p class="muted small" style="margin-top:0">Hurt something? Add it here and generated workouts will skip exercises that load that area.</p>'}
  <button class="btn ghost" data-a="injform">+ Add injury</button>
  <p class="muted small" style="margin-bottom:0">This is a safety filter, not medical advice. Follow your doctor or physical therapist, and stop any exercise that causes pain.</p></div>`;
}
let injDraft=null;
function injForm(inj){
  injDraft=inj?{...inj,areas:inj.areas.slice()}:{id:null,text:'',areas:[],manual:false};
  showModal(`<div class="sheethead"><h3>${inj?'Edit injury':'Add injury'}</h3><button class="icon" data-a="close" aria-label="Close">✕</button></div>
  <div class="field"><label class="lbl">What's injured?</label><input type="text" id="injtext" value="${esc(injDraft.text)}" placeholder="e.g. sore left knee, lower back pain"></div>
  <div class="lbl">Areas to protect</div><p class="muted small" style="margin:0 0 6px">Picked from what you typed. Tap to add or remove.</p>
  <div id="injareas"></div><p class="muted small" id="injcount"></p>
  <button class="btn primary" data-a="injsave">Save</button>`);
  injAreasRender();const t=$('#injtext');if(t&&!inj)t.focus();
}
function injAreasRender(){const el=$('#injareas');if(!el||!injDraft)return;
  el.innerHTML=Object.entries(INJ_AREAS).map(([k,l])=>`<button class="achip ${injDraft.areas.includes(k)?'on':''}" data-a="injarea" data-k="${k}">${l}</button>`).join('');
  const n=BUILTIN.filter(ex=>injDraft.areas.some(a=>injuryHits(ex,a))).length,c=$('#injcount');
  if(c)c.textContent=injDraft.areas.length?`${n} exercises will be skipped in generated workouts.`:'Pick at least one area.';}

function vRecovery(){
  const f=fatigue();
  const rows=Object.keys(MUSCLES).map(m=>{
    const r=Math.round(100-f[m]),ready=f[m]>15?Math.ceil(TAU*Math.log(f[m]/15)):0,lt=lastTrained(m);
    return`<div class="rec"><div class="rechead"><span>${MUSCLES[m]}</span><span class="${cls(r)}">${r}%</span></div><div class="track"><div class="fill ${cls(r)}" style="width:${r}%"></div></div><div class="muted small">${ready?'Ready in ~'+ready+'h':'Ready to train'}${lt?' · trained '+ago(lt):''}</div></div>`;
  }).join('');
  return`<h1>Recovery</h1><p class="muted small">Estimated from your logged sets. Muscles typically recover over 2–3 days, and the generator favors the freshest ones.</p><div class="card">${rows}</div>`;
}

function vRanks(){
  const R=muscleRanks(),bw=bodyW(),ranked=Object.keys(R).filter(m=>R[m]);
  const avg=ranked.length?ranked.reduce((a,m)=>a+Math.min(R[m].s,1),0)/ranked.length:0;
  const oi=ranked.length?rankIdx(avg):-1;
  const prog=s=>{const i=rankIdx(s);return i>=TH.length-1?100:Math.round((s-TH[i])/(TH[i+1]-TH[i])*100);};
  const legend=TIERS.map((t,k)=>`<span class="tierchip" style="color:${t.c}">${badge(k*3+2,20)}${t.n}</span>`).join('');
  const rows=Object.keys(MUSCLES).map(m=>{
    const r=R[m];
    if(!r)return`<div class="rk">${badge(-1,40)}<div class="rkbody"><div class="rkhead"><b>${MUSCLES[m]}</b><span class="muted small">Unranked</span></div><div class="muted small">Log an exercise that targets this muscle</div></div></div>`;
    return`<div class="rk">${badge(r.i,40)}<div class="rkbody"><div class="rkhead"><b>${MUSCLES[m]}</b><span style="color:${rankColor(r.i)};font-weight:700">${rankName(r.i)}</span></div><div class="track"><div class="fill" style="width:${prog(r.s)}%;background:${rankFill(r.i)}"></div></div><div class="muted small">${r.i>=TH.length-1?'Max rank reached':'Next — '+rankName(r.i+1)+': '+esc(nextTarget(r))}</div></div></div>`;
  }).join('');
  return`<h1>Ranks</h1>
  ${bw?'':`<div class="card"><h3>Add your body weight</h3><p class="muted small">Weighted lifts are ranked relative to body weight. Until you add it, only bodyweight exercises count.</p><input type="text" inputmode="decimal" data-s="bw" placeholder="Body weight (${U()})"></div>`}
  <div class="card overall">${badge(oi,72)}<div><div class="muted small">Overall</div><div class="big" style="color:${rankColor(oi)}">${rankName(oi)}</div><div class="muted small">${ranked.length} of ${Object.keys(MUSCLES).length} muscles ranked</div></div></div>
  <div class="card">${bodyMap(m=>R[m]?TIERS[Math.floor(R[m].i/3)].f:'#3a3e48')}<div class="tiers">${legend}</div></div>
  <div class="card">${rows}</div>
  <p class="muted small">Each muscle is ranked by your best lift for it: estimated 1-rep max relative to body weight (dumbbells: weight per hand). Bodyweight moves rank by reps, holds by time.</p>`;
}

// ---------- updates (posts come from updates.txt in the GitHub repo) ----------
let NEWS=null,newsErr=false;
try{NEWS=JSON.parse(localStorage.getItem('forge-news'))||null;}catch(e){}
const pickLang=s=>{const i=s.indexOf(' || ');return i<0?s:(LANG()==='es'?s.slice(i+4):s.slice(0,i)).trim();};
function parseNews(t){const posts=[];let cur=null;for(const raw of t.split(/\r?\n/)){const l=raw.trim();if(l.startsWith('## ')){cur={title:l.slice(3).trim(),lines:[]};posts.push(cur);}else if(cur&&l)cur.lines.push(l);}return posts;}
const BELL='<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>';
// A post counts as new if its title OR its contents changed (so adding a line to today's post re-alerts everyone).
const newsSig=p=>p?p.title+'|'+p.lines.length+'|'+p.lines.join('').length:'';
const hasNewNews=()=>!!(NEWS&&NEWS.length&&newsSig(NEWS[0])!==S.settings.seenNews);
async function loadNews(){
  try{const r=await fetch('updates.txt?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;
    const posts=parseNews(await r.text());const fresh=!hasNewNews()&&posts.length&&newsSig(posts[0])!==S.settings.seenNews;
    NEWS=posts;newsErr=false;try{localStorage.setItem('forge-news',JSON.stringify(posts));}catch(e){}
    if(fresh&&S.settings.onboarded&&tab!=='updates')toast('New update: '+pickLang(posts[0].title));
  }catch(e){newsErr=true;}
  if(tab==='updates'||(tab==='workout'&&!S.active))render();
}
function newsBody(lines){let out='',ul=false;for(const l of lines){if(l.startsWith('- ')){if(!ul){out+='<ul>';ul=true;}out+='<li>'+esc(pickLang(l.slice(2)))+'</li>';}else{if(ul){out+='</ul>';ul=false;}out+='<p>'+esc(pickLang(l))+'</p>';}}return out+(ul?'</ul>':'');}
function vUpdates(){
  if(NEWS&&NEWS.length&&S.settings.seenNews!==newsSig(NEWS[0])){S.settings.seenNews=newsSig(NEWS[0]);save();}
  const posts=NEWS&&NEWS.length?NEWS.map((p,i)=>`<div class="card news">${i===0?'<span class="newtag">Latest</span>':''}<h3>${esc(pickLang(p.title))}</h3>${newsBody(p.lines)}</div>`).join(''):`<div class="card"><p class="muted" style="margin:0">${newsErr?'Couldn\'t load updates. Check your connection and try again.':'No updates yet.'}</p></div>`;
  return`<button class="back" data-a="tab" data-t="workout">‹ Back</button><h1>Updates</h1><p class="muted small">What's new in Forge. You're on version ${APP_VERSION}.</p>${posts}`;
}

function vHistory(){
  if(!S.workouts.length)return`<h1>History</h1><div class="card"><p class="muted" style="margin:0">No workouts yet. Finish one and it shows up here.</p></div>`;
  const now=Date.now(),c7=S.workouts.filter(w=>now-w.end<7*864e5).length,c30=S.workouts.filter(w=>now-w.end<30*864e5).length;
  const list=S.workouts.slice().reverse().map(w=>{
    const mins=Math.round((w.end-w.start)/6e4),v=volume(w);
    const body=w.exercises.map(e=>{const ex=EX(e.exId);return`<div class="hrow"><b>${esc(ex?ex.name:'Removed exercise')}</b><span class="muted">${ex?e.sets.map(s=>fmtSet(ex,s,w.unit)).join(' · '):''}</span></div>`;}).join('');
    return`<details class="card"><summary><b>${fmtDate(w.end)}</b><div class="muted small">${esc(FOCUS_NAME[w.focus]||'Workout')} · ${mins} min · ${w.exercises.length} exercises${v?' · '+num(v)+' '+U():''}</div></summary><div style="margin-top:10px">${body}</div><button class="btn danger-ghost sm" style="margin-top:12px" data-a="delw" data-id="${esc(w.id)}">Delete workout</button></details>`;
  }).join('');
  return`<h1>History</h1><div class="stats"><div><b>${c7}</b><span>last 7 days</span></div><div><b>${c30}</b><span>last 30 days</span></div><div><b>${S.workouts.length}</b><span>total</span></div></div>${list}`;
}

function chart(pts){
  const W=340,H=170,pl=10,pr=10,pt=16,pb=24,vs=pts.map(p=>p.v);
  let mn=Math.min(...vs),mx=Math.max(...vs);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1;}const pad=(mx-mn)*0.12;mn-=pad;mx+=pad;
  const x=i=>pts.length===1?W/2:pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  const line=pts.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const area=x(0).toFixed(1)+','+(H-pb)+' '+line+' '+x(pts.length-1).toFixed(1)+','+(H-pb);
  return`<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b35" stop-opacity=".35"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#cg)"/><polyline points="${line}" fill="none" stroke="#ff6b35" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="#ff6b35"/>`).join('')}<text x="${pl}" y="${H-6}" class="ct">${shortDate(pts[0].t)}</text><text x="${W-pr}" y="${H-6}" class="ct" text-anchor="end">${shortDate(pts[pts.length-1].t)}</text></svg>`;
}
function vProgress(){return'<h1>Progress</h1>'+weightCard()+'<h2 style="font-size:20px;margin:18px 0 10px">Lifts</h2>'+vLifts();}
function vLifts(){
  const ids=[...new Set(S.workouts.flatMap(w=>w.exercises.map(e=>e.exId)))].filter(id=>EX(id));
  if(!ids.length)return`<div class="card"><p class="muted" style="margin:0">Log a few workouts and your charts will appear here.</p></div>`;
  ids.sort((a,b)=>EX(a).name.localeCompare(EX(b).name));
  if(!ids.includes(progEx)){const lw=S.workouts[S.workouts.length-1];const f=lw.exercises.find(e=>EX(e.exId));progEx=f?f.exId:ids[0];}
  const ex=EX(progEx),h=history(progEx),kind=ex.inc==='sec'?'sec':isLoad(ex)?'1rm':'reps';
  const pts=h.map(x=>({t:x.date,v:Math.max(...x.sets.map(s=>metric(ex,+conv(s.w,x.unit)||0,+s.r||0)))}));
  const best=Math.max(...pts.map(p=>p.v)),first=pts[0].v,lastv=pts[pts.length-1].v;
  const fv=v=>kind==='1rm'?Math.round(v)+' '+U():kind==='sec'?v+'s':v+' reps';
  const heavy=kind==='1rm'?Math.max(...h.flatMap(x=>x.sets.map(s=>+conv(s.w,x.unit)||0))):null;
  const change=pts.length>1&&first?Math.round((lastv-first)/first*100):null;
  return`<div class="card"><select id="progsel">${ids.map(id=>`<option value="${esc(id)}" ${id===progEx?'selected':''}>${esc(EX(id).name)}</option>`).join('')}</select>
  <div class="muted small" style="margin-top:12px">${kind==='1rm'?'Estimated 1-rep max per session':kind==='sec'?'Longest hold per session (added weight counts extra)':'Best set per session (added weight counts as extra reps)'}</div>${chart(pts)}
  <div class="stats"><div><b>${fv(best)}</b><span>best</span></div>${heavy!=null?`<div><b>${heavy} ${U()}</b><span>heaviest set</span></div>`:''}<div><b>${h.length}</b><span>sessions</span></div>${change!=null?`<div><b>${change>0?'+':''}${change}%</b><span>since first</span></div>`:''}</div></div>
  <div class="card"><h3>Recent sessions</h3>${h.slice(-6).reverse().map(x=>`<div class="hrow"><span class="muted">${shortDate(x.date)}</span><span>${x.sets.map(s=>fmtSet(ex,s,x.unit)).join(' · ')}</span></div>`).join('')}</div>`;
}

function renderPickerList(){
  if(!S.active)return;
  const q=(($('#pq')||{}).value||'').trim().toLowerCase();
  const inW=new Set(S.active.exercises.map(e=>e.exId));
  let list=allEx().filter(ex=>!inW.has(ex.id));
  const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),qf=fold(q);
  if(q)list=list.filter(ex=>[ex.name,tr(ex.name),...ex.p.map(m=>MUSCLES[m]),...ex.p.map(m=>tr(MUSCLES[m]))].some(s=>fold(s).includes(qf)));
  else if(pick.mode==='swap'){const cur=EX(S.active.exercises[pick.i].exId);if(cur)list=list.filter(ex=>ex.p.some(m=>cur.p.includes(m)));}
  list.sort((a,b)=>(hasEq(b)-hasEq(a))||a.name.localeCompare(b.name));
  $('#plist').innerHTML=list.map(ex=>`<button class="pitem ${hasEq(ex)?'':'dim'}" data-a="pick" data-id="${esc(ex.id)}"><b>${esc(ex.name)}</b><span class="muted small">${ex.p.map(m=>MUSCLES[m]).join(', ')}${hasEq(ex)?'':' · needs '+ex.eq.filter(k=>!S.settings.equip.includes(k)).map(k=>EQUIP[k]).join(', ')}</span>${injuryFor(ex)?`<span class="small warn">⚠️ May aggravate: ${INJ_AREAS[injuryFor(ex).area]}</span>`:''}</button>`).join('')||'<p class="muted">No matches.</p>';
}

// ---------- rest timer ----------
function unlockAudio(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function beep(){
  try{if(audio){[0,0.25,0.5].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);const st=audio.currentTime+t;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.3,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+0.18);o.start(st);o.stop(st+0.2);});}}catch(e){}
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function startRest(){unlockAudio();restTotal=S.settings.rest;restEnd=Date.now()+restTotal*1000;$('#rest').classList.remove('hidden');tick();}
function stopRest(){restEnd=0;$('#rest').classList.add('hidden');}
function tick(){
  const el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-S.active.start);
  if(restEnd){const left=restEnd-Date.now();if(left<=0){stopRest();beep();toast('Rest over — next set');}else{$('#resttime').textContent=fmtDur(left+999);$('#restfill').style.width=Math.min(100,(1-left/(restTotal*1000))*100)+'%';}}
}

// ---------- actions ----------
function finish(){
  const a=S.active;
  const exs=a.exercises.map(e=>({exId:e.exId,sets:e.sets.filter(s=>s.done).map(s=>({w:s.w===''||s.w==null?'':(parseFloat(s.w)||0),r:parseInt(s.r,10)||0}))})).filter(e=>e.sets.length);
  if(!exs.length){if(ask('No sets are checked off. Discard this workout?')){S.active=null;stopRest();save();render();}return;}
  const prs=[],before=muscleRanks(),stkBefore=streakInfo().cur.len;
  for(const e of exs){
    const ex=EX(e.exId);if(!ex)continue;let before=0;
    for(const h of history(e.exId))for(const s of h.sets)before=Math.max(before,metric(ex,+conv(s.w,h.unit)||0,+s.r||0));
    let now=0,bs=null;for(const s of e.sets){const v=metric(ex,+conv(s.w,a.unit)||0,s.r);if(v>now){now=v;bs=s;}}
    const added=bs&&+conv(bs.w,a.unit)>0?'+'+conv(bs.w,a.unit)+' '+U()+' × '+bs.r+(ex.inc==='sec'?'s':''):null;
    if(before>0&&now>before)prs.push(esc(ex.name)+' — '+(isLoad(ex)?'est. 1RM '+Math.round(now)+' '+U():added?added:ex.inc==='sec'?now+'s':now+' reps'));
  }
  const w={id:uid(),start:a.start,end:Date.now(),focus:a.focus,unit:a.unit,exercises:exs};
  S.workouts.push(w);S.active=null;stopRest();save();render();window.scrollTo(0,0);
  const sets=exs.reduce((n,e)=>n+e.sets.length,0),v=volume(w),after=muscleRanks(),stk=streakInfo().cur.len;
  const hit=MILESTONES.filter(m=>m>stkBefore&&m<=stk).pop();
  const stkHtml=`<div class="stkdone ${hit?'mile':''}"><span class="flame">🔥</span><div>${hit?`<b>${hit}-day streak!</b><div class="small">Milestone unlocked. Keep it going!</div>`:`<b>${stk}-day streak</b><div class="small muted">${stk>stkBefore?'Streak extended.':'Streak kept alive.'}</div>`}</div></div>`;
  const ups=Object.keys(MUSCLES).filter(m=>after[m]&&(!before[m]||after[m].i>before[m].i));
  const upHtml=ups.length?'<h3>Rank ups ⬆</h3>'+ups.map(m=>`<div class="rk">${badge(after[m].i,32)}<div class="rkbody"><b>${MUSCLES[m]}</b> <span style="color:${rankColor(after[m].i)};font-weight:700">${rankName(after[m].i)}</span></div></div>`).join(''):'';
  showModal(`<div class="sheethead"><h3>Workout saved 💪</h3></div>${stkHtml}<div class="stats"><div><b>${fmtDur(w.end-w.start)}</b><span>time</span></div><div><b>${sets}</b><span>sets</span></div>${v?`<div><b>${num(v)}</b><span>${U()} lifted</span></div>`:''}</div>${prs.length?'<h3>New records 🏆</h3>'+prs.map(p=>`<div class="pr">${p}</div>`).join(''):''}${upHtml}<button class="btn primary" data-a="close">Done</button>`);
}
async function exportData(){
  const name='forge-backup-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([JSON.stringify(S)],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Forge backup'});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function toCode(){const b=new TextEncoder().encode(JSON.stringify(S));let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return'FORGE1:'+btoa(s);}
function fromCode(t){t=(t||'').replace(/\s+/g,'');const i=t.indexOf('FORGE1:');if(i<0)throw 0;const s=atob(t.slice(i+7)),b=new Uint8Array(s.length);for(let k=0;k<s.length;k++)b[k]=s.charCodeAt(k);return JSON.parse(new TextDecoder().decode(b));}
function restore(d){if(!d||!d.settings||!Array.isArray(d.workouts))throw 0;
  if(!ask('Replace the data on this phone with this backup ('+d.workouts.length+' workouts)?'))return false;
  S=merge(d);rebuild();save();render();toast('Backup restored');return true;}
async function copyBackup(){
  const code=toCode();
  try{await navigator.clipboard.writeText(code);toast('Backup copied — paste it in Notes or a message to yourself');return;}catch(e){}
  showModal(`<div class="sheethead"><h3>Copy backup</h3><button class="icon" data-a="close" aria-label="Close">✕</button></div><p class="muted small">Tap in the box, Select All, then Copy.</p><textarea id="bkout" readonly>${esc(code)}</textarea>`);
  const t=$('#bkout');t.focus();t.select();
}
function pasteBackup(){showModal(`<div class="sheethead"><h3>Paste backup</h3><button class="icon" data-a="close" aria-label="Close">✕</button></div><p class="muted small">Paste the backup text you copied from your old phone. It starts with FORGE1:</p><textarea id="bkin" placeholder="FORGE1:..."></textarea><button class="btn primary" data-a="dorestore">Restore</button>`);}
function importFile(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.settings||!Array.isArray(d.workouts))throw 0;
    if(!ask('Replace your current data with this backup ('+d.workouts.length+' workouts)?'))return;
    S=merge(d);rebuild();save();render();toast('Backup restored');}catch(e){toast("That file isn't a Forge backup");}};
  rd.readAsText(f);
}

  if(t.dataset.goal){const v=parseFloat(t.value);S.settings.goals=Object.assign(goals(),{[t.dataset.goal]:v>0?Math.round(v):GOALS_DEF[t.dataset.goal]});if(S.settings.nut)S.settings.nut.auto=false;save();render();return;}
  if(t.closest&&t.closest('#sheet')&&/^n_/.test(t.id||t.name)){nutPreview();return;}
  if(t.dataset.s==='bw'){const v=parseFloat(t.value.replace(',','.'));if(v>0)logWeight(v);else S.settings.bw='';save();if(tab==='ranks')render();return;}
  if(t.dataset.s){let v=t.value;if(t.dataset.s==='count'||t.dataset.s==='rest'||t.dataset.s==='weekGoal')v=+v;S.settings[t.dataset.s]=v;save();return;}
  if(t.dataset.eq){const set=new Set(S.settings.equip);t.checked?set.add(t.dataset.eq):set.delete(t.dataset.eq);S.settings.equip=[...set];save();}
});

document.documentElement.lang=LANG();startTranslator();trNode(document.body);
render();
if(!S.settings.langChosen)langPicker();else if(!S.settings.onboarded)onboarding();
loadNews();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadNews();});
setInterval(tick,250);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script>
</body>
