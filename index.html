document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&S.active){
    const ii=t.dataset.i,sets=S.active.exercises[+ii].sets,j=+t.dataset.j,f=t.dataset.f,old=sets[j][f];
    sets[j][f]=t.value.replace(',','.');
    if(f==='w'){sets[j].autoW=false;
      for(let k=j+1;k<sets.length;k++){const t=sets[k];if(t.done||!(t.w===''||t.w==null||t.autoW))continue;t.w=sets[j].w;t.autoW=true;const el=document.querySelector(`input[data-f="w"][data-i="${ii}"][data-j="${k}"]`);if(el)el.value=t.w;}}
    save();return;
  }
  if(t.dataset&&t.dataset.vest!=null&&S.active){const en=S.active.exercises[+t.dataset.vest];if(en){en.vest=t.value.replace(',','.');save();}return;}
  if(t.closest&&t.closest('#waistsheet')){waistPreview();return;}
  if(t.closest&&t.closest('#dexaform')){dexaCheck(t.id);return;}
  if(t.dataset&&t.dataset.nv){nvVals[t.dataset.nv]=t.value;const pos=t.selectionStart,ev=t.dataset.nv;nvRows();const n=document.querySelector(`[data-nv="${ev}"]`);if(n&&n!==t){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}
  if(t.dataset&&t.dataset.af){afVals[t.dataset.af]=t.value;const pos=t.selectionStart,ev=t.dataset.af;if(ev!=='h'&&ev!=='w'||true){afRows();const n=document.querySelector(`[data-af="${ev}"]`);if(n&&n!==t){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}return;}
  if(t.dataset&&t.dataset.aft){aftVals[t.dataset.aft]=t.value;const pos=t.selectionStart,ev=t.dataset.aft;aftRows();const n=document.querySelector(`[data-aft="${ev}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}
  if(t.dataset&&t.dataset.usmc){usmcVals[t.dataset.usmc]=t.value;const pos=t.selectionStart,ev=t.dataset.usmc;usmcRows();const n=document.querySelector(`[data-usmc="${ev}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}return;}
  if(t.id==='pq')renderPickerList();
  if(t.id==='injtext'&&injDraft){injDraft.text=t.value;if(!injDraft.manual){injDraft.areas=detectAreas(t.value);}injAreasRender();}
  if(t.closest&&t.closest('#sheet')&&/^(fsv|f_)/.test(t.id))foodTotal();
  if(t.closest&&t.closest('#sheet')&&/^n_/.test(t.id||t.name))nutPreview();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='langsel'){setLang(t.value);return;}
  if(t.id==='focus'){const was=!!PREP[focusSel];focusSel=t.value;if(was||PREP[focusSel])render();return;}
  if(t.name==='tmode'&&TM){TM.mode=t.value;TM.dur=t.value==='reps'?120:0;timerDraw();return;}
  if(t.name==='tdur'&&TM){TM.dur=+t.value;timerDraw();return;}
  if(t.id==='nvcard'){nvCard=t.value;nvRows();return;}
  if(t.id==='afstr'||t.id==='afcore'||t.id==='afcard'){afSel[{afstr:'str',afcore:'core',afcard:'card'}[t.id]]=t.value;afRows();return;}
  if(t.id==='aftalt'){aftAlt=t.value;aftRows();return;}
  if(t.name==='usmcstr'){S.settings.usmcPush=t.value==='1';save();usmcCalc();return;}
  if(t.name==='usmctest'){usmcTest=t.value;usmcCalc();return;}
  if(t.id==='progsel'){progEx=t.value;render();return;}
  if(t.id==='importfile'){importFile(t.files[0]);t.value='';return;}
  if(t.id==='bcfile'){const f=t.files[0];t.value='';if(f)decodeStill(f);return;}
  if(t.closest&&t.closest('#dexaform')){dexaCheck(true);return;}
  if(t.id==='dexafile'){const f=t.files[0];t.value='';if(f)scanDexa(f);return;}
  if(t.id==='scanfile'){const f=t.files[0];t.value='';if(f)scanLabel(f);return;}
  if(t.dataset.goal){const v=parseFloat(t.value);S.settings.goals=Object.assign(goals(),{[t.dataset.goal]:v>0?Math.round(v):GOALS_DEF[t.dataset.goal]});if(S.settings.nut)S.settings.nut.auto=false;save();render();return;}
  if(t.closest&&t.closest('#sheet')&&/^n_/.test(t.id||t.name)){nutPreview();return;}
  if(t.dataset.s==='sex'||t.dataset.s==='age'){let v=t.value;if(t.dataset.s==='age'){v=parseInt(v,10);v=v>=13&&v<=110?v:'';if(t.value&&v===''){toast('Enter an age between 13 and 110');}}
    S.settings[t.dataset.s]=v;if(S.settings.nut&&v!==''){S.settings.nut[t.dataset.s]=v;}save();if(tab==='food')render();return;}
  if(t.dataset.s==='bw'){const v=parseFloat(t.value.replace(',','.'));if(v>0)logWeight(v);else S.settings.bw='';save();if(tab==='ranks')render();return;}
  if(t.dataset.s==='goalW'){const v=parseFloat(t.value.replace(',','.'));if(v>0){setGoalW(v);if(bodyW()&&v>=bodyW())toast('Your goal weight is at or above your current weight');}else{S.settings.goalW='';}save();return;}
  if(t.dataset.s==='branch'){S.settings.branch=t.value;if(!focusOk(focusSel))focusSel='auto';save();if($('#sheet [data-a="onboarded"]'))onboarding();else render();return;}
  if(t.dataset.s==='goal'){S.settings.goal=t.value;const n=S.settings.nut;
    if(t.value==='fatloss'){if(n&&n.goal!=='lose'){n.goal='lose';n.auto=true;toast('Food targets switched to Lose fat');}else if(!n)toast('Set your food targets on the Food tab to match');}
    save();if($('#sheet [data-a="onboarded"]'))onboarding();else render();return;}
  if(t.dataset.s){let v=t.value;if(t.dataset.s==='count'||t.dataset.s==='rest'||t.dataset.s==='weekGoal')v=+v;S.settings[t.dataset.s]=v;save();return;}
  if(t.dataset.eq){const set=new Set(S.settings.equip);t.checked?set.add(t.dataset.eq):set.delete(t.dataset.eq);S.settings.equip=[...set];save();}
});
