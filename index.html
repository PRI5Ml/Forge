<style>
:root{color-scheme:dark;--bg:#0d0e11;--card:#17191f;--card2:#20232b;--line:#2b2f3a;--text:#f2f3f5;--muted:#8b92a1;--acc:#ff6b35;--good:#3ecf8e;--warn:#f5c04a;--bad:#ff5468}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.4}
body.noscroll{overflow:hidden}
main{padding:8px 16px calc(150px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1{font-size:30px;margin:12px 0 14px;letter-spacing:-.5px}
h2{font-size:24px;margin:4px 0 6px}
h3{font-size:17px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=text],input[type=search]{width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:16px;font-family:inherit}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font-family:inherit;font-size:16px;font-weight:600;margin-top:10px;background:var(--card2);color:var(--text);cursor:pointer}
.btn.primary{background:var(--acc);color:#fff}
.btn.big{padding:16px;font-size:17px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger-ghost{background:transparent;color:var(--bad);border:1px solid rgba(255,84,104,.35)}
.btn.sm{padding:9px 12px;font-size:14px;margin-top:0}
.row{display:flex;gap:8px;margin-top:10px}
.icon{background:var(--card2);border:0;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
.chip{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;margin:4px 4px 0 0;font-size:14px}
.chip input{accent-color:var(--acc);width:16px;height:16px;margin:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:rgba(13,14,17,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin:-8px -16px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topbar .btn{width:auto;margin:0;padding:11px 22px}
.elapsed{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{margin:0 0 2px}
.exbtns{display:flex;gap:6px;flex-shrink:0}
.last{color:var(--muted);margin-top:8px}
.note{color:var(--acc);margin-top:4px}
.sethead,.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.sethead{margin-top:12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sethead span{text-align:center}
.set{margin-top:8px}
.set .n{text-align:center;color:var(--muted);font-weight:600}
.set input{text-align:center;padding:10px 6px;font-size:17px;font-variant-numeric:tabular-nums}
.tick{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:18px;cursor:pointer}

.mini{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mini .pct{text-align:right;font-weight:600}
.track{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.good{background:var(--good)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.rec{padding:10px 0;border-bottom:1px solid var(--line)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:var(--muted)}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.hrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.ct{fill:var(--muted);font-size:11px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(18,19,23,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 6px;font-size:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button.on{color:var(--acc)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rest{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:20;background:#23262f;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:8px;padding:10px 12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:616px;margin:0 auto}
.restfill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,107,53,.2);transition:width .25s linear}
.rest .lab{position:relative;flex:1;display:flex;align-items:baseline;gap:8px}
.rest .lab b{font-size:24px;font-variant-numeric:tabular-nums}
.rest button{position:relative;background:var(--card2);border:0;color:var(--text);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheethead h3{margin:0;font-size:20px}
.plist{margin-top:8px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:12px 2px;font-family:inherit;font-size:16px;cursor:pointer}
.pitem.dim{opacity:.45}
.pr{padding:8px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#2a2d36;color:var(--text);padding:10px 16px;border-radius:12px;z-index:99;transition:transform .25s;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw}
.toast.show{transform:translate(-50%,0)}
.hidden{display:none!important}
.seg{display:flex;gap:6px}.seg label{flex:1}.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.nutres{background:var(--card2);margin:4px 0 8px}.nutmac{display:flex;justify-content:space-between;font-size:14px}
.nutsum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.bcreader{width:100%;min-height:220px;border-radius:14px;overflow:hidden;background:#000}
.bcreader video{width:100%!important;display:block}
.ebrow{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.ebrow>span{flex:1;display:flex;flex-direction:column;gap:2px}
.tog{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0}.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.tog.on{background:var(--acc)}.tog.on i{left:23px}
.w8chip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:11px 14px;margin:0 0 12px;font-family:inherit;font-size:15px;cursor:pointer}
.htimgs{display:flex;gap:8px;margin:0 0 12px}.htimgs figure{flex:1;margin:0;min-width:0}
.htimgs img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--card2);display:block}
.htimgs figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.htmeta{display:grid;gap:8px;font-size:14px}.htmeta .lbl{margin-bottom:2px}
.htsteps{margin:0;padding-left:22px}.htsteps li{margin:0 0 8px;line-height:1.45}
.httip{background:rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.35);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:6px}
.httip b{color:var(--acc);margin-right:4px}
.streak .stkrow{display:flex;gap:12px;align-items:center}
.flame{font-size:40px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,107,53,.55))}.flame.off{filter:grayscale(1);opacity:.35}
.wdots{display:flex;justify-content:space-between;gap:4px}
.wdot{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wdot i{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px}
.wdot.on i{background:var(--acc);border-color:var(--acc);color:#fff}.wdot.today span{color:var(--text);font-weight:700}.wdot.today i{border-color:var(--text)}
.stkdone{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:6px}.stkdone .flame{font-size:30px}
.stkdone.mile{background:linear-gradient(135deg,rgba(255,107,53,.25),rgba(255,212,0,.15));border:1px solid rgba(255,107,53,.5)}
.langpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 4px 6px}
.langpick .globe{font-size:56px;line-height:1;margin-bottom:10px}.langpick .btn{font-size:19px;padding:18px}
.bwnote{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card2);color:var(--muted);line-height:1.35}
.injchip{display:block;width:100%;text-align:left;background:var(--card2);border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:10px 12px;margin-top:10px;font-family:inherit;font-size:14px;cursor:pointer}
.injchip.on{border:1px solid rgba(245,192,74,.5);background:rgba(245,192,74,.1);color:var(--text)}
.injrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.achip{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;margin:0 6px 8px 0;font-family:inherit;font-size:14px;cursor:pointer}
.achip.on{background:var(--warn);border-color:var(--warn);color:#1a1405;font-weight:700}
.injwarn{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(245,192,74,.12);color:var(--warn);line-height:1.35}
.pitem .warn{display:block}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 12px}
.daynav b{font-size:17px}
.calrow{display:flex;justify-content:space-between;align-items:flex-end}
.mac{margin-top:10px}.machead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.fe{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.fe:first-of-type{border-top:0}
.fem{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.fem b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fek{font-weight:700;white-space:nowrap}
.qa{background:var(--card2);color:var(--text);font-family:inherit;cursor:pointer}
.svrow{display:flex;gap:8px;align-items:center}.svrow input{text-align:center}
.scanthumb{display:block;max-width:100%;max-height:180px;margin:0 auto 12px;border-radius:12px}
.hdr{display:flex;justify-content:space-between;align-items:center}
.bell{position:relative;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bell svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell .dot{position:absolute;top:8px;right:9px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--card)}
.back{background:none;border:0;color:var(--acc);font-size:16px;font-family:inherit;padding:10px 0 0;cursor:pointer}
.news h3{font-size:18px}
.news ul{margin:4px 0 0;padding-left:20px}.news li{margin:5px 0}.news p{margin:14px 0 2px;font-size:12px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}.news h3+p{margin-top:4px}
.newtag{display:inline-block;font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
textarea{width:100%;min-height:160px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
.rk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk svg{flex-shrink:0}
.rkbody{flex:1;min-width:0}
.rkhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.rk .muted{margin-top:5px}
.overall{display:flex;gap:16px;align-items:center}
.big{font-size:26px;font-weight:800;line-height:1.15}
.tiers{display:flex;flex-wrap:wrap;gap:6px 12px}
.bodymap{display:flex;justify-content:center;gap:8px;margin-bottom:14px}
.bodymap>div{flex:1;max-width:170px;text-align:center}
.body{width:100%;height:auto;display:block}
.bodymap span{font-size:12px;color:var(--muted)}
.tierchip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
</style>

let ES=null,ES_PH=null;
function esDict(){if(ES)return ES;ES=Object.assign({},ES_PHR,ES_BASE);
  for(const id in HOWTO){const en=HOWTO[id],es=HOWTO_ES[id];if(!es)continue;en[0].forEach((s,i)=>{if(es[0][i])ES[s]=es[0][i];});ES[en[1]]=es[1];}
  return ES;}
function trPhrases(k){
  if(!ES_PH){const keys=Object.keys(ES_PHR).sort((a,b)=>b.length-a.length);
    ES_PH=keys.length?new RegExp('(^|[^A-Za-z])('+keys.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?=$|[^A-Za-z])','g'):null;}
  return ES_PH?k.replace(ES_PH,(m,a,b)=>a+ES_PHR[b]):k;
}
function trCore(k){
  const D=esDict();if(D[k]!=null)return D[k];
  for(const [re,f] of ES_RX){if(re.test(k))return k.replace(re,f);}
  return trPhrases(k);
}
function tr(s){
  if(LANG()!=='es'||s==null)return s;s=String(s);const k=s.trim();
  if(!k||!/[A-Za-z]/.test(k))return s;
  const out=trCore(k);return out===k?s:s.replace(k,out);
}

const TR_ATTR=['placeholder','aria-label','alt','title'];
const TRD=new WeakMap();// remembers what we already translated, so nothing is translated twice
function trNode(n){
  if(n.nodeType===3){if(TRD.get(n)===n.nodeValue)return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;TRD.set(n,n.nodeValue);return;}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  let done=TRD.get(n);if(!done){done={};TRD.set(n,done);}
  for(const a of TR_ATTR){const v=n.getAttribute&&n.getAttribute(a);if(v&&done[a]!==v){const t=tr(v);if(t!==v)n.setAttribute(a,t);done[a]=t;}}
  if(n.tagName==='INPUT'||n.tagName==='TEXTAREA')return;
  for(let c=n.firstChild;c;c=c.nextSibling)trNode(c);
}
let trObs=null;
function startTranslator(){
  if(trObs||typeof MutationObserver==='undefined')return;
  trObs=new MutationObserver(ms=>{if(LANG()!=='es')return;for(const m of ms){
    if(m.type==='characterData')trNode(m.target);else if(m.type==='childList')m.addedNodes.forEach(trNode);else if(m.type==='attributes')trNode(m.target);}});
  trObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
}

chinup:[["Hang from the bar with palms facing you, hands about shoulder-width.","Pull your shoulders down, then pull up.","Bring your chin over the bar.","Lower all the way down slowly."],"Usually easier than pull-ups because your biceps help more. A great first goal."],
lat_pulldown:[["Sit with your thighs under the pads and grab the bar wider than your shoulders.","Lean back slightly and pull your shoulders down.","Pull the bar to your upper chest, driving your elbows down.","Let the bar rise slowly until your arms are straight."],"Don't pull behind your neck, and don't swing your body to move the weight."],
cable_row:[["Sit with your feet on the platform, knees slightly bent, and grab the handle.","Sit tall with a flat back and arms straight.","Pull the handle to your belly, squeezing your shoulder blades together.","Return slowly until your arms are straight."],"Keep your torso still. Don't rock back and forth to move the weight."],
machine_row:[["Adjust the seat so the handles are at chest height, chest against the pad.","Grab the handles with arms straight.","Pull back, driving your elbows past your sides.","Return slowly."],"Pause and squeeze for a second at the back of every rep."],
db_shrug:[["Stand holding dumbbells at your sides.","Lift your shoulders straight up toward your ears.","Hold for a second at the top.","Lower slowly."],"Go straight up and down. Don't roll your shoulders."],
band_row:[["Anchor a band at chest height, or loop it around your feet while seated.","Hold the ends with straight arms.","Pull your hands toward your belly, squeezing your shoulder blades.","Return slowly."],"Step back further for more resistance."],
back_ext:[["Set the pad so it sits just below your hip bones and hook your feet in.","Cross your arms over your chest.","Lower your upper body by hinging at the hips until you feel a hamstring stretch.","Raise back up until your body is in a straight line."],"Stop at straight. Don't over-arch your lower back at the top."],
good_morning:[["Rest a light barbell on your upper back like a squat.","Stand with feet hip-width and knees slightly bent.","Push your hips back, lowering your chest until you feel a strong hamstring stretch.","Drive your hips forward to stand back up."],"Start very light. Your back must stay flat the whole time."],
weighted_back_ext:[["Set up like a back extension, holding a weight plate against your chest.","Lower your upper body by hinging at the hips.","Raise back up until your body is straight.","Control the weight on the way down."],"Master the bodyweight version first, then add weight gradually."],
bird_dog:[["Start on hands and knees, hands under shoulders and knees under hips.","Brace your abs and keep your back flat.","Reach one arm forward and the opposite leg back until both are straight.","Hold for a second, return and switch sides."],"Imagine a glass of water on your lower back: don't spill it."],
superman:[["Lie face down with arms stretched overhead.","Squeeze your glutes and lower back.","Lift your arms, chest and legs off the floor together.","Hold, keeping your neck in line with your spine."],"Look at the floor, not forward, to protect your neck."],
bb_curl:[["Stand holding a barbell with an underhand grip at shoulder-width.","Keep your elbows pinned at your sides.","Curl the bar up toward your shoulders.","Lower slowly until your arms are straight."],"No swinging. If you have to lean back, the weight is too heavy."],
db_curl:[["Stand holding dumbbells at your sides, palms facing forward.","Keep your elbows at your sides.","Curl the weights up, squeezing your biceps.","Lower slowly all the way down."],"Lowering slowly (2–3 seconds) builds as much muscle as lifting."],
hammer_curl:[["Stand holding dumbbells at your sides, palms facing your body.","Keep your palms facing in the whole time.","Curl the weights up toward your shoulders.","Lower slowly."],"Works your forearms and the outer biceps more than regular curls."],
cable_curl:[["Attach a straight bar or rope to the low pulley.","Stand facing the machine and grab the handle with an underhand grip.","Curl the handle up toward your shoulders, elbows at your sides.","Lower slowly."],"The cable keeps tension the whole way, so keep the reps smooth."],
preacher:[["Adjust the seat so your upper arms rest flat on the pad.","Grab the handles with an underhand grip.","Curl up until your forearms are vertical.","Lower slowly until your arms are almost straight."],"Don't drop fast at the bottom; that's where elbows get strained."],
band_curl:[["Stand on the middle of a band and hold the ends, palms forward.","Keep your elbows at your sides.","Curl your hands up toward your shoulders.","Lower slowly."],"Use a wider stance on the band for more resistance."],
skull:[["Lie on a bench holding a barbell or EZ-bar over your chest with arms straight.","Keep your upper arms still and slightly angled back.","Bend your elbows to lower the bar toward your forehead.","Straighten your arms to lift it back up."],"Go light and slow. Lower the bar to just behind your head if your elbows complain."],
pushdown:[["Attach a bar or rope to the high pulley and grab it with your elbows bent.","Pin your elbows to your sides.","Push down until your arms are straight.","Let the handle rise slowly until your forearms are parallel to the floor."],"Only your forearms should move. Elbows stay glued to your sides."],
oh_ext:[["Hold one dumbbell with both hands overhead, standing or seated.","Keep your elbows pointing forward and close to your head.","Lower the dumbbell behind your head by bending your elbows.","Straighten your arms to lift it back up."],"Keep your ribs down; don't arch your back to finish the rep."],
cg_bench:[["Lie on the bench and grip the bar about shoulder-width.","Unrack and keep your elbows close to your body.","Lower the bar to your lower chest.","Press back up to straight arms."],"Hands at shoulder-width is enough. Going narrower is hard on the wrists."],
bench_dip:[["Sit on the edge of a bench with your hands beside your hips, fingers forward.","Slide your butt off the bench, legs out in front of you.","Lower by bending your elbows to about 90°.","Push back up to straight arms."],"Bend your knees to make it easier. Keep your back close to the bench."],
band_pushdown:[["Anchor a band high, like over a door or pull-up bar.","Grab it with elbows bent and pinned to your sides.","Push down until your arms are straight.","Return slowly."],"Squeeze your triceps hard at the bottom of every rep."],
wrist_curl:[["Sit and rest your forearms on your thighs or a bench, palms up, wrists over the edge.","Hold a dumbbell in each hand.","Curl your wrists up as high as you can.","Lower slowly, letting the weight roll toward your fingertips."],"Small movement, light weight, high reps (15–20) works best for forearms."],
rev_wrist_curl:[["Rest your forearms on a bench or your thighs, palms down, wrists over the edge.","Hold light dumbbells.","Lift the backs of your hands up toward you.","Lower slowly."],"Use lighter weight than regular wrist curls. These muscles are smaller."],
btb_wrist_curl:[["Stand holding a barbell behind your back, palms facing back.","Let your arms hang straight.","Curl the bar up by bending only your wrists.","Lower slowly."],"Lets you use more weight than seated wrist curls. Keep your arms still."],
rev_curl:[["Stand holding a barbell with an overhand grip (palms down), shoulder-width.","Keep your elbows at your sides.","Curl the bar up toward your shoulders.","Lower slowly."],"Use about half your normal curl weight. Builds forearms and grip."],
cable_wrist_curl:[["Set a straight bar on the low pulley and kneel or sit facing it.","Rest your forearms on a bench or your thighs, palms up.","Curl your wrists up.","Lower slowly."],"Keep your forearms still; only your wrists move."],
dead_hang:[["Grab a pull-up bar with an overhand grip, hands shoulder-width.","Lift your feet and hang with straight arms.","Keep your shoulders slightly engaged, not fully slumped.","Hang as long as you can; log the seconds."],"Great for grip strength and decompressing your back. Chalk helps."],
plate_pinch:[["Put two weight plates together, smooth sides out.","Pinch them together with your fingers on one side and thumb on the other.","Lift and hold them at your side.","Hold as long as you can, then switch hands."],"Start with two 10 lb (5 kg) plates and build up the time."],
squat:[["Set the bar on your upper back (not your neck), hands just outside your shoulders.","Stand with feet shoulder-width, toes slightly out. Brace your abs.","Sit down and back until your hips are at least level with your knees, knees tracking over toes.","Drive up through your whole foot to stand tall."],"Keep your chest up and heels down. Always use safety bars or a spotter for heavy sets."],
front_squat:[["Rest the bar on the front of your shoulders, fingertips under it and elbows high.","Stand with feet shoulder-width.","Squat down keeping your torso upright and elbows up.","Drive back up to standing."],"If your wrists hurt, cross your arms over the bar to hold it instead."],
goblet:[["Hold a dumbbell vertically against your chest with both hands.","Stand with feet slightly wider than shoulders, toes turned out.","Squat down between your knees, keeping your chest up.","Push back up to standing."],"The best squat for beginners. It teaches you to stay upright."],
kb_goblet:[["Hold a kettlebell by the handle sides at chest height.","Stand with feet slightly wider than shoulders.","Squat down, elbows inside your knees.","Push back up to standing."],"Use your elbows to gently push your knees out at the bottom."],
leg_press:[["Sit with your back flat against the pad and feet shoulder-width on the platform.","Release the safety handles.","Lower the platform until your knees are at about 90°.","Press back up without locking your knees."],"Never lock your knees at the top, and don't let your lower back lift off the pad."],
leg_ext:[["Adjust the seat so your knees line up with the machine's pivot.","Hook the pad just above your ankles.","Straighten your legs, squeezing your quads.","Lower slowly."],"Pause for a second at the top for a stronger squeeze."],
leg_curl:[["Adjust the machine so your knees line up with the pivot and the pad rests just above your heels.","Lower the thigh pad to hold your legs in place.","Curl your heels down and back as far as you can.","Return slowly."],"Point your toes up (toward your shins) to work your hamstrings harder."],
lying_leg_curl:[["Lie face down with the pad just above your heels and knees just off the bench.","Hold the handles and keep your hips pressed down.","Curl your heels toward your butt.","Lower slowly."],"Don't let your hips lift off the bench to finish the rep."],
hip_abduction:[["Sit in the machine with the pads on the outside of your knees.","Sit tall and hold the handles.","Push your knees outward as far as you can.","Return slowly without letting the weights touch."],"Leaning slightly forward targets your glutes more."],
hip_adduction:[["Sit in the machine with the pads on the inside of your knees.","Start with your legs only as wide as is comfortable.","Squeeze your knees together.","Open back up slowly."],"Don't start too wide. A big stretch under load can strain your groin."],
cable_adduction:[["Attach an ankle strap to a low pulley and put it on your inside ankle.","Stand side-on to the machine, holding it for balance.","Sweep your strapped leg across in front of your other leg.","Return slowly."],"Keep your body upright. Only your leg moves."],
copenhagen:[["Lie on your side and rest your top leg's inner knee or ankle on a bench.","Prop yourself up on your forearm.","Lift your hips so your body forms a straight line, bottom leg hanging.","Hold for time, then switch sides."],"Start with the bench under your knee; under the ankle is much harder."],
sumo_squat:[["Stand with feet wide, toes pointed out, holding a dumbbell between your legs.","Keep your chest up.","Squat straight down, pushing your knees out over your toes.","Stand back up, squeezing your inner thighs and glutes."],"Your knees must point the same way as your toes."],
cable_abduction:[["Attach an ankle strap to a low pulley and put it on your outside ankle.","Stand side-on to the machine, holding it for balance.","Lift your strapped leg out to the side.","Return slowly."],"Keep your toes pointing forward and your body upright."],
side_leg_raise:[["Lie on your side with your legs straight and stacked.","Rest your head on your arm.","Lift your top leg up to about 45°.","Lower slowly."],"Keep your toes pointing forward, not up, to target the outer hip."],
band_walk:[["Put a mini band around your legs just above your knees or ankles.","Bend into a quarter squat, feet shoulder-width.","Step sideways, keeping tension on the band.","Take 10–15 steps each way. Each step counts as a rep."],"Stay low and don't let your feet come together."],
fire_hydrant:[["Start on hands and knees.","Keep your knee bent at 90°.","Lift one knee out to the side until your thigh is about level with your hip.","Lower and repeat, then switch sides."],"Keep your hips level. Don't lean away to lift higher."],
rdl:[["Stand holding a barbell at your thighs, feet hip-width.","With soft knees, push your hips back and slide the bar down your legs.","Lower until you feel a strong hamstring stretch (usually mid-shin).","Drive your hips forward to stand back up."],"The bar stays touching your legs and your back stays flat. It's a hip hinge, not a squat."],
db_rdl:[["Stand holding dumbbells in front of your thighs.","With soft knees, push your hips back and lower the dumbbells along your legs.","Stop when you feel a strong hamstring stretch.","Drive your hips forward to stand."],"Keep the dumbbells close to your legs the whole way."],
lunge:[["Stand holding dumbbells at your sides.","Take a big step forward.","Lower until both knees are at about 90°, back knee just above the floor.","Push through your front heel to step back to the start. Alternate legs."],"Keep your front knee over your foot, not caving inward."],
bss:[["Stand a big step in front of a bench, holding dumbbells.","Rest the top of your back foot on the bench.","Lower straight down until your front thigh is about parallel to the floor.","Push through your front foot to stand. Finish one leg, then switch."],"Find your foot position with no weight first. Expect to be humbled!"],
step_up:[["Stand facing a bench or box, holding dumbbells.","Put one whole foot on the box.","Push through that foot to stand up on the box.","Step back down slowly. Finish one leg, then switch."],"Don't push off with the back foot. Make the front leg do the work."],
hip_thrust:[["Sit on the floor with your upper back against a bench and a padded barbell over your hips.","Plant your feet flat, about shoulder-width.","Drive your hips up until your body is flat from shoulders to knees.","Squeeze your glutes at the top, then lower."],"Tuck your chin and keep your ribs down. Don't arch your lower back at the top."],
kb_swing:[["Stand with feet wider than hips, kettlebell on the floor in front of you.","Hinge at the hips, grab it and hike it back between your legs.","Snap your hips forward to swing it to chest height.","Let it swing back down and repeat."],"It's a hip snap, not a squat or an arm lift. Your arms just guide the bell."],
glute_bridge:[["Lie on your back, knees bent, feet flat and hip-width.","Brace your abs.","Push through your heels to lift your hips until your body is straight from shoulders to knees.","Squeeze your glutes, then lower."],"Push through your heels. Lifting your toes slightly can help."],
bw_squat:[["Stand with feet shoulder-width, toes slightly out.","Reach your arms forward for balance.","Sit down and back as low as you comfortably can, chest up.","Stand back up."],"Heels stay on the floor. Squat to a chair to learn the depth."],
bw_lunge:[["Stand tall with hands on your hips.","Step forward and lower until both knees are at about 90°.","Push through your front foot and step the back foot forward into the next lunge.","Keep walking, alternating legs."],"Take long enough steps that your front knee stays over your ankle."],
calf_raise:[["Stand with the balls of your feet on a step, heels hanging off.","Hold something for balance.","Lower your heels as far as you can.","Rise up onto your toes as high as you can and squeeze."],"Pause at the top and bottom. Bouncing makes it far less effective."],
seated_calf:[["Sit with the pad on your lower thighs and the balls of your feet on the platform.","Release the safety.","Lower your heels for a full stretch.","Push up onto your toes as high as you can."],"Works the lower calf muscle that standing raises miss. Use full range."],
lp_calf:[["Sit in the leg press with only the balls of your feet on the bottom edge of the platform.","Press the platform up with straight (not locked) knees.","Let your toes come toward you for a stretch.","Push through the balls of your feet to extend your ankles."],"Keep the safety handles engaged and never let your feet slip off the platform."],
db_calf:[["Stand holding dumbbells at your sides, the balls of your feet on a step.","Lower your heels for a stretch.","Rise up onto your toes as high as you can.","Lower slowly."],"Keep your knees straight but not locked."],
sl_calf:[["Stand on one foot on the edge of a step, holding something for balance.","Lower your heel as far as you can.","Rise up onto your toes as high as you can.","Finish all reps, then switch legs."],"Much harder than two legs. Great when you don't have weights."],
plank:[["Rest on your forearms and toes, elbows under shoulders.","Make a straight line from head to heels.","Squeeze your glutes and brace your abs like you're about to be punched.","Hold for time."],"If your hips sag or your back aches, stop. A short good plank beats a long bad one."],
crunch:[["Lie on your back with knees bent and feet flat.","Rest your fingertips lightly behind your head.","Curl your shoulders off the floor by squeezing your abs.","Lower slowly."],"Don't pull on your neck. Imagine an apple between your chin and chest."],
dead_bug:[["Lie on your back, arms pointing at the ceiling, knees bent at 90° over your hips.","Press your lower back flat into the floor.","Slowly lower your opposite arm and leg toward the floor.","Return and switch sides."],"Your lower back must stay flat. Only go as far as you can keep it down."],
russian_twist:[["Sit with knees bent and lean back slightly, back straight.","Lift your feet off the floor (or keep heels down to make it easier).","Rotate your torso to touch your hands to the floor on one side.","Rotate to the other side. Each side counts as a rep."],"Turn your shoulders, not just your arms."],
hanging_raise:[["Hang from a pull-up bar with straight arms.","Brace your abs to stop swinging.","Raise your straight legs up to hip height or higher.","Lower slowly without swinging."],"Too hard? Bend your knees (hanging knee raise)."],
cable_crunch:[["Kneel facing a high pulley with a rope attached, holding the rope beside your head.","Keep your hips still.","Crunch down, bringing your elbows toward your thighs.","Rise back up slowly."],"Round your spine to crunch. Don't just bend at the hips."],
sit_up:[["Lie on your back, knees bent, feet anchored or flat.","Cross your arms over your chest.","Sit all the way up by curling your torso.","Lower back down slowly."],"Control the way down; don't just flop back."],
decline_situp:[["Lie on a decline bench with your feet hooked under the pads.","Cross your arms over your chest.","Curl up until your torso is upright.","Lower slowly."],"A steeper decline is harder. Start with a slight angle."],
reverse_crunch:[["Lie on your back with your legs up and knees bent at 90°.","Rest your arms by your sides.","Curl your hips off the floor, bringing your knees toward your chest.","Lower slowly."],"Use your abs to lift your hips, not momentum."],
leg_raise:[["Lie on your back with your legs straight and hands under your hips.","Press your lower back into the floor.","Raise your legs until they're vertical.","Lower slowly, stopping just before your back arches."],"If your lower back lifts, bend your knees a little."],
v_up:[["Lie flat with arms stretched overhead and legs straight.","Lift your arms and legs at the same time.","Reach your hands toward your toes, forming a V.","Lower back down with control."],"Too hard? Bend your knees (tuck-ups)."],
flutter_kick:[["Lie on your back, hands under your hips, legs straight.","Lift your heels a few inches off the floor.","Kick your legs up and down in small, quick movements.","Each kick counts as a rep."],"Keep your lower back pressed into the floor."],
mountain_climber:[["Start in a high push-up position.","Drive one knee toward your chest.","Switch legs quickly, like running in place.","Each knee drive counts as a rep."],"Keep your hips level, not bouncing up and down."],
hollow_hold:[["Lie on your back with arms overhead.","Press your lower back flat into the floor.","Lift your arms, shoulders and legs a few inches off the floor.","Hold for time."],"Bend your knees or bring your arms to your sides to make it easier."],
knee_raise:[["Hang from a pull-up bar or use a captain's chair.","Brace your abs.","Bring your knees up toward your chest.","Lower slowly without swinging."],"Curl your hips up at the top for a stronger ab squeeze."],
toes_to_bar:[["Hang from a pull-up bar with straight arms.","Brace your abs and pull your shoulders down.","Swing your straight legs up until your toes touch the bar.","Lower with control."],"An advanced move. Master hanging leg raises first."],
ab_wheel:[["Kneel holding the ab wheel on the floor under your shoulders.","Brace your abs and squeeze your glutes.","Roll forward slowly as far as you can without your back arching.","Pull back to the start using your abs."],"Start with short rollouts and go further as you get stronger."],
machine_crunch:[["Adjust the seat and grab the handles or rest your arms on the pads.","Brace your abs.","Crunch forward, bringing your chest toward your knees.","Return slowly."],"Breathe out as you crunch for a stronger contraction."],
weighted_crunch:[["Lie on your back with knees bent, holding a dumbbell or plate on your chest.","Curl your shoulders off the floor.","Squeeze your abs at the top.","Lower slowly."],"Hold the weight on your chest, not behind your head."],
side_plank:[["Lie on your side, propped on your forearm with your elbow under your shoulder.","Stack your feet.","Lift your hips so your body forms a straight line.","Hold for time, then switch sides."],"Too hard? Bend your knees and balance on them instead."],
bicycle_crunch:[["Lie on your back with your hands lightly behind your head.","Lift your shoulders and bring one knee in.","Twist to bring your opposite elbow toward that knee.","Switch sides in a pedaling motion. Each side counts as a rep."],"Go slow and twist fully; speed makes it much less effective."],
heel_taps:[["Lie on your back, knees bent, feet flat.","Lift your shoulders slightly off the floor.","Reach one hand toward the heel on that side.","Alternate sides. Each tap counts as a rep."],"Keep your shoulders off the floor the whole set."],
oblique_raise:[["Hang from a pull-up bar.","Bring your knees up and twist them toward one side.","Lower with control.","Alternate sides."],"Don't swing. Keep it controlled to really work the obliques."],
woodchop:[["Set a cable high, stand side-on and grab the handle with both hands.","Feet shoulder-width, arms straight.","Pull the handle diagonally down and across your body, rotating your torso.","Return slowly. Finish one side, then switch."],"Pivot your back foot and turn from your core, not your arms."],
pallof:[["Set a cable at chest height and stand side-on, holding the handle at your chest.","Step away until there's tension.","Press the handle straight out in front of you.","Resist the twist, hold for a second, then bring it back."],"It's an anti-rotation exercise: don't let the cable turn you."],
side_bend:[["Stand holding a dumbbell in one hand.","Keep your hips still.","Bend sideways toward the dumbbell.","Stand back up by squeezing the opposite side. Finish one side, then switch."],"Hold the weight in one hand only. Two cancel each other out."],
weighted_twist:[["Sit with knees bent, holding a dumbbell or plate at your chest.","Lean back slightly with a straight back.","Rotate to bring the weight beside one hip.","Rotate to the other side. Each side counts as a rep."],"Move slowly and keep the weight close to your body."]

const HOWTO_ES={

pistol_squat:[["Párate en una pierna con la otra estirada al frente.", "Estira los brazos al frente para equilibrarte.", "Baja en sentadilla completa con la pierna de apoyo, sin levantar el talón.", "Sube de nuevo. Termina una pierna y cambia."],"Sostente de un marco de puerta o baja hasta un banco mientras aprendes."],

l_sit:[["Siéntate en el piso (o en paralelas o bloques) con las piernas estiradas.", "Pon las manos junto a la cadera y empuja fuerte hacia abajo.", "Despega la cadera y las piernas del piso, con las piernas estiradas al frente.", "Sostén el tiempo indicado."],"¿Muy difícil? Dobla las rodillas (tuck) y estíralas a medida que te fortalezcas."],
windshield_wipers:[["Cuélgate de una barra y sube las piernas hasta que apunten al techo.", "Mantén las piernas juntas y estiradas.", "Gíralas hacia un lado y luego llévalas al otro lado.", "Cada lado cuenta como una rep."],"Muy avanzado. Apréndelo primero acostado en el piso."],
dragon_flag:[["Acuéstate en un banco y sujétalo por detrás de la cabeza.", "Sube el cuerpo hasta que solo la parte alta de la espalda toque el banco, con el cuerpo recto.", "Baja el cuerpo recto despacio hacia el banco.", "Detente justo encima y vuelve a subir."],"Empieza solo con la bajada lenta o dobla las rodillas para hacerlo más fácil."],
front_lever:[["Cuélgate de la barra con los brazos estirados.", "Lleva las rodillas al pecho.", "Jala con los brazos estirados hasta que la espalda quede plana y paralela al piso.", "Sostén el tiempo indicado."],"Empuja la barra hacia la cadera con los brazos estirados. Al fortalecerte, estira las piernas."],
handstand_hold:[["Pon las manos a un palmo de la pared.", "Impúlsate para apoyar los talones en la pared.", "Empuja el piso con los brazos estirados y el cuerpo firme.", "Sostén el tiempo indicado."],"Aprende primero a bajar con seguridad: baja un pie o sal de lado."],
burpee:[["Párate derecho, baja en sentadilla y pon las manos en el piso.", "Salta con los pies hacia atrás a posición de flexión y haz una flexión.", "Salta con los pies de vuelta a las manos.", "Salta con los brazos arriba."],"Mantén un ritmo que puedas sostener. Quita la flexión para hacerlo más fácil."],

bench:[["Acuéstate en el banco con los ojos debajo de la barra y los pies apoyados en el piso.","Toma la barra un poco más abierta que el ancho de hombros, junta los omóplatos y desengancha.","Baja la barra con control hasta la mitad del pecho, con los codos a unos 45° del cuerpo.","Empuja de nuevo hasta estirar los brazos."],"Mantén los glúteos en el banco y las muñecas alineadas sobre los codos. Usa un compañero o barras de seguridad cuando cargues pesado."],
incline_bb:[["Pon el banco a unos 30–45°. Acuéstate con los ojos debajo de la barra.","Toma la barra un poco más abierta que los hombros, junta los omóplatos y desengancha.","Baja la barra a la parte alta del pecho, justo debajo de las clavículas.","Empuja hacia arriba y un poco hacia atrás hasta estirar los brazos."],"Una inclinación más baja (unos 30°) mantiene el trabajo en la parte alta del pecho en vez de los hombros."],
db_bench:[["Siéntate en un banco plano con las mancuernas sobre los muslos, luego acuéstate y llévalas junto al pecho.","Empuja las mancuernas hasta estirar los brazos sobre el pecho.","Baja despacio hasta que los codos queden un poco por debajo del banco.","Empuja de nuevo, acercando las mancuernas arriba."],"Mantén los codos a unos 45° del cuerpo, no totalmente abiertos."],
incline_db:[["Pon el banco a 30–45° y siéntate con las mancuernas a la altura de los hombros.","Empuja las mancuernas sobre la parte alta del pecho.","Baja despacio hasta sentir un estiramiento en el pecho.","Empuja de nuevo sin chocar las pesas."],"Mantén los omóplatos pegados al banco todo el tiempo."],
db_fly:[["Acuéstate en un banco plano con las mancuernas sobre el pecho y las palmas enfrentadas.","Mantén los codos un poco flexionados.","Abre los brazos en arco hasta sentir un estiramiento en el pecho.","Aprieta el pecho para subir las mancuernas por el mismo arco."],"Piensa en «abrazar un árbol». Usa poco peso: el estiramiento de abajo es donde ocurren las lesiones."],
cable_fly:[["Pon ambas poleas a la altura de los hombros o más arriba y toma un agarre en cada mano.","Da un paso al frente con un pie, brazos abiertos y codos un poco flexionados.","Junta las manos frente al pecho en un arco amplio.","Regresa despacio hasta sentir el estiramiento y repite."],"Mantén fija la flexión del codo. Si los codos se doblan y se estiran, se vuelve un press."],
pec_deck:[["Ajusta el asiento para que los agarres queden a la altura del pecho.","Siéntate derecho con la espalda en el respaldo y toma los agarres o almohadillas.","Junta los brazos frente a ti apretando el pecho.","Abre despacio hasta sentir un estiramiento ligero."],"Mantén los hombros abajo y atrás. No dejes que se vayan hacia delante al final."],
chest_press:[["Ajusta el asiento para que los agarres queden a la mitad del pecho.","Siéntate con la espalda plana en el respaldo y toma los agarres.","Empuja hacia delante hasta estirar los brazos sin bloquearlos.","Regresa despacio hasta sentir el estiramiento en el pecho."],"Una gran opción para aprender a empujar con seguridad, sin necesidad de compañero."],
pushup:[["Pon las manos un poco más abiertas que los hombros, con el cuerpo en línea recta de la cabeza a los talones.","Aprieta el abdomen y los glúteos.","Baja el pecho hasta quedar justo encima del piso, con los codos a unos 45° del cuerpo.","Empuja de nuevo hasta estirar los brazos."],"¿Muy difícil? Pon las manos en un banco. ¿Muy fácil? Eleva los pies o usa una mochila con peso."],
dip:[["Toma las barras paralelas y sostente con los brazos estirados.","Inclina el pecho un poco hacia delante.","Baja hasta que los brazos queden más o menos paralelos al piso.","Empuja de nuevo hasta estirar los brazos."],"Inclinarte trabaja más el pecho; mantenerte derecho trabaja más los tríceps. No bajes más de lo cómodo para tus hombros."],
ohp:[["Pon la barra a la altura de la parte alta del pecho. Tómala justo por fuera de los hombros y desengancha con la barra sobre los hombros.","Párate con los pies al ancho de cadera, aprieta glúteos y abdomen.","Empuja la barra hacia arriba, llevando la cabeza un poco atrás para que pase.","Bloquea arriba con la barra sobre la mitad del pie y baja a los hombros."],"No te inclines hacia atrás. Glúteos y abdomen firmes protegen tu espalda baja."],
db_ohp:[["Siéntate en un banco vertical con las mancuernas a la altura de los hombros, palmas al frente.","Mantén la espalda en el respaldo y los pies firmes.","Empuja las mancuernas hasta casi estirar los brazos.","Baja con control a la altura de los hombros."],"Detente justo antes de bloquear los codos para mantener la tensión en los hombros."],
arnold:[["Siéntate derecho con las mancuernas frente a los hombros y las palmas hacia ti.","Al empujar hacia arriba, gira las palmas hacia el frente.","Termina con los brazos arriba y las palmas al frente.","Invierte el giro al bajar al inicio."],"Muévete despacio. El giro es lo importante, no lo apresures."],
shoulder_press_m:[["Ajusta el asiento para que los agarres queden a la altura de los hombros.","Siéntate con la espalda en el respaldo y toma los agarres.","Empuja hasta casi estirar los brazos.","Baja despacio a la altura de los hombros."],"Mantén la espalda baja en el respaldo; no la arquees para empujar más peso."],
lat_raise:[["Párate con mancuernas ligeras a los costados.","Con los codos un poco flexionados, sube los brazos hacia los lados.","Detente a la altura de los hombros, con los meñiques un poco arriba.","Baja despacio."],"Poco peso y sin balancearte. Guía el movimiento con los codos, no con las manos."],

face_pull:[["Pon una cuerda en la polea a la altura del pecho o más arriba.","Toma la cuerda con los pulgares hacia atrás y aléjate hasta estirar los brazos.","Jala la cuerda hacia la cara, separando las manos con los codos altos.","Aprieta la parte posterior de los hombros y regresa despacio."],"Termina como en una pose de doble bíceps. Excelente para la salud de los hombros y la postura."],
pike_pushup:[["Empieza en posición de flexión, acerca los pies y sube la cadera formando una V invertida.","Dobla los codos para bajar la coronilla hacia el piso entre las manos.","Empuja de nuevo hasta estirar los brazos.","Mantén la cadera alta todo el tiempo."],"Subir los pies a un banco lo hace más difícil y más parecido a un press militar."],
band_pull_apart:[["Sostén una banda frente a ti a la altura de los hombros con los brazos estirados y las manos al ancho de hombros.","Separa la banda llevando los brazos hacia los lados.","Junta los omóplatos cuando la banda toque tu pecho.","Regresa despacio."],"Mantén los hombros lejos de las orejas. Ideal como calentamiento."],

bb_row:[["Toma la barra con agarre prono, las manos un poco más abiertas que las piernas.","Inclínate hacia delante hasta unos 45° o más, rodillas flexionadas y espalda recta.","Jala la barra hacia las costillas bajas, llevando los codos atrás.","Baja con control."],"No te enderces para mover el peso. Mantén el mismo ángulo del torso en cada rep."],
db_row:[["Apoya una rodilla y la mano del mismo lado en un banco, con la espalda recta.","Sostén una mancuerna con la mano libre, el brazo colgando.","Jala la mancuerna hacia la cadera, con el codo cerca del cuerpo.","Baja despacio hasta estirar el brazo."],"Piensa en «llevar el codo al bolsillo trasero» para trabajar los dorsales, no solo el brazo."],
pullup:[["Cuélgate de la barra con agarre prono, las manos un poco más abiertas que los hombros.","Baja y lleva atrás los hombros para empezar el movimiento.","Sube hasta que la barbilla pase la barra.","Baja completamente con control."],"¿Aún no te sale una? Usa una banda, una máquina asistida o haz solo la bajada lenta."],
chinup:[["Cuélgate de la barra con las palmas hacia ti y las manos al ancho de hombros.","Baja los hombros y luego sube.","Lleva la barbilla por encima de la barra.","Baja completamente despacio."],"Suelen ser más fáciles que las dominadas porque los bíceps ayudan más. Una gran primera meta."],
lat_pulldown:[["Siéntate con los muslos bajo las almohadillas y toma la barra más abierta que los hombros.","Inclínate un poco atrás y baja los hombros.","Jala la barra a la parte alta del pecho, llevando los codos abajo.","Deja subir la barra despacio hasta estirar los brazos."],"No jales por detrás del cuello ni balancees el cuerpo para mover el peso."],
cable_row:[["Siéntate con los pies en la plataforma, rodillas un poco flexionadas, y toma el agarre.","Siéntate derecho con la espalda recta y los brazos estirados.","Jala el agarre hacia el abdomen juntando los omóplatos.","Regresa despacio hasta estirar los brazos."],"Mantén el torso quieto. No te balancees para mover el peso."],
machine_row:[["Ajusta el asiento para que los agarres queden a la altura del pecho, con el pecho en el respaldo.","Toma los agarres con los brazos estirados.","Jala hacia atrás llevando los codos más allá de los costados.","Regresa despacio."],"Haz una pausa de un segundo apretando atrás en cada rep."],
db_shrug:[["Párate con mancuernas a los costados.","Sube los hombros directo hacia las orejas.","Sostén un segundo arriba.","Baja despacio."],"Sube y baja en línea recta. No gires los hombros."],
band_row:[["Ancla una banda a la altura del pecho, o pásala por los pies estando sentado.","Sostén los extremos con los brazos estirados.","Jala las manos hacia el abdomen juntando los omóplatos.","Regresa despacio."],"Aléjate más para tener más resistencia."],
back_ext:[["Ajusta la almohadilla justo debajo de los huesos de la cadera y engancha los pies.","Cruza los brazos sobre el pecho.","Baja el torso doblándote desde la cadera hasta sentir el estiramiento en los isquiotibiales.","Sube hasta que tu cuerpo quede en línea recta."],"Detente en línea recta. No arquees de más la espalda baja arriba."],
good_morning:[["Apoya una barra ligera en la parte alta de la espalda, como en una sentadilla.","Párate con los pies al ancho de cadera y las rodillas un poco flexionadas.","Lleva la cadera atrás bajando el pecho hasta sentir un fuerte estiramiento en los isquiotibiales.","Empuja la cadera adelante para volver a ponerte de pie."],"Empieza muy ligero. La espalda debe quedar recta todo el tiempo."],
weighted_back_ext:[["Colócate como en la extensión de espalda, sosteniendo un disco contra el pecho.","Baja el torso doblándote desde la cadera.","Sube hasta que tu cuerpo quede recto.","Controla el peso al bajar."],"Domina primero la versión sin peso y luego agrega peso poco a poco."],
bird_dog:[["Empieza en cuatro puntos, con las manos bajo los hombros y las rodillas bajo la cadera.","Aprieta el abdomen y mantén la espalda recta.","Estira un brazo al frente y la pierna contraria atrás hasta que queden rectos.","Sostén un segundo, regresa y cambia de lado."],"Imagina un vaso de agua sobre tu espalda baja: no lo derrames."],
superman:[["Acuéstate boca abajo con los brazos estirados por encima de la cabeza.","Aprieta los glúteos y la espalda baja.","Levanta brazos, pecho y piernas del piso a la vez.","Sostén, con el cuello alineado con la columna."],"Mira al piso, no al frente, para proteger el cuello."],
bb_curl:[["Párate con una barra en agarre supino al ancho de hombros.","Mantén los codos pegados a los costados.","Sube la barra hacia los hombros.","Baja despacio hasta estirar los brazos."],"Sin balanceo. Si tienes que inclinarte atrás, el peso es demasiado."],
db_curl:[["Párate con mancuernas a los costados, palmas al frente.","Mantén los codos a los costados.","Sube las pesas apretando los bíceps.","Baja despacio hasta abajo."],"Bajar despacio (2–3 segundos) construye tanto músculo como subir."],
hammer_curl:[["Párate con mancuernas a los costados, palmas hacia el cuerpo.","Mantén las palmas hacia dentro todo el tiempo.","Sube las pesas hacia los hombros.","Baja despacio."],"Trabaja más los antebrazos y la parte externa del bíceps que el curl normal."],
cable_curl:[["Pon una barra recta o una cuerda en la polea baja.","Párate frente a la máquina y toma el agarre en supino.","Sube el agarre hacia los hombros con los codos a los costados.","Baja despacio."],"El cable mantiene la tensión todo el recorrido; haz las reps suaves."],
preacher:[["Ajusta el asiento para que los brazos queden planos sobre la almohadilla.","Toma los agarres en supino.","Sube hasta que los antebrazos queden verticales.","Baja despacio hasta casi estirar los brazos."],"No dejes caer el peso rápido abajo; ahí es donde se lastiman los codos."],
band_curl:[["Párate sobre el centro de una banda y sostén los extremos, palmas al frente.","Mantén los codos a los costados.","Sube las manos hacia los hombros.","Baja despacio."],"Abre más los pies sobre la banda para más resistencia."],
skull:[["Acuéstate en un banco con una barra o barra Z sobre el pecho y los brazos estirados.","Mantén los brazos quietos y un poco inclinados hacia atrás.","Dobla los codos para bajar la barra hacia la frente.","Estira los brazos para subirla de nuevo."],"Poco peso y despacio. Baja la barra justo detrás de la cabeza si te molestan los codos."],
pushdown:[["Pon una barra o cuerda en la polea alta y tómala con los codos doblados.","Pega los codos a los costados.","Empuja hacia abajo hasta estirar los brazos.","Deja subir el agarre despacio hasta que los antebrazos queden paralelos al piso."],"Solo se mueven los antebrazos. Los codos quedan pegados a los costados."],
oh_ext:[["Sostén una mancuerna con ambas manos por encima de la cabeza, de pie o sentado.","Mantén los codos apuntando al frente y cerca de la cabeza.","Baja la mancuerna detrás de la cabeza doblando los codos.","Estira los brazos para subirla de nuevo."],"Mantén las costillas abajo; no arquees la espalda para terminar la rep."],
cg_bench:[["Acuéstate en el banco y toma la barra más o menos al ancho de hombros.","Desengancha y mantén los codos cerca del cuerpo.","Baja la barra a la parte baja del pecho.","Empuja de nuevo hasta estirar los brazos."],"Con las manos al ancho de hombros basta. Más cerrado es duro para las muñecas."],
bench_dip:[["Siéntate en el borde de un banco con las manos junto a la cadera, dedos al frente.","Desliza los glúteos fuera del banco con las piernas al frente.","Baja doblando los codos a unos 90°.","Empuja de nuevo hasta estirar los brazos."],"Dobla las rodillas para hacerlo más fácil. Mantén la espalda cerca del banco."],
band_pushdown:[["Ancla una banda en alto, por ejemplo sobre una puerta o una barra de dominadas.","Tómala con los codos doblados y pegados a los costados.","Empuja hacia abajo hasta estirar los brazos.","Regresa despacio."],"Aprieta fuerte los tríceps abajo en cada rep."],
wrist_curl:[["Siéntate y apoya los antebrazos en los muslos o un banco, palmas arriba y muñecas fuera del borde.","Sostén una mancuerna en cada mano.","Sube las muñecas lo más que puedas.","Baja despacio, dejando rodar el peso hacia los dedos."],"Movimiento corto, poco peso y muchas reps (15–20) funciona mejor para los antebrazos."],
rev_wrist_curl:[["Apoya los antebrazos en un banco o los muslos, palmas abajo y muñecas fuera del borde.","Sostén mancuernas ligeras.","Sube el dorso de las manos hacia ti.","Baja despacio."],"Usa menos peso que en el curl de muñeca normal. Estos músculos son más pequeños."],
btb_wrist_curl:[["Párate con una barra detrás de la espalda, palmas hacia atrás.","Deja los brazos colgando estirados.","Sube la barra doblando solo las muñecas.","Baja despacio."],"Permite usar más peso que el curl de muñeca sentado. Mantén los brazos quietos."],
rev_curl:[["Párate con una barra en agarre prono (palmas abajo) al ancho de hombros.","Mantén los codos a los costados.","Sube la barra hacia los hombros.","Baja despacio."],"Usa más o menos la mitad del peso de tu curl normal. Fortalece antebrazos y agarre."],
cable_wrist_curl:[["Pon una barra recta en la polea baja y arrodíllate o siéntate frente a ella.","Apoya los antebrazos en un banco o los muslos, palmas arriba.","Sube las muñecas.","Baja despacio."],"Mantén los antebrazos quietos; solo se mueven las muñecas."],
dead_hang:[["Toma una barra de dominadas con agarre prono, manos al ancho de hombros.","Levanta los pies y cuélgate con los brazos estirados.","Mantén los hombros un poco activos, no totalmente caídos.","Aguanta lo más que puedas; registra los segundos."],"Excelente para la fuerza de agarre y descomprimir la espalda. El magnesio ayuda."],
plate_pinch:[["Junta dos discos con los lados lisos hacia fuera.","Pellízcalos con los dedos de un lado y el pulgar del otro.","Levántalos y sostenlos a tu costado.","Aguanta lo más que puedas y cambia de mano."],"Empieza con dos discos de 10 lb (5 kg) y aumenta el tiempo."],
squat:[["Apoya la barra en la parte alta de la espalda (no en el cuello), con las manos justo por fuera de los hombros.","Párate con los pies al ancho de hombros y las puntas un poco hacia fuera. Aprieta el abdomen.","Siéntate hacia abajo y atrás hasta que la cadera quede al menos a la altura de las rodillas, con las rodillas en dirección de los pies.","Empuja con todo el pie para ponerte de pie."],"Pecho arriba y talones abajo. Usa siempre barras de seguridad o un compañero en series pesadas."],
front_squat:[["Apoya la barra en la parte delantera de los hombros, con las yemas de los dedos debajo y los codos altos.","Párate con los pies al ancho de hombros.","Baja en sentadilla con el torso derecho y los codos arriba.","Empuja de nuevo hasta ponerte de pie."],"Si te duelen las muñecas, cruza los brazos sobre la barra para sostenerla."],
goblet:[["Sostén una mancuerna vertical contra el pecho con ambas manos.","Párate con los pies un poco más abiertos que los hombros, puntas hacia fuera.","Baja en sentadilla entre las rodillas con el pecho arriba.","Empuja de nuevo hasta ponerte de pie."],"La mejor sentadilla para principiantes. Te enseña a mantenerte derecho."],
kb_goblet:[["Sostén una kettlebell por los lados del asa a la altura del pecho.","Párate con los pies un poco más abiertos que los hombros.","Baja en sentadilla con los codos por dentro de las rodillas.","Empuja de nuevo hasta ponerte de pie."],"Usa los codos para empujar suavemente las rodillas hacia fuera abajo."],
leg_press:[["Siéntate con la espalda plana en el respaldo y los pies al ancho de hombros en la plataforma.","Quita los seguros.","Baja la plataforma hasta que las rodillas queden a unos 90°.","Empuja de nuevo sin bloquear las rodillas."],"Nunca bloquees las rodillas arriba ni dejes que la espalda baja se despegue del respaldo."],
leg_ext:[["Ajusta el asiento para que las rodillas queden alineadas con el eje de la máquina.","Engancha la almohadilla justo arriba de los tobillos.","Estira las piernas apretando los cuádriceps.","Baja despacio."],"Haz una pausa de un segundo arriba para apretar más."],
leg_curl:[["Ajusta la máquina para que las rodillas queden alineadas con el eje y la almohadilla justo arriba de los talones.","Baja la almohadilla de los muslos para sujetar las piernas.","Lleva los talones hacia abajo y atrás lo más que puedas.","Regresa despacio."],"Lleva las puntas de los pies hacia las espinillas para trabajar más los isquiotibiales."],
lying_leg_curl:[["Acuéstate boca abajo con la almohadilla justo arriba de los talones y las rodillas justo fuera del banco.","Toma los agarres y mantén la cadera pegada al banco.","Lleva los talones hacia los glúteos.","Baja despacio."],"No despegues la cadera del banco para terminar la rep."],
hip_abduction:[["Siéntate en la máquina con las almohadillas por fuera de las rodillas.","Siéntate derecho y toma los agarres.","Empuja las rodillas hacia fuera lo más que puedas.","Regresa despacio sin dejar que las pesas se toquen."],"Inclinarte un poco hacia delante trabaja más los glúteos."],
hip_adduction:[["Siéntate en la máquina con las almohadillas por dentro de las rodillas.","Empieza con las piernas solo tan abiertas como te sea cómodo.","Junta las rodillas apretando.","Abre de nuevo despacio."],"No empieces demasiado abierto. Un estiramiento grande con carga puede lastimar la ingle."],
cable_adduction:[["Pon una tobillera en la polea baja y colócala en el tobillo de adentro.","Párate de lado a la máquina, sosteniéndote para equilibrarte.","Cruza la pierna con la tobillera por delante de la otra.","Regresa despacio."],"Mantén el cuerpo derecho. Solo se mueve la pierna."],
copenhagen:[["Acuéstate de lado y apoya la rodilla o el tobillo interno de la pierna de arriba en un banco.","Apóyate en el antebrazo.","Sube la cadera hasta que el cuerpo quede en línea recta, con la pierna de abajo colgando.","Sostén el tiempo indicado y cambia de lado."],"Empieza con el banco bajo la rodilla; bajo el tobillo es mucho más difícil."],
sumo_squat:[["Párate con los pies muy abiertos, puntas hacia fuera, sosteniendo una mancuerna entre las piernas.","Mantén el pecho arriba.","Baja derecho empujando las rodillas hacia fuera sobre los pies.","Sube apretando aductores y glúteos."],"Las rodillas deben apuntar hacia el mismo lado que los pies."],
cable_abduction:[["Pon una tobillera en la polea baja y colócala en el tobillo de afuera.","Párate de lado a la máquina, sosteniéndote para equilibrarte.","Sube la pierna con la tobillera hacia el lado.","Regresa despacio."],"Mantén las puntas de los pies al frente y el cuerpo derecho."],
side_leg_raise:[["Acuéstate de lado con las piernas estiradas y una sobre otra.","Apoya la cabeza en el brazo.","Sube la pierna de arriba a unos 45°.","Baja despacio."],"Mantén las puntas de los pies al frente, no hacia arriba, para trabajar la cadera externa."],
band_walk:[["Pon una minibanda alrededor de las piernas, justo arriba de las rodillas o los tobillos.","Baja a un cuarto de sentadilla con los pies al ancho de hombros.","Da pasos laterales manteniendo la banda tensa.","Da 10–15 pasos hacia cada lado. Cada paso cuenta como una rep."],"Mantente abajo y no juntes los pies."],
fire_hydrant:[["Empieza en cuatro puntos.","Mantén la rodilla doblada a 90°.","Sube una rodilla hacia el lado hasta que el muslo quede casi a la altura de la cadera.","Baja y repite, luego cambia de lado."],"Mantén la cadera nivelada. No te inclines para subir más."],
rdl:[["Párate con una barra a la altura de los muslos, pies al ancho de cadera.","Con las rodillas suaves, lleva la cadera atrás y desliza la barra por las piernas.","Baja hasta sentir un fuerte estiramiento en los isquiotibiales (normalmente a media espinilla).","Empuja la cadera adelante para ponerte de pie."],"La barra se queda pegada a las piernas y la espalda recta. Es una bisagra de cadera, no una sentadilla."],
db_rdl:[["Párate con mancuernas frente a los muslos.","Con las rodillas suaves, lleva la cadera atrás y baja las mancuernas por las piernas.","Detente al sentir un fuerte estiramiento en los isquiotibiales.","Empuja la cadera adelante para ponerte de pie."],"Mantén las mancuernas cerca de las piernas todo el recorrido."],
lunge:[["Párate con mancuernas a los costados.","Da un paso largo al frente.","Baja hasta que ambas rodillas queden a unos 90°, con la rodilla de atrás justo encima del piso.","Empuja con el talón de adelante para volver al inicio. Alterna piernas."],"Mantén la rodilla de adelante sobre el pie, sin que se vaya hacia dentro."],
bss:[["Párate un paso largo delante de un banco, con mancuernas.","Apoya el empeine del pie de atrás en el banco.","Baja derecho hasta que el muslo de adelante quede casi paralelo al piso.","Empuja con el pie de adelante para subir. Termina una pierna y cambia."],"Encuentra la posición del pie sin peso primero. ¡Prepárate para sudar!"],
step_up:[["Párate frente a un banco o cajón con mancuernas.","Apoya todo un pie en el cajón.","Empuja con ese pie para subir al cajón.","Baja despacio. Termina una pierna y cambia."],"No te impulses con el pie de atrás. Que la pierna de adelante haga el trabajo."],
hip_thrust:[["Siéntate en el piso con la parte alta de la espalda contra un banco y una barra acolchada sobre la cadera.","Apoya los pies en el piso, más o menos al ancho de hombros.","Sube la cadera hasta que el cuerpo quede plano de los hombros a las rodillas.","Aprieta los glúteos arriba y baja."],"Mete la barbilla y mantén las costillas abajo. No arquees la espalda baja arriba."],
kb_swing:[["Párate con los pies más abiertos que la cadera y la kettlebell en el piso frente a ti.","Inclínate desde la cadera, tómala y llévala hacia atrás entre las piernas.","Lanza la cadera adelante para balancearla hasta la altura del pecho.","Deja que regrese y repite."],"Es un impulso de cadera, no una sentadilla ni un levantamiento de brazos. Los brazos solo guían la pesa."],
glute_bridge:[["Acuéstate boca arriba con las rodillas dobladas y los pies apoyados al ancho de cadera.","Aprieta el abdomen.","Empuja con los talones para subir la cadera hasta que el cuerpo quede recto de los hombros a las rodillas.","Aprieta los glúteos y baja."],"Empuja con los talones. Levantar un poco las puntas puede ayudar."],
bw_squat:[["Párate con los pies al ancho de hombros y las puntas un poco hacia fuera.","Estira los brazos al frente para equilibrarte.","Siéntate hacia abajo y atrás lo más bajo que puedas con comodidad, pecho arriba.","Ponte de pie de nuevo."],"Los talones se quedan en el piso. Haz sentadillas hacia una silla para aprender la profundidad."],
bw_lunge:[["Párate derecho con las manos en la cintura.","Da un paso al frente y baja hasta que ambas rodillas queden a unos 90°.","Empuja con el pie de adelante y lleva el de atrás al frente para la siguiente zancada.","Sigue caminando alternando piernas."],"Da pasos lo bastante largos para que la rodilla de adelante quede sobre el tobillo."],
calf_raise:[["Párate con la punta de los pies en un escalón y los talones fuera.","Sostente de algo para equilibrarte.","Baja los talones lo más que puedas.","Sube en puntas lo más alto que puedas y aprieta."],"Haz una pausa arriba y abajo. Rebotar lo hace mucho menos efectivo."],
seated_calf:[["Siéntate con la almohadilla en la parte baja de los muslos y la punta de los pies en la plataforma.","Quita el seguro.","Baja los talones para un estiramiento completo.","Sube en puntas lo más alto que puedas."],"Trabaja la parte baja de la pantorrilla que las elevaciones de pie no alcanzan. Usa todo el rango."],
lp_calf:[["Siéntate en la prensa con solo la punta de los pies en el borde inferior de la plataforma.","Empuja la plataforma con las rodillas estiradas (sin bloquear).","Deja que las puntas vengan hacia ti para estirar.","Empuja con la punta de los pies para extender los tobillos."],"Mantén los seguros puestos y nunca dejes que los pies se resbalen de la plataforma."],
db_calf:[["Párate con mancuernas a los costados y la punta de los pies en un escalón.","Baja los talones para estirar.","Sube en puntas lo más alto que puedas.","Baja despacio."],"Mantén las rodillas estiradas pero sin bloquear."],
sl_calf:[["Párate en un pie en el borde de un escalón, sosteniéndote para equilibrarte.","Baja el talón lo más que puedas.","Sube en puntas lo más alto que puedas.","Termina todas las reps y cambia de pierna."],"Mucho más difícil que con dos piernas. Ideal cuando no tienes pesas."],
plank:[["Apóyate en los antebrazos y las puntas de los pies, con los codos bajo los hombros.","Forma una línea recta de la cabeza a los talones.","Aprieta los glúteos y el abdomen como si fueras a recibir un golpe.","Sostén el tiempo indicado."],"Si la cadera se hunde o te duele la espalda, detente. Una plancha corta y buena es mejor que una larga y mala."],
crunch:[["Acuéstate boca arriba con las rodillas dobladas y los pies apoyados.","Pon las yemas de los dedos ligeramente detrás de la cabeza.","Despega los hombros del piso apretando el abdomen.","Baja despacio."],"No jales el cuello. Imagina una manzana entre la barbilla y el pecho."],
dead_bug:[["Acuéstate boca arriba con los brazos hacia el techo y las rodillas dobladas a 90° sobre la cadera.","Pega la espalda baja al piso.","Baja despacio el brazo y la pierna contrarios hacia el piso.","Regresa y cambia de lado."],"La espalda baja debe quedarse pegada. Baja solo hasta donde puedas mantenerla así."],
russian_twist:[["Siéntate con las rodillas dobladas e inclínate un poco atrás con la espalda recta.","Levanta los pies del piso (o deja los talones abajo para hacerlo más fácil).","Gira el torso para tocar el piso con las manos de un lado.","Gira al otro lado. Cada lado cuenta como una rep."],"Gira los hombros, no solo los brazos."],
hanging_raise:[["Cuélgate de una barra de dominadas con los brazos estirados.","Aprieta el abdomen para no balancearte.","Sube las piernas estiradas hasta la altura de la cadera o más.","Baja despacio sin balancearte."],"¿Muy difícil? Dobla las rodillas (elevación de rodillas colgado)."],
cable_crunch:[["Arrodíllate frente a una polea alta con una cuerda, sosteniéndola junto a la cabeza.","Mantén la cadera quieta.","Encógete hacia abajo, llevando los codos hacia los muslos.","Sube de nuevo despacio."],"Redondea la columna al encogerte. No te dobles solo desde la cadera."],
sit_up:[["Acuéstate boca arriba con las rodillas dobladas y los pies sujetos o apoyados.","Cruza los brazos sobre el pecho.","Siéntate por completo enrollando el torso.","Baja despacio."],"Controla la bajada; no te dejes caer."],
decline_situp:[["Acuéstate en un banco declinado con los pies enganchados bajo las almohadillas.","Cruza los brazos sobre el pecho.","Sube enrollando el torso hasta quedar derecho.","Baja despacio."],"Un declive más pronunciado es más difícil. Empieza con un ángulo leve."],
reverse_crunch:[["Acuéstate boca arriba con las piernas arriba y las rodillas dobladas a 90°.","Deja los brazos a los costados.","Despega la cadera del piso llevando las rodillas hacia el pecho.","Baja despacio."],"Usa el abdomen para subir la cadera, no el impulso."],
leg_raise:[["Acuéstate boca arriba con las piernas estiradas y las manos bajo la cadera.","Pega la espalda baja al piso.","Sube las piernas hasta que queden verticales.","Baja despacio, deteniéndote justo antes de que se arquee la espalda."],"Si la espalda baja se despega, dobla un poco las rodillas."],
v_up:[["Acuéstate estirado con los brazos por encima de la cabeza y las piernas rectas.","Sube brazos y piernas al mismo tiempo.","Lleva las manos hacia los pies formando una V.","Baja con control."],"¿Muy difícil? Dobla las rodillas."],
flutter_kick:[["Acuéstate boca arriba con las manos bajo la cadera y las piernas estiradas.","Despega los talones unos centímetros del piso.","Mueve las piernas arriba y abajo con movimientos cortos y rápidos.","Cada patada cuenta como una rep."],"Mantén la espalda baja pegada al piso."],
mountain_climber:[["Empieza en posición de flexión con los brazos estirados.","Lleva una rodilla hacia el pecho.","Cambia de pierna rápido, como si corrieras en tu lugar.","Cada rodilla cuenta como una rep."],"Mantén la cadera nivelada, sin rebotar."],
hollow_hold:[["Acuéstate boca arriba con los brazos por encima de la cabeza.","Pega la espalda baja al piso.","Despega brazos, hombros y piernas unos centímetros del piso.","Sostén el tiempo indicado."],"Dobla las rodillas o lleva los brazos a los costados para hacerlo más fácil."],

function bodyW(){const b=+S.settings.bw;return b>0?conv(b,S.settings.bwUnit||U()):0;}
function exScore(ex){
  const el=eliteOf(ex)*ELITE_SCALE;if(!el)return null;

  if(isLoad(ex)){
    const bw=bodyW();if(!bw)return null;let best=0,br=8;
    for(const x of h)for(const s of x.sets){const rr=Math.min(12,+s.r||0),e=metric(ex,+conv(s.w,x.unit)||0,rr);if(e>best){best=e;br=rr||8;}}
    if(!best)return null;
    return{s:best/bw/el,ex,el,bw,reps:Math.min(12,Math.max(1,br))};
  }
  let best=0;for(const x of h)for(const s of x.sets)best=Math.max(best,metric(ex,+conv(s.w,x.unit)||0,+s.r||0));
  return best?{s:best/el,ex,el}:null;

const NEXT_VAR={pushup:'diamond_pushup',diamond_pushup:'archer_pushup',decline_pushup:'archer_pushup',archer_pushup:'pseudo_planche',pike_pushup:'hspu',
 bench_dip:'dip',dip:'muscle_up',scap_pullup:'pullup',inverted_row:'pullup',chinup:'pullup',pullup:'archer_pullup',wide_pullup:'archer_pullup',archer_pullup:'muscle_up',
 bw_squat:'jump_squat',jump_squat:'pistol_squat',bw_lunge:'pistol_squat',glute_bridge:'sl_glute_bridge',calf_raise:'sl_calf',knee_raise:'hanging_raise',hanging_raise:'toes_to_bar',
 plank:'l_sit',crunch:'v_up',leg_raise:'dragon_flag'};
// Advanced skills only show up in generated workouts once earned.
const ADV=new Set(['muscle_up','archer_pullup','archer_pushup','hspu','pseudo_planche','pistol_squat','nordic_curl','windshield_wipers','dragon_flag','front_lever','toes_to_bar','handstand_hold']);
function unlocked(ex){
  if(!ADV.has(ex.id)||S.settings.exp==='advanced'||history(ex.id).length)return true;
  return Object.keys(NEXT_VAR).filter(k=>NEXT_VAR[k]===ex.id).some(k=>{const p=EX(k),l=lastSets(k);if(!p||!l)return false;return Math.max(...l.sets.map(s=>+s.r||0))>=scheme(p).hi;});
}
function suggest(ex){
  const sc=scheme(ex),last=lastSets(ex.id);
  if(!last){
    if(ex.inc==='sec')return{w:'',r:sc.lo,note:'First time — hold as long as you can with good form'};
    if(ex.inc==='bw')return{w:'',r:sc.lo,note:'First time — do as many clean reps as you can'};
    return{w:'',r:Math.round((sc.lo+sc.hi)/2),note:'First time — pick a weight you could lift for ~2 more reps'};
  }
  const sets=last.sets.map(s=>({w:+conv(s.w,last.unit)||0,r:+s.r||0}));
  const top=Math.max(...sets.map(s=>s.w));
  const atTop=sets.filter(s=>s.w===top);
  const minR=Math.min(...atTop.map(s=>s.r)),maxR=Math.max(...atTop.map(s=>s.r));
  if(ex.inc==='sec')return{w:top||'',r:maxR+5,note:'Aim for 5 seconds longer than last time'};
  if(ex.inc==='bw'){
    if(minR>=sc.hi){const nx=EX(NEXT_VAR[ex.id]);return{w:top||'',r:minR+1,note:nx?'You hit '+sc.hi+'+ reps — try '+nx.name+' next':'You hit '+sc.hi+'+ reps — try adding weight or a harder variation'};}
    return{w:top||'',r:minR+1,note:'One more rep per set than last time'};
  }
  const inc=incr(ex);
  if(minR>=sc.hi)return{w:rnd(top+inc),r:sc.lo,note:'You hit '+sc.hi+' reps on every set — up '+inc+' '+U()};
  if(minR>=sc.lo)return{w:top,r:Math.min(sc.hi,minR+1),note:'Same weight — aim for one more rep'};
  if(minR>=sc.lo-1)return{w:top,r:sc.lo,note:'Same weight — get every set to '+sc.lo+' reps'};

}

const TAU=30; // hours; fatigue decays exponentially
function fatigue(){
  const now=Date.now(),f={};for(const m in MUSCLES)f[m]=0;
  for(const w of S.workouts){
    const h=(now-w.end)/36e5;if(h>240||h<0)continue;const d=Math.exp(-h/TAU);
    for(const e of w.exercises){const ex=EX(e.exId);if(!ex)continue;const n=e.sets.length;
      ex.p.forEach(m=>f[m]+=12*n*d);ex.s.forEach(m=>f[m]+=6*n*d);}
  }
  for(const m in f)f[m]=Math.min(100,f[m]);
  return f;
}
function recovery(){const f=fatigue(),r={};for(const m in f)r[m]=Math.round(100-f[m]);return r;}
function pickAuto(rec){
  const lastF=(S.workouts[S.workouts.length-1]||{}).focus;let best='push',bs=-1;
  for(const g of ['push','pull','legs']){const ms=GROUPS[g];let a=ms.reduce((s,m)=>s+rec[m],0)/ms.length;if(g===lastF)a-=5;if(a>bs){bs=a;best=g;}}
  return best;
}
function generate(focus){
  const rec=recovery(),f=focus==='auto'?pickAuto(rec):focus,allowed=new Set(GROUPS[f]);
  const lw=S.workouts[S.workouts.length-1];
  const lastIds=new Set(lw?lw.exercises.map(e=>e.exId):[]);
  const hasWeights=WEIGHT_EQ.some(k=>S.settings.equip.includes(k));
  const cand0=allEx().filter(ex=>hasEq(ex)&&unlocked(ex)&&ex.p.length&&ex.p.every(m=>allowed.has(m))&&(f!=='calis'||((ex.inc==='bw'||ex.inc==='sec')&&ex.id!=='plate_pinch')));
  const cand=cand0.filter(ex=>!injuryFor(ex)),skipped=cand0.length-cand.length;
  const sim=Object.assign({},rec),chosen=[],hits={},N=S.settings.count;
  for(let i=0;i<N;i++){
    let best=null,bs=-1e9;
    for(const ex of cand){
      if(chosen.includes(ex)||ex.p.some(m=>(hits[m]||0)>=2))continue;
      const pr=ex.p.map(m=>sim[m]);
      let sc=pr.reduce((a,b)=>a+b,0)/pr.length+Math.random()*15;
      if(ex.c)sc+=i<Math.ceil(N/2)?20:-5;
      if(lastIds.has(ex.id))sc-=10;
      if(Math.min(...pr)<40)sc-=60;
      const core=x=>x.p.some(m=>m==='abs'||m==='obliques');
      if(f!=='core'&&core(ex)&&chosen.some(core))sc-=60;
      if(f!=='calis'&&hasWeights&&!isLoad(ex)&&!core(ex)&&!['pullup','chinup','dip'].includes(ex.id))sc-=15;
      if(sc>bs){bs=sc;best=ex;}
    }
    if(!best)break;
    chosen.push(best);
    best.p.forEach(m=>{sim[m]-=30;hits[m]=(hits[m]||0)+1;});
    best.s.forEach(m=>sim[m]-=10);
  }
  chosen.sort((a,b)=>b.c-a.c);
  return{focus:f,list:chosen,skipped};
}
