<title>Forge</title>
<style>
:root{color-scheme:dark;--bg:#0d0e11;--card:#17191f;--card2:#20232b;--line:#2b2f3a;--text:#f2f3f5;--muted:#8b92a1;--acc:#ff6b35;--good:#3ecf8e;--warn:#f5c04a;--bad:#ff5468}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;line-height:1.4}
body.noscroll{overflow:hidden}
main{padding:8px 16px calc(150px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
h1{font-size:30px;margin:12px 0 14px;letter-spacing:-.5px}
h2{font-size:24px;margin:4px 0 6px}
h3{font-size:17px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=text],input[type=search],input[type=email],input[type=date]{width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:16px;font-family:inherit}
#idea_msg{font-family:inherit;font-size:16px;resize:vertical;min-height:120px;line-height:1.4}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font-family:inherit;font-size:16px;font-weight:600;margin-top:10px;background:var(--card2);color:var(--text);cursor:pointer}
.btn.primary{background:var(--acc);color:#fff}
.btn.big{padding:16px;font-size:17px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger-ghost{background:transparent;color:var(--bad);border:1px solid rgba(255,84,104,.35)}
.btn.sm{padding:9px 12px;font-size:14px;margin-top:0}
.row{display:flex;gap:8px;margin-top:10px}
.icon{background:var(--card2);border:0;color:var(--text);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
.chip{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;margin:4px 4px 0 0;font-size:14px}
.chip input{accent-color:var(--acc);width:16px;height:16px;margin:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;background:rgba(13,14,17,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin:-8px -16px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.topbar .btn{width:auto;margin:0;padding:11px 22px}
.elapsed{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exhead h3{margin:0 0 2px}
.exbtns{display:flex;gap:6px;flex-shrink:0}
.last{color:var(--muted);margin-top:8px}
.note{color:var(--acc);margin-top:4px}
.sethead,.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center}
.sethead{margin-top:12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sethead span{text-align:center}
.set{margin-top:8px}
.set .n{text-align:center;color:var(--muted);font-weight:600}
.set input{text-align:center;padding:10px 6px;font-size:17px;font-variant-numeric:tabular-nums}
.tick{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:18px;cursor:pointer}
.set.done input{border-color:rgba(62,207,142,.5)}
.set.done .tick{background:var(--good);border-color:var(--good);color:#06150e}
.mini{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mini .pct{text-align:right;font-weight:600}
.track{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.good{background:var(--good)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.rec{padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rechead{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.rec .muted{margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:12px;color:var(--muted)}
details.card summary{list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.hrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.ct{fill:var(--muted);font-size:11px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(18,19,23,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:8px 0 6px;font-size:11px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}

nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rest{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:20;background:#23262f;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:8px;padding:10px 12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:616px;margin:0 auto}
.restfill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,107,53,.2);transition:width .25s linear}
.rest .lab{position:relative;flex:1;display:flex;align-items:baseline;gap:8px}
.rest .lab b{font-size:24px;font-variant-numeric:tabular-nums}
.rest button{position:relative;background:var(--card2);border:0;color:var(--text);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheethead h3{margin:0;font-size:20px}
.plist{margin-top:8px}
.pitem{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:12px 2px;font-family:inherit;font-size:16px;cursor:pointer}
.pitem.dim{opacity:.45}
.pr{padding:8px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:#2a2d36;color:var(--text);padding:10px 16px;border-radius:12px;z-index:99;transition:transform .25s;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw}
.toast.show{transform:translate(-50%,0)}.tact{margin-left:12px;background:none;border:0;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:0}
.btn.danger{background:var(--bad);color:#fff;border:0}
.hidden{display:none!important}
.seg{display:flex;gap:6px}.seg label{flex:1}.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:14px;font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.nutres{background:var(--card2);margin:4px 0 8px}.nutmac{display:flex;justify-content:space-between;font-size:14px}
.nutsum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.bcreader{width:100%;min-height:220px;border-radius:14px;overflow:hidden;background:#000}
.bcreader video{width:100%!important;display:block}
.ebrow{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.ebrow>span{flex:1;display:flex;flex-direction:column;gap:2px}
.tog{flex:none;width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0}.tog i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.tog.on{background:var(--acc)}.tog.on i{left:23px}
.w8chip{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:11px 14px;margin:0 0 12px;font-family:inherit;font-size:15px;cursor:pointer}
.htimgs{display:flex;gap:8px;margin:0 0 12px}.htimgs figure{flex:1;margin:0;min-width:0}
.htimgs img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:var(--card2);display:block}
.htimgs figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.htmeta{display:grid;gap:8px;font-size:14px}.htmeta .lbl{margin-bottom:2px}
.htsteps{margin:0;padding-left:22px}.htsteps li{margin:0 0 8px;line-height:1.45}
.httip{background:rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.35);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:6px}
.httip b{color:var(--acc);margin-right:4px}
.streak .stkrow{display:flex;gap:12px;align-items:center}
.flame{font-size:40px;line-height:1;filter:drop-shadow(0 0 10px rgba(255,107,53,.55))}.flame.off{filter:grayscale(1);opacity:.35}
.wdots{display:flex;justify-content:space-between;gap:4px}
.wdot{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wdot i{width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px}
.wdot.on i{background:var(--acc);border-color:var(--acc);color:#fff}.wdot.today span{color:var(--text);font-weight:700}.wdot.today i{border-color:var(--text)}
.stkdone{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:14px;padding:12px 14px;margin-bottom:6px}.stkdone .flame{font-size:30px}
.stkdone.mile{background:linear-gradient(135deg,rgba(255,107,53,.25),rgba(255,212,0,.15));border:1px solid rgba(255,107,53,.5)}
.langpick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 4px 6px}
.langpick .globe{font-size:56px;line-height:1;margin-bottom:10px}.langpick .btn{font-size:19px;padding:18px}
.bwnote{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card2);color:var(--muted);line-height:1.35}
.injchip{display:block;width:100%;text-align:left;background:var(--card2);border:1px dashed var(--line);color:var(--muted);border-radius:12px;padding:10px 12px;margin-top:10px;font-family:inherit;font-size:14px;cursor:pointer}
.injchip.on{border:1px solid rgba(245,192,74,.5);background:rgba(245,192,74,.1);color:var(--text)}
.injrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.achip{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:8px 12px;margin:0 6px 8px 0;font-family:inherit;font-size:14px;cursor:pointer}
.achip.on{background:var(--warn);border-color:var(--warn);color:#1a1405;font-weight:700}
.injwarn{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(245,192,74,.12);color:var(--warn);line-height:1.35}
.pitem .warn{display:block}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 12px}
.daynav b{font-size:17px}
.calrow{display:flex;justify-content:space-between;align-items:flex-end}
.mac{margin-top:10px}.machead{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.fe{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.fe:first-of-type{border-top:0}
.fem{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.fem b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fek{font-weight:700;white-space:nowrap}
.qa{background:var(--card2);color:var(--text);font-family:inherit;cursor:pointer}
.svrow{display:flex;gap:8px;align-items:center}.svrow input{text-align:center}
.scanthumb{display:block;max-width:100%;max-height:180px;margin:0 auto 12px;border-radius:12px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px}
.helpbtn{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.throw{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:2px 0}.throw span{display:flex;align-items:center;gap:6px}.throw svg{flex:none}
.stgroup{border-top:1px solid var(--line);padding:10px 0}.stgroup summary{font-weight:700;cursor:pointer}.strow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.strow:last-child{border:0}.strow b{text-align:right;font-weight:600;flex:none;max-width:55%}
.calcbox{background:var(--card2);border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
.plan{background:rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.3);border-radius:10px;padding:8px 10px;margin:8px 0}
.usrow{display:flex;align-items:flex-end;gap:12px;margin:10px 0}.usrow>div{flex:1}.usrow b{display:block;font-size:14px;margin-bottom:6px}.uspts{width:74px;text-align:right;font-size:22px;font-weight:800}
.ustot{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:12px}.ustot b{font-size:28px;margin-left:auto}
.vestrow{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.vestrow label{flex:1;font-weight:600;font-size:14px}.vestrow input{width:96px!important;text-align:center}
.okmsg,.warnmsg{border-radius:10px;padding:8px 10px;margin:0 0 10px}.okmsg{background:rgba(52,211,153,.12);color:var(--good)}.warnmsg{background:rgba(245,192,74,.12);color:#f5c04a}
#dexaform input.filled{border-color:var(--acc)}
.whtrchip{display:inline-block;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:700}.whtrchip.ok{background:rgba(52,211,153,.15);color:var(--good)}.whtrchip.bad{background:rgba(255,84,104,.15);color:var(--bad)}
.tplrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.tplrow:first-of-type{border-top:0}.tplinfo{flex:1;min-width:0;display:flex;flex-direction:column}.tplinfo .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tplpick{margin-bottom:10px}.tplgrp{background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px}.tplgrp summary{display:flex;align-items:center;gap:8px;cursor:pointer}.tplgrp>div{margin-top:8px}
.glasses{display:flex;gap:4px;align-items:flex-end}.glasses span{width:12px;height:22px;border-radius:3px 3px 5px 5px;border:2px solid #4da6ff55}.glasses span.full{background:#4da6ff;border-color:#4da6ff}
.sstog{background:var(--card2);border:1px solid var(--line);color:var(--muted);height:36px;padding:0 9px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.sstog.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card.ss1,.card.ss2{border-left:3px solid var(--acc)}
.card.ss1{margin-bottom:4px;border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.card.ss2{border-top-left-radius:6px;border-top-right-radius:6px}
.sstag{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--acc);margin:-4px 0 8px}
.ssnote{background:#ff6b3514;border:1px solid #ff6b3540;border-radius:10px;padding:8px 10px;margin:8px 0}
.tplprev{margin:0 0 12px;padding-left:18px;line-height:1.7}.linkbtn{background:none;border:0;color:var(--acc);font-weight:600;padding:4px 0;cursor:pointer}
.tipbox{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:12px}.tiprow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;margin-top:6px}
.cdrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px}.nag{border:1px solid var(--warn)}
.tclock{font-size:60px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.tbig{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:180px;border-radius:20px;border:0;background:var(--acc);color:#fff;font-size:68px;font-weight:800;margin:4px 0 12px;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none}.tbig small{font-size:13px;font-weight:600;opacity:.85}
.gcard{position:relative;overflow:hidden;cursor:pointer}.gcardin{position:relative}
.gcard:not(.bn-none)::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,14,.82),rgba(10,11,14,.45))}

.bn-command{background:linear-gradient(110deg,transparent 35%,rgba(255,248,220,.55) 48%,transparent 62%) 0 0/300% 100%,repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),linear-gradient(135deg,#7a4d08,#c9921c 22%,#ffe08a 45%,#d4a02a 62%,#8a5a0b 85%,#6b4306);animation:goldsheen 6s linear infinite}
@keyframes goldsheen{from{background-position:150% 0,0 0,0 0}to{background-position:-150% 0,0 0,0 0}}
.gcard.bn-command::before{background:linear-gradient(90deg,rgba(26,17,2,.62),rgba(26,17,2,.12))}.gcard.bn-command{text-shadow:0 1px 3px rgba(0,0,0,.75)}
.gbar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0}.gbar i{display:block;height:100%;background:var(--acc)}
.qrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.qrow.done{opacity:.6}.qrow.done>span:nth-child(2){text-decoration:line-through}
.qck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex:none}.qrow.done .qck{background:var(--good);border-color:var(--good)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.litem{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px;color:var(--text);cursor:pointer;font:inherit}.litem.on{border-color:var(--acc)}.litem.lock{opacity:.45;cursor:default}
.lsw{width:100%;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}.lfx{background:var(--card);height:58px}canvas.lfx{display:block;background:#0f1115}.lban{width:100%;height:34px;border-radius:8px;display:block;background-color:var(--card)}
.abg-none{}
#appbg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}.lban{position:relative;overflow:hidden}html.hasbg body{background:transparent}html.hasbg .card:not([class*=bn-]){background:rgba(23,25,31,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

let ES=null,ES_PH=null;
function esDict(){if(ES)return ES;ES=Object.assign({},ES_PHR,ES_BASE);
  for(const id in HOWTO){const en=HOWTO[id],es=HOWTO_ES[id];if(!es)continue;en[0].forEach((s,i)=>{if(es[0][i])ES[s]=es[0][i];});ES[en[1]]=es[1];}
  return ES;}
function trPhrases(k){
  if(!ES_PH){const keys=Object.keys(ES_PHR).sort((a,b)=>b.length-a.length);
    ES_PH=keys.length?new RegExp('(^|[^A-Za-z])('+keys.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?=$|[^A-Za-z])','g'):null;}
  return ES_PH?k.replace(ES_PH,(m,a,b)=>a+ES_PHR[b]):k;
}
function trCore(k){
  const D=esDict();if(D[k]!=null)return D[k];
  for(const [re,f] of ES_RX){if(re.test(k))return k.replace(re,f);}
  return trPhrases(k);
}
function tr(s){
  if(LANG()!=='es'||s==null)return s;s=String(s);const k=s.trim();
  if(!k||!/[A-Za-z]/.test(k))return s;
  const out=trCore(k);return out===k?s:s.replace(k,out);
}
const ask=m=>window.confirm(tr(m));
const TR_ATTR=['placeholder','aria-label','alt','title'];
const TRD=new WeakMap();// remembers what we already translated, so nothing is translated twice
function trNode(n){
  if(n.nodeType===3){if(TRD.get(n)===n.nodeValue)return;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;TRD.set(n,n.nodeValue);return;}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE'||(n.dataset&&n.dataset.notr))return;
  let done=TRD.get(n);if(!done){done={};TRD.set(n,done);}
  for(const a of TR_ATTR){const v=n.getAttribute&&n.getAttribute(a);if(v&&done[a]!==v){const t=tr(v);if(t!==v)n.setAttribute(a,t);done[a]=t;}}
  if(n.tagName==='INPUT'||n.tagName==='TEXTAREA')return;
  for(let c=n.firstChild;c;c=c.nextSibling)trNode(c);
}
let trObs=null;
function startTranslator(){
  if(trObs||typeof MutationObserver==='undefined')return;
  trObs=new MutationObserver(ms=>{if(LANG()!=='es')return;for(const m of ms){
    if(m.type==='characterData')trNode(m.target);else if(m.type==='childList')m.addedNodes.forEach(trNode);else if(m.type==='attributes')trNode(m.target);}});
  trObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:TR_ATTR});
}

decline_pushup:[["Put your feet on a bench and your hands on the floor, slightly wider than your shoulders.", "Keep your body in a straight line from head to heels.", "Lower your chest toward the floor.", "Push back up to straight arms."],"The higher your feet, the more it works your shoulders and upper chest."],
archer_pushup:[["Set your hands very wide, fingers pointing slightly out.", "Lower toward one hand, bending that elbow while the other arm stays straight.", "Push back to the middle.", "Alternate sides. Each side counts as a rep."],"A step toward one-arm push-ups. Keep your hips level."],
hspu:[["Kick up into a handstand with your heels against a wall, hands shoulder-width.", "Brace your abs and squeeze your glutes.", "Lower your head slowly toward the floor, elbows slightly forward.", "Press back up to straight arms."],"Master pike push-ups first, and put a folded towel under your head."],
pseudo_planche:[["Start in a push-up position with your hands by your waist, fingers turned out.", "Lean forward so your shoulders are well in front of your hands.", "Lower your chest while keeping that forward lean.", "Push back up without losing the lean."],"The further you lean, the harder it gets. Builds strength for the planche."],
muscle_up:[["Hang from the bar with a false (wrist-over) grip.", "Pull explosively, driving the bar toward your lower chest.", "Lean forward and turn your wrists over the bar.", "Press up to straight arms above the bar, then lower with control."],"An advanced skill. Build up to 10+ strict pull-ups and 15+ dips first."],
inverted_row:[["Set a bar at about waist height and hang under it with straight arms, heels on the floor.", "Keep your body straight from head to heels.", "Pull your chest to the bar, squeezing your shoulder blades.", "Lower with control."],"Bend your knees to make it easier, or raise your feet to make it harder."],
wide_pullup:[["Hang with an overhand grip about 1.5× shoulder-width.", "Pull your shoulders down and back.", "Pull up until your chin clears the bar.", "Lower all the way down slowly."],"Harder than regular pull-ups and great for back width. Don't go so wide your shoulders hurt."],
archer_pullup:[["Hang from the bar with a very wide grip.", "Pull up toward one hand, keeping the other arm almost straight.", "Lower with control.", "Alternate sides. Each side counts as a rep."],"A step toward one-arm pull-ups. Start once you can do 12+ strict pull-ups."],
scap_pullup:[["Hang from the bar with straight arms.", "Without bending your elbows, pull your shoulder blades down and together.", "Your body rises a few centimetres.", "Relax back to a full hang."],"Great first step toward your first pull-up, and a good warm-up."],
pistol_squat:[["Stand on one leg with the other leg straight out in front.", "Reach your arms forward for balance.", "Squat all the way down on the standing leg, keeping the heel down.", "Stand back up. Finish one leg, then switch."],"Hold a doorframe or squat to a bench while you learn."],
jump_squat:[["Stand with feet shoulder-width.", "Squat down to about parallel.", "Jump as high as you can.", "Land softly with bent knees and go straight into the next rep."],"Land quietly. Soft landings protect your knees."],
nordic_curl:[["Kneel on a pad with your ankles anchored under something sturdy.", "Keep your body straight from knees to head.", "Lower yourself forward as slowly as you can.", "Catch yourself with your hands, then push back up and pull with your hamstrings."],"Very hard. Start with just the slow lowering part. One of the best moves for preventing hamstring injuries."],
sl_glute_bridge:[["Lie on your back with one knee bent and the other leg straight in the air.", "Press through the heel of the bent leg.", "Lift your hips until your body is straight from shoulder to knee.", "Lower, finish all reps, then switch legs."],"Keep your hips level. Don't let one side drop."],
cossack_squat:[["Stand with your feet very wide, toes slightly out.", "Shift your weight to one side and squat down on that leg.", "Keep the other leg straight, toes pointing up.", "Push back to the middle and switch sides. Each side counts as a rep."],"Go only as low as you can with your heel on the floor. Mobility improves fast."],
wall_sit:[["Stand with your back against a wall.", "Slide down until your thighs are parallel to the floor, knees at 90°.", "Keep your back flat on the wall and arms off your legs.", "Hold for time."],"Knees stay over your ankles, not past your toes."],
l_sit:[["Sit on the floor (or on parallel bars or blocks) with your legs straight.", "Put your hands beside your hips and press down hard.", "Lift your hips and legs off the floor, legs straight out in front.", "Hold for time."],"Too hard? Bend your knees (tuck sit) and straighten them as you get stronger."],
windshield_wipers:[["Hang from a bar and raise your legs until they point at the ceiling.", "Keep your legs together and straight.", "Rotate them down to one side, then sweep them across to the other side.", "Each side counts as a rep."],"Very advanced. Learn it lying on the floor first."],
dragon_flag:[["Lie on a bench and grab it behind your head.", "Lift your body so only your upper back touches the bench, body straight.", "Lower your straight body slowly toward the bench.", "Stop just above it and lift back up."],"Start with the slow lowering only, or bend your knees to make it easier."],
front_lever:[["Hang from the bar with straight arms.", "Pull your knees into your chest.", "Pull with straight arms until your back is flat and parallel to the floor.", "Hold for time."],"Push the bar toward your hips with straight arms. As you get stronger, straighten your legs."],
handstand_hold:[["Place your hands about a palm-width from a wall.", "Kick up so your heels rest on the wall.", "Push the floor away, arms straight, body tight.", "Hold for time."],"Learn to come down safely first: step one foot down, or cartwheel out."],
run_400:[["Warm up with 5 minutes of easy jogging.","Run 400 m (one lap of a track, or about a quarter mile) faster than your goal 3-mile pace.","Walk or jog slowly for about 90 seconds.","Repeat for every set. Log each rep's time."],"Keep every rep about the same time. If the last ones are much slower, start a little easier next time."],
run_800:[["Warm up with 5 minutes of easy jogging.","Run 800 m (two laps, about half a mile) at a hard but steady pace.","Walk or jog slowly for 2 minutes.","Repeat for every set. Log each rep's time."],"These build the speed you can hold for 3 miles. Aim to run every 800 within a few seconds of each other."],
run_tempo:[["Warm up with 5 minutes of easy jogging.","Run 2 miles at a comfortably hard pace: you can say a few words, but not chat.","Cool down with a few minutes of walking.","Log your total time."],"Tempo runs raise the pace you can hold without blowing up. Don't sprint the start."],
run_3mi:[["Warm up with 5–10 minutes of easy jogging and a few short strides.","Run 3 miles as fast as you can hold for the whole distance.","Cool down by walking.","Log your total time."],"Start a little slower than you think and finish fast. Practice tests show you where you stand."],
run_880:[["Warm up with easy jogging and a few short sprints.","Run 880 yards (half a mile, two laps of a track) as fast as you can, like Movement to Contact.","Walk for 3 minutes.","Repeat for every set. Log each rep's time."],"Run it in your boots and utilities sometimes, like the real test."],
run_1_5mi:[["Warm up with 5–10 minutes of easy jogging and a few short strides.","Run 1.5 miles (6 laps of a 400 m track) as fast as you can hold.","Cool down by walking.","Log your time."],"Run the first lap a little slower than goal pace, then hold it. Most people start too fast."],
row_2k:[["Set the rower to 2,000 meters. Strap your feet in with the strap across the widest part of your foot.","Each stroke: push with your legs, lean back slightly, then pull the handle to your lower ribs.","Return in reverse: arms, then body, then knees. Keep a steady 26–32 strokes per minute.","Log your time when the monitor hits 0 m."],"Legs do most of the work. Don't yank with your arms early."],
swim_500yd:[["Warm up with an easy 100 yards.","Swim 500 yards (20 lengths of a 25-yard pool) with any stroke.","You may push off the wall and rest at the wall, but the clock keeps running.","Log your time."],"Settle into a pace you can hold. Breathe every 2–3 strokes."],
swim_450m:[["Warm up with an easy 100 meters.","Swim 450 meters (18 lengths of a 25 m pool, or 9 of a 50 m pool) with any stroke.","You may rest at the wall, but the clock keeps running.","Log your time."],"Settle into a pace you can hold. Breathe every 2–3 strokes."],
cat_cow:[["Start on hands and knees, hands under shoulders and knees under hips.","Breathe in as you drop your belly and lift your chest and tailbone (cow).","Breathe out as you round your back up and tuck your chin (cat).","Move slowly with your breath for the whole time."],"Keep it gentle and pain-free. This is about moving, not pushing range."],
world_greatest:[["Step into a long lunge with your right foot forward, back knee off the ground.","Put your left hand on the floor and drop your right elbow toward your right foot.","Rotate and reach your right arm up to the ceiling, following it with your eyes.","Hold a breath or two, switch sides, and keep alternating."],"Squeeze the back glute to open the front of that hip."],
hip_flexor_stretch:[["Kneel on one knee with the other foot in front, both knees at about 90°. Pad the knee if needed.","Tuck your hips under and squeeze the glute of the kneeling leg.","Shift your hips forward slightly until you feel a stretch at the front of that hip.","Hold, then switch sides."],"Don't arch your lower back. A small shift with a tight glute is enough."],
hamstring_stretch:[["Stand and put one heel on a low step or bench, leg straight, toes up.","Keep your back flat and hinge forward from the hips.","Stop when you feel a stretch behind the thigh.","Hold, then switch legs."],"Reach your chest toward your toes, not your nose to your knee."],
pigeon_stretch:[["From a push-up position, bring one knee forward behind that wrist, shin angled across your body.","Stretch the other leg straight back.","Square your hips and lower your chest toward the floor as far as is comfortable.","Hold, then switch sides."],"Too intense? Sit back on a pillow under the front hip, or do it lying on your back (figure-4)."],
calf_stretch:[["Stand facing a wall with your hands on it.","Step one foot back, heel down, back leg straight.","Lean into the wall until you feel a stretch in the calf.","Hold, bend the back knee a little for the lower calf, then switch."],"Keep the back heel on the ground and toes pointing forward."],
thoracic_rotation:[["Lie on your side with knees bent to 90° and arms straight out in front, palms together.","Keep your knees together and on the floor.","Open the top arm up and over to the other side, rotating your upper back, eyes following your hand.","Pause, return, and repeat; then switch sides."],"Let the breath help you rotate a little further each time."],
chest_doorway:[["Stand in a doorway and put your forearm on the frame, elbow at shoulder height.","Step forward with the same-side foot.","Turn your body slightly away until you feel a stretch across the chest.","Hold, then switch sides."],"Keep your shoulder down and back, not shrugged."],
childs_pose:[["Kneel and sit back on your heels, knees about hip-width or wider.","Walk your hands forward and lower your chest toward the floor.","Rest your forehead down and breathe slowly into your back.","Hold for the full time."],"Wider knees give the hips and lower back more room."],
cl_rev_crunch:[["Lie on your back with your hands behind your head or across your chest. Cross one ankle over the other, knees bent.","Curl your hips and knees toward your chest while lifting your shoulders, so your knees meet your elbows or thighs touch your forearms.","Lower back down until your shoulder blades touch the ground.","Repeat for 2 minutes. Log your reps."],"Keep a steady rhythm. Your shoulder blades must touch down on every rep for it to count."],
hamr:[["Mark two lines 20 m apart and play a HAMR beep track (free on most music apps).","Run to the other line before each beep, then turn and run back.","The beeps speed up every level. Keep going until you miss the line before the beep 3 times in a row.","Log the number of shuttles you finished."],"Turn hard on the line with a short, quick step. Don't start too fast; the early levels are a warm-up."],
hrp:[["Lie face down with your hands flat beside your chest.","Push up to straight arms, keeping one straight line from head to heels.","Lower until your chest touches the ground. Lift both hands off the ground and reach your arms straight out to the sides, then put your hands back under your shoulders.","Repeat for 2 minutes. Log your reps."],"Keep your body stiff. Sagging hips or a bent body don't count on test day."],
sdc:[["Mark two lines 25 m apart. The event is 5 trips of 50 m (down and back).","Sprint 50 m, then drag a 90 lb sled 50 m walking backward.","Shuffle sideways 50 m, then carry two 40 lb kettlebells 50 m.","Sprint the last 50 m. Log your total time."],"Touch the line with your hand and foot on every turn. No sled? Drag a heavy bag. No kettlebells? Use heavy dumbbells."],
run_2mi:[["Warm up with 5–10 minutes of easy jogging and a few short strides.","Run 2 miles as fast as you can hold for the whole distance (8 laps of a 400 m track plus 19 m).","Cool down by walking.","Log your time."],"Even pacing wins. Run the first mile no faster than your goal pace."],
shuttle_sprint:[["Mark two lines 25 yards apart.","Sprint to the far line and back 6 times (300 yards total). Touch the line with your foot or hand each turn.","Rest about 3 minutes.","Repeat for every set. Log each set's time."],"Stay low on the turns. Fast changes of direction win the Maneuver Under Fire course."],
swim_free:[["Push off the wall and swim freestyle (front crawl) at a steady pace.","Reach long with each arm, roll your body side to side and breathe to the side.","Kick steadily from your hips with loose ankles.","Log the distance and your total time; the app works out your pace per 100."],"Breathe out under water so you're ready to breathe in when you turn your head."],
swim_breast:[["Push off the wall and glide with arms straight in front.","Pull your hands out and back to your chest, then shoot them forward again.","Kick like a frog: heels toward your seat, feet out, then squeeze together.","Pull, breathe, kick, glide. Log the distance and your total time."],"The glide is where you rest and gain speed. Don't rush it. This is the stroke used in Marine water survival."],
swim_intervals:[["Swim each rep freestyle at the pace the plan gives.","Rest at the wall for the time listed.","Start the next rep on time.","Log the time for each rep."],"Try to keep every rep within a few seconds of the first one."],
kickboard:[["Hold a kickboard out in front with straight arms.","Kick from your hips with straight-ish legs and pointed, loose ankles.","Keep the kicks small and fast; your feet should just break the surface.","Log the time for each rep."],"Kicking hard from the knees tires you out fast. Drive from your hips."],
pull_buoy:[["Put a pull buoy between your thighs so your legs float without kicking.","Swim freestyle using only your arms.","Focus on a long reach and a strong pull back to your hip.","Log the time for each rep."],"Great for building arm and back endurance, and easy on injured legs."],
tread:[["In deep water, stay upright with your head above water.","Sweep your hands back and forth in front of you.","Kick with a slow eggbeater or flutter kick.","Stay calm and steady for the full time. Log your minutes."],"Relaxed breathing makes this much easier. Panic burns energy fast."],
aqua_jog:[["In deep water (a flotation belt helps), stay upright.","Run in place: drive your knees up and swing your arms like on land.","Keep a steady effort; you'll barely move forward.","Keep it going for the full time. Log your minutes."],"Athletes use this to keep their fitness while injured: all the running motion, none of the impact."],
walk:[["Walk outside or on a track at a fast pace, swinging your arms.","Aim for a pace where you're breathing harder but can still talk.","Keep it going for the full time.","Log your minutes."],"Walking is easy on the joints and one of the best ways to burn extra calories every day."],
incline_walk:[["Set a treadmill to a walking speed (about 3 mph / 5 km/h) and a 8–12% incline.","Walk tall without holding the rails.","Keep a steady pace for the full time.","Log your minutes."],"Holding the rails cuts the calories you burn. Lower the incline before you grab them."],
jog:[["Jog at an easy, conversational pace, outside or on a treadmill.","Land softly under your hips with short, quick steps.","Keep it going for the full time; walk breaks are fine.","Log your minutes."],"Easy means you could hold a conversation. Most of your running should feel like this."],
bike:[["Set the seat so your knee is slightly bent at the bottom of the pedal stroke.","Pedal at a steady pace with enough resistance to feel it.","Keep it going for the full time.","Log your minutes."],"Low impact and easy on the joints, so it's great on lifting days."],
bike_intervals:[["Warm up for 2–3 minutes of easy pedaling.","Pedal hard for 30 seconds (high resistance or fast).","Pedal easy for 90 seconds.","Repeat until the time is up. Log your minutes."],"Intervals burn a lot in a short time. Hard should feel hard, easy should let you recover."],
rower:[["Strap your feet in and grab the handle with straight arms.","Push with your legs first, then lean back slightly, then pull the handle to your lower ribs.","Reverse it: arms out, lean forward, then bend your knees.","Keep a steady rhythm for the full time. Log your minutes."],"It's legs, then back, then arms. Most of the power comes from your legs, not your arms."],
elliptical:[["Step on and hold the handles lightly.","Push and pull with your arms while your legs move smoothly.","Add resistance until it feels like work.","Keep it going for the full time. Log your minutes."],"No impact at all, which makes it a good choice if running bothers your joints."],
stair_climber:[["Step on and start at a slow, steady speed.","Stand tall and take full steps without leaning on the rails.","Raise the speed until it's challenging.","Keep it going for the full time. Log your minutes."],"Leaning on the rails makes it much easier. Hold them lightly for balance only."],
jump_rope:[["Hold the handles at hip height with the rope behind you.","Turn the rope with your wrists, not your arms.","Jump just high enough to clear it, landing softly on the balls of your feet.","Mix in short rests if you need them. Log your total minutes."],"High calorie burn, but high impact on the calves and ankles. Build up slowly."],
arm_bike:[["Sit facing the arm bike with the handles at shoulder height.","Pedal with your arms in a smooth circle.","Add resistance until it feels like work.","Keep it going for the full time. Log your minutes."],"Great cardio when a leg, knee or ankle injury keeps you off the other machines."],
flak_run:[["Put on your flak or plate carrier with front and back plates. Tighten it so it doesn't bounce.","Warm up with a few minutes of walking and easy jogging in it.","Run your planned distance at a steady pace you can hold.","Log the distance and your total time; the app works out your pace."],"Build up slowly: start with shorter distances than your normal runs. Stop if your back, shoulders or knees hurt."],
flak_run_side:[["Put on your flak or plate carrier with front, back and side plates. Tighten it so nothing shifts.","Warm up with a few minutes of walking and easy jogging in it.","Run your planned distance at a steady pace you can hold.","Log the distance and your total time; the app works out your pace."],"The side plates add weight and limit breathing room. Go shorter and slower than your front-and-back runs at first."],
bear_crawl:[["Get on your hands and feet, knees just off the ground, back flat.","Crawl forward 25 yards, moving opposite hand and foot together.","Stand up, rest about 45 seconds.","Repeat for every set. Log each set's time."],"Keep your hips low and your back flat. Builds the crawling strength the CFT course needs."],
ammo_press:[["Hold a 30 lb dumbbell, kettlebell or loaded ammo can at your shoulders with both hands.","Press it straight overhead until your arms lock out.","Lower it back to your chin.","Repeat as many times as you can in the time given. Log your reps."],"Breathe out on every press and find a steady rhythm. Only reps with full lockout count on the test."],
farmer_carry:[["Pick up a heavy dumbbell in each hand, standing tall.","Walk 50 yards with short, quick steps, keeping your shoulders back.","Set them down under control.","Rest, then repeat. Log the weight per hand and reps as trips."],"Don't let the weights swing or your shoulders round. Builds grip for carries and buddy drags."],
neg_pullup:[["Jump or step up so your chin is over the bar.","Lower yourself as slowly as you can, about 5 seconds, until your arms are straight.","Drop off, reset, and repeat.","Log reps per set."],"The slow lowering builds strength for your first pull-ups, or more of them."],
burpee:[["Stand tall, then squat down and put your hands on the floor.", "Jump your feet back into a push-up position and do a push-up.", "Jump your feet back to your hands.", "Jump up with arms overhead."],"Keep a steady pace you can hold. Skip the push-up to make it easier."],

bench:[["Lie on the bench with eyes under the bar, feet flat on the floor.","Grip the bar a little wider than shoulder-width, squeeze your shoulder blades together and unrack.","Lower the bar under control to your mid-chest, elbows about 45° from your body.","Press back up until your arms are straight."],"Keep your butt on the bench and wrists stacked over elbows. Use a spotter or safety bars when going heavy."],
incline_bb:[["Set the bench to about 30–45°. Lie back with eyes under the bar.","Grip slightly wider than shoulders, pull shoulder blades back and unrack.","Lower the bar to your upper chest, just below the collarbones.","Press up and slightly back until arms are straight."],"A lower incline (around 30°) keeps the work on your upper chest instead of your shoulders."],
db_bench:[["Sit on a flat bench with dumbbells on your thighs, then lie back and bring them up beside your chest.","Press the dumbbells up until your arms are straight over your chest.","Lower slowly until your elbows are slightly below the bench.","Press back up, bringing the dumbbells close together at the top."],"Keep elbows at about 45° from your body, not flared straight out."],
incline_db:[["Set the bench to 30–45° and sit back with dumbbells at shoulder height.","Press the dumbbells up over your upper chest.","Lower slowly until you feel a stretch across your chest.","Press back up without clanging the weights together."],"Keep your shoulder blades pinned back against the bench the whole time."],
db_fly:[["Lie on a flat bench holding dumbbells above your chest, palms facing each other.","Keep a slight bend in your elbows.","Open your arms wide in an arc until you feel a stretch in your chest.","Squeeze your chest to bring the dumbbells back up along the same arc."],"Think 'hugging a tree'. Go light, as the stretch at the bottom is where injuries happen."],
cable_fly:[["Set both pulleys at shoulder height or higher and grab a handle in each hand.","Step forward into a split stance, arms out wide with a slight elbow bend.","Bring your hands together in front of your chest in a wide arc.","Return slowly until you feel a stretch, then repeat."],"Keep the elbow bend fixed. If your elbows bend and straighten, it turns into a press."],
pec_deck:[["Adjust the seat so the handles are at chest height.","Sit tall with your back against the pad and grab the handles or pads.","Bring your arms together in front of you, squeezing your chest.","Open back slowly until you feel a light stretch."],"Keep your shoulders down and back. Don't let them roll forward at the end."],
chest_press:[["Adjust the seat so the handles line up with your mid-chest.","Sit with your back flat against the pad and grip the handles.","Press forward until your arms are straight but not locked.","Return slowly until you feel a stretch in your chest."],"A great choice for learning to press safely, with no spotter needed."],
pushup:[["Place your hands slightly wider than your shoulders, body in a straight line from head to heels.","Brace your abs and squeeze your glutes.","Lower your chest to just above the floor, elbows about 45° from your body.","Push back up to straight arms."],"Too hard? Put your hands on a bench. Too easy? Raise your feet or wear a backpack."],
dip:[["Grip the parallel bars and support yourself with straight arms.","Lean your chest slightly forward.","Lower yourself until your upper arms are about parallel to the floor.","Push back up to straight arms."],"Leaning forward works more chest; staying upright works more triceps. Don't drop below where your shoulders feel comfortable."],
ohp:[["Set the bar at upper-chest height. Grip just outside your shoulders and unrack with the bar on your front shoulders.","Stand with feet hip-width, squeeze your glutes and brace your abs.","Press the bar straight up, moving your head back slightly to let it pass.","Lock out overhead with the bar over your mid-foot, then lower to your shoulders."],"Don't lean back. Tight glutes and abs keep your lower back safe."],
db_ohp:[["Sit on a bench set upright and hold the dumbbells at shoulder height, palms forward.","Keep your back against the pad and feet planted.","Press the dumbbells up until your arms are nearly straight.","Lower back to shoulder height under control."],"Stop just short of locking your elbows to keep tension on your shoulders."],
arnold:[["Sit upright holding dumbbells in front of your shoulders, palms facing you.","As you press up, rotate your palms to face forward.","Finish with arms overhead, palms forward.","Reverse the rotation as you lower back to the start."],"Move slowly. The rotation is the point, so don't rush it."],
shoulder_press_m:[["Adjust the seat so the handles are at shoulder height.","Sit with your back against the pad and grip the handles.","Press up until your arms are nearly straight.","Lower slowly back to shoulder height."],"Keep your lower back against the pad; don't arch to push more weight."],
lat_raise:[["Stand holding light dumbbells at your sides.","With a slight bend in your elbows, raise your arms out to the sides.","Stop at shoulder height, pinkies slightly up.","Lower slowly."],"Use light weight and no swinging. Lead with your elbows, not your hands."],
cable_lat_raise:[["Set the pulley at the lowest point. Stand side-on and grab the handle with your far hand.","With a slight elbow bend, raise your arm out to the side.","Stop at shoulder height.","Lower slowly against the cable's pull."],"The cable keeps tension at the bottom, where dumbbells don't. Keep it slow."],
rear_fly:[["Hold light dumbbells and hinge forward at the hips until your chest is nearly parallel to the floor.","Let the dumbbells hang under your chest, elbows slightly bent.","Raise your arms out to the sides, squeezing your upper back.","Lower slowly."],"Keep your neck neutral and don't shrug. Light weight, strict form."],
face_pull:[["Set a rope on a cable at upper-chest height or higher.","Grab the rope with thumbs pointing back and step back until your arms are straight.","Pull the rope toward your face, spreading your hands apart and elbows high.","Squeeze your rear shoulders, then return slowly."],"Finish like a double-biceps pose. Great for shoulder health and posture."],
pike_pushup:[["Start in a push-up position, then walk your feet in and lift your hips into an upside-down V.","Bend your elbows to lower the top of your head toward the floor between your hands.","Push back up to straight arms.","Keep your hips high throughout."],"Raising your feet on a bench makes it harder and closer to an overhead press."],
band_pull_apart:[["Hold a band in front of you at shoulder height with straight arms, hands shoulder-width.","Pull the band apart by moving your arms out to the sides.","Squeeze your shoulder blades together when the band touches your chest.","Return slowly."],"Keep your shoulders down away from your ears. Great as a warm-up."],
deadlift:[["Stand with feet hip-width, the bar over your mid-foot.","Hinge down and grip the bar just outside your legs. Bend your knees until your shins touch the bar.","Brace your abs, flatten your back and pull the slack out of the bar.","Push the floor away, keeping the bar against your legs, and stand tall. Lower by pushing your hips back."],"Your back must stay flat, never rounded. If it rounds, the weight is too heavy."],
bb_row:[["Hold the bar with an overhand grip, hands slightly wider than your legs.","Hinge forward until your torso is about 45° or lower, knees soft, back flat.","Pull the bar to your lower ribs, driving your elbows back.","Lower under control."],"Don't stand up to move the weight. Keep the same torso angle every rep."],
db_row:[["Put one knee and the same-side hand on a bench, back flat.","Hold a dumbbell in your free hand, arm hanging straight down.","Pull the dumbbell toward your hip, elbow close to your body.","Lower slowly until your arm is straight."],"Think 'elbow to back pocket' to work your lats, not just your arm."],
pullup:[["Hang from the bar with an overhand grip, hands slightly wider than shoulders.","Pull your shoulders down and back to start the movement.","Pull up until your chin clears the bar.","Lower all the way down with control."],"Can't do one yet? Use a band, an assisted machine, or slow lowering-only reps."],
chinup:[["Hang from the bar with palms facing you, hands about shoulder-width.","Pull your shoulders down, then pull up.","Bring your chin over the bar.","Lower all the way down slowly."],"Usually easier than pull-ups because your biceps help more. A great first goal."],
lat_pulldown:[["Sit with your thighs under the pads and grab the bar wider than your shoulders.","Lean back slightly and pull your shoulders down.","Pull the bar to your upper chest, driving your elbows down.","Let the bar rise slowly until your arms are straight."],"Don't pull behind your neck, and don't swing your body to move the weight."],
cable_row:[["Sit with your feet on the platform, knees slightly bent, and grab the handle.","Sit tall with a flat back and arms straight.","Pull the handle to your belly, squeezing your shoulder blades together.","Return slowly until your arms are straight."],"Keep your torso still. Don't rock back and forth to move the weight."],
sa_cable_row:[["Set a single handle on a cable at about chest height (or sit at a low row and use one handle).","Hold the handle in one hand with your arm straight and your torso still.","Pull your elbow back past your ribs and squeeze your shoulder blade.","Let your arm straighten slowly, then switch sides."],"Don't twist your torso to finish the rep. Log the weight for one arm."],
dual_cable_row:[["Set both pulleys of a cable crossover at chest height with a handle on each.","Step back holding a handle in each hand, arms straight in front of you.","Pull both elbows back past your ribs and squeeze your shoulder blades together.","Return slowly until your arms are straight."],"Keep your chest up and stay still; only your arms and shoulder blades move. Log the weight on one side."],
machine_row:[["Adjust the seat so the handles are at chest height, chest against the pad.","Grab the handles with arms straight.","Pull back, driving your elbows past your sides.","Return slowly."],"Pause and squeeze for a second at the back of every rep."],
db_shrug:[["Stand holding dumbbells at your sides.","Lift your shoulders straight up toward your ears.","Hold for a second at the top.","Lower slowly."],"Go straight up and down. Don't roll your shoulders."],
band_row:[["Anchor a band at chest height, or loop it around your feet while seated.","Hold the ends with straight arms.","Pull your hands toward your belly, squeezing your shoulder blades.","Return slowly."],"Step back further for more resistance."],
back_ext:[["Set the pad so it sits just below your hip bones and hook your feet in.","Cross your arms over your chest.","Lower your upper body by hinging at the hips until you feel a hamstring stretch.","Raise back up until your body is in a straight line."],"Stop at straight. Don't over-arch your lower back at the top."],
good_morning:[["Rest a light barbell on your upper back like a squat.","Stand with feet hip-width and knees slightly bent.","Push your hips back, lowering your chest until you feel a strong hamstring stretch.","Drive your hips forward to stand back up."],"Start very light. Your back must stay flat the whole time."],
weighted_back_ext:[["Set up like a back extension, holding a weight plate against your chest.","Lower your upper body by hinging at the hips.","Raise back up until your body is straight.","Control the weight on the way down."],"Master the bodyweight version first, then add weight gradually."],
bird_dog:[["Start on hands and knees, hands under shoulders and knees under hips.","Brace your abs and keep your back flat.","Reach one arm forward and the opposite leg back until both are straight.","Hold for a second, return and switch sides."],"Imagine a glass of water on your lower back: don't spill it."],
superman:[["Lie face down with arms stretched overhead.","Squeeze your glutes and lower back.","Lift your arms, chest and legs off the floor together.","Hold, keeping your neck in line with your spine."],"Look at the floor, not forward, to protect your neck."],
bb_curl:[["Stand holding a barbell with an underhand grip at shoulder-width.","Keep your elbows pinned at your sides.","Curl the bar up toward your shoulders.","Lower slowly until your arms are straight."],"No swinging. If you have to lean back, the weight is too heavy."],
db_curl:[["Stand holding dumbbells at your sides, palms facing forward.","Keep your elbows at your sides.","Curl the weights up, squeezing your biceps.","Lower slowly all the way down."],"Lowering slowly (2–3 seconds) builds as much muscle as lifting."],
hammer_curl:[["Stand holding dumbbells at your sides, palms facing your body.","Keep your palms facing in the whole time.","Curl the weights up toward your shoulders.","Lower slowly."],"Works your forearms and the outer biceps more than regular curls."],
cable_curl:[["Attach a straight bar or rope to the low pulley.","Stand facing the machine and grab the handle with an underhand grip.","Curl the handle up toward your shoulders, elbows at your sides.","Lower slowly."],"The cable keeps tension the whole way, so keep the reps smooth."],
incline_curl:[["Set a bench to about 45° and lie back with a dumbbell in each hand.","Let your arms hang straight down, palms forward.","Curl the dumbbells up without moving your upper arms forward.","Lower slowly all the way down."],"The incline stretches the biceps; use a lighter weight than standing curls."],
db_preacher:[["Sit at a preacher bench with the back of your upper arm flat on the pad.","Hold a dumbbell with your palm facing up and your arm almost straight.","Curl the dumbbell up toward your shoulder.","Lower slowly until your arm is almost straight. Switch arms, or do both at once."],"Don't let the weight drop at the bottom; control it to protect your elbow. Log the weight per dumbbell."],
ez_preacher:[["Sit at a preacher bench with your upper arms flat on the pad.","Hold an EZ bar on the angled grips, palms up.","Curl the bar up toward your chin.","Lower slowly until your arms are almost straight."],"Keep your armpits snug against the top of the pad and don't bounce out of the bottom."],
preacher:[["Adjust the seat so your upper arms rest flat on the pad.","Grab the handles with an underhand grip.","Curl up until your forearms are vertical.","Lower slowly until your arms are almost straight."],"Don't drop fast at the bottom; that's where elbows get strained."],
band_curl:[["Stand on the middle of a band and hold the ends, palms forward.","Keep your elbows at your sides.","Curl your hands up toward your shoulders.","Lower slowly."],"Use a wider stance on the band for more resistance."],
skull:[["Lie on a bench holding a barbell or EZ-bar over your chest with arms straight.","Keep your upper arms still and slightly angled back.","Bend your elbows to lower the bar toward your forehead.","Straighten your arms to lift it back up."],"Go light and slow. Lower the bar to just behind your head if your elbows complain."],
pushdown:[["Attach a bar or rope to the high pulley and grab it with your elbows bent.","Pin your elbows to your sides.","Push down until your arms are straight.","Let the handle rise slowly until your forearms are parallel to the floor."],"Only your forearms should move. Elbows stay glued to your sides."],
sa_cable_ext:[["Attach a single handle to a high pulley and stand facing the machine.","Grab the handle with one hand and pin your elbow to your side, forearm angled up.","Push the handle down until your arm is straight and squeeze your triceps.","Let it rise slowly until your forearm passes parallel, then repeat. Switch arms."],"Only your forearm moves. Log the weight for one arm."],
dual_cable_ext:[["Set both pulleys of a cable crossover high and attach a handle to each.","Take a handle in each hand, face away from the machine and step forward into a split stance.","Start with your elbows bent, hands behind your head and upper arms by your ears.","Straighten your arms forward and up, then slowly bend your elbows back to the start."],"Keep your elbows high and still. Log the weight on one side."],
oh_ext:[["Hold one dumbbell with both hands overhead, standing or seated.","Keep your elbows pointing forward and close to your head.","Lower the dumbbell behind your head by bending your elbows.","Straighten your arms to lift it back up."],"Keep your ribs down; don't arch your back to finish the rep."],
cg_bench:[["Lie on the bench and grip the bar about shoulder-width.","Unrack and keep your elbows close to your body.","Lower the bar to your lower chest.","Press back up to straight arms."],"Hands at shoulder-width is enough. Going narrower is hard on the wrists."],
bench_dip:[["Sit on the edge of a bench with your hands beside your hips, fingers forward.","Slide your butt off the bench, legs out in front of you.","Lower by bending your elbows to about 90°.","Push back up to straight arms."],"Bend your knees to make it easier. Keep your back close to the bench."],
band_pushdown:[["Anchor a band high, like over a door or pull-up bar.","Grab it with elbows bent and pinned to your sides.","Push down until your arms are straight.","Return slowly."],"Squeeze your triceps hard at the bottom of every rep."],
wrist_curl:[["Sit and rest your forearms on your thighs or a bench, palms up, wrists over the edge.","Hold a dumbbell in each hand.","Curl your wrists up as high as you can.","Lower slowly, letting the weight roll toward your fingertips."],"Small movement, light weight, high reps (15–20) works best for forearms."],
rev_wrist_curl:[["Rest your forearms on a bench or your thighs, palms down, wrists over the edge.","Hold light dumbbells.","Lift the backs of your hands up toward you.","Lower slowly."],"Use lighter weight than regular wrist curls. These muscles are smaller."],
btb_wrist_curl:[["Stand holding a barbell behind your back, palms facing back.","Let your arms hang straight.","Curl the bar up by bending only your wrists.","Lower slowly."],"Lets you use more weight than seated wrist curls. Keep your arms still."],
rev_curl:[["Stand holding a barbell with an overhand grip (palms down), shoulder-width.","Keep your elbows at your sides.","Curl the bar up toward your shoulders.","Lower slowly."],"Use about half your normal curl weight. Builds forearms and grip."],
cable_wrist_curl:[["Set a straight bar on the low pulley and kneel or sit facing it.","Rest your forearms on a bench or your thighs, palms up.","Curl your wrists up.","Lower slowly."],"Keep your forearms still; only your wrists move."],
dead_hang:[["Grab a pull-up bar with an overhand grip, hands shoulder-width.","Lift your feet and hang with straight arms.","Keep your shoulders slightly engaged, not fully slumped.","Hang as long as you can; log the seconds."],"Great for grip strength and decompressing your back. Chalk helps."],
plate_pinch:[["Put two weight plates together, smooth sides out.","Pinch them together with your fingers on one side and thumb on the other.","Lift and hold them at your side.","Hold as long as you can, then switch hands."],"Start with two 10 lb (5 kg) plates and build up the time."],
squat:[["Set the bar on your upper back (not your neck), hands just outside your shoulders.","Stand with feet shoulder-width, toes slightly out. Brace your abs.","Sit down and back until your hips are at least level with your knees, knees tracking over toes.","Drive up through your whole foot to stand tall."],"Keep your chest up and heels down. Always use safety bars or a spotter for heavy sets."],
front_squat:[["Rest the bar on the front of your shoulders, fingertips under it and elbows high.","Stand with feet shoulder-width.","Squat down keeping your torso upright and elbows up.","Drive back up to standing."],"If your wrists hurt, cross your arms over the bar to hold it instead."],
goblet:[["Hold a dumbbell vertically against your chest with both hands.","Stand with feet slightly wider than shoulders, toes turned out.","Squat down between your knees, keeping your chest up.","Push back up to standing."],"The best squat for beginners. It teaches you to stay upright."],
kb_goblet:[["Hold a kettlebell by the handle sides at chest height.","Stand with feet slightly wider than shoulders.","Squat down, elbows inside your knees.","Push back up to standing."],"Use your elbows to gently push your knees out at the bottom."],
leg_press:[["Sit with your back flat against the pad and feet shoulder-width on the platform.","Release the safety handles.","Lower the platform until your knees are at about 90°.","Press back up without locking your knees."],"Never lock your knees at the top, and don't let your lower back lift off the pad."],
leg_ext:[["Adjust the seat so your knees line up with the machine's pivot.","Hook the pad just above your ankles.","Straighten your legs, squeezing your quads.","Lower slowly."],"Pause for a second at the top for a stronger squeeze."],
leg_curl:[["Adjust the machine so your knees line up with the pivot and the pad rests just above your heels.","Lower the thigh pad to hold your legs in place.","Curl your heels down and back as far as you can.","Return slowly."],"Point your toes up (toward your shins) to work your hamstrings harder."],
lying_leg_curl:[["Lie face down with the pad just above your heels and knees just off the bench.","Hold the handles and keep your hips pressed down.","Curl your heels toward your butt.","Lower slowly."],"Don't let your hips lift off the bench to finish the rep."],
hip_abduction:[["Sit in the machine with the pads on the outside of your knees.","Sit tall and hold the handles.","Push your knees outward as far as you can.","Return slowly without letting the weights touch."],"Leaning slightly forward targets your glutes more."],
hip_adduction:[["Sit in the machine with the pads on the inside of your knees.","Start with your legs only as wide as is comfortable.","Squeeze your knees together.","Open back up slowly."],"Don't start too wide. A big stretch under load can strain your groin."],
cable_adduction:[["Attach an ankle strap to a low pulley and put it on your inside ankle.","Stand side-on to the machine, holding it for balance.","Sweep your strapped leg across in front of your other leg.","Return slowly."],"Keep your body upright. Only your leg moves."],
copenhagen:[["Lie on your side and rest your top leg's inner knee or ankle on a bench.","Prop yourself up on your forearm.","Lift your hips so your body forms a straight line, bottom leg hanging.","Hold for time, then switch sides."],"Start with the bench under your knee; under the ankle is much harder."],
sumo_squat:[["Stand with feet wide, toes pointed out, holding a dumbbell between your legs.","Keep your chest up.","Squat straight down, pushing your knees out over your toes.","Stand back up, squeezing your inner thighs and glutes."],"Your knees must point the same way as your toes."],
cable_abduction:[["Attach an ankle strap to a low pulley and put it on your outside ankle.","Stand side-on to the machine, holding it for balance.","Lift your strapped leg out to the side.","Return slowly."],"Keep your toes pointing forward and your body upright."],
side_leg_raise:[["Lie on your side with your legs straight and stacked.","Rest your head on your arm.","Lift your top leg up to about 45°.","Lower slowly."],"Keep your toes pointing forward, not up, to target the outer hip."],
band_walk:[["Put a mini band around your legs just above your knees or ankles.","Bend into a quarter squat, feet shoulder-width.","Step sideways, keeping tension on the band.","Take 10–15 steps each way. Each step counts as a rep."],"Stay low and don't let your feet come together."],
fire_hydrant:[["Start on hands and knees.","Keep your knee bent at 90°.","Lift one knee out to the side until your thigh is about level with your hip.","Lower and repeat, then switch sides."],"Keep your hips level. Don't lean away to lift higher."],
rdl:[["Stand holding a barbell at your thighs, feet hip-width.","With soft knees, push your hips back and slide the bar down your legs.","Lower until you feel a strong hamstring stretch (usually mid-shin).","Drive your hips forward to stand back up."],"The bar stays touching your legs and your back stays flat. It's a hip hinge, not a squat."],
db_rdl:[["Stand holding dumbbells in front of your thighs.","With soft knees, push your hips back and lower the dumbbells along your legs.","Stop when you feel a strong hamstring stretch.","Drive your hips forward to stand."],"Keep the dumbbells close to your legs the whole way."],
lunge:[["Stand holding dumbbells at your sides.","Take a big step forward.","Lower until both knees are at about 90°, back knee just above the floor.","Push through your front heel to step back to the start. Alternate legs."],"Keep your front knee over your foot, not caving inward."],
bss:[["Stand a big step in front of a bench, holding dumbbells.","Rest the top of your back foot on the bench.","Lower straight down until your front thigh is about parallel to the floor.","Push through your front foot to stand. Finish one leg, then switch."],"Find your foot position with no weight first. Expect to be humbled!"],
step_up:[["Stand facing a bench or box, holding dumbbells.","Put one whole foot on the box.","Push through that foot to stand up on the box.","Step back down slowly. Finish one leg, then switch."],"Don't push off with the back foot. Make the front leg do the work."],
hip_thrust:[["Sit on the floor with your upper back against a bench and a padded barbell over your hips.","Plant your feet flat, about shoulder-width.","Drive your hips up until your body is flat from shoulders to knees.","Squeeze your glutes at the top, then lower."],"Tuck your chin and keep your ribs down. Don't arch your lower back at the top."],
kb_swing:[["Stand with feet wider than hips, kettlebell on the floor in front of you.","Hinge at the hips, grab it and hike it back between your legs.","Snap your hips forward to swing it to chest height.","Let it swing back down and repeat."],"It's a hip snap, not a squat or an arm lift. Your arms just guide the bell."],
glute_bridge:[["Lie on your back, knees bent, feet flat and hip-width.","Brace your abs.","Push through your heels to lift your hips until your body is straight from shoulders to knees.","Squeeze your glutes, then lower."],"Push through your heels. Lifting your toes slightly can help."],
bw_squat:[["Stand with feet shoulder-width, toes slightly out.","Reach your arms forward for balance.","Sit down and back as low as you comfortably can, chest up.","Stand back up."],"Heels stay on the floor. Squat to a chair to learn the depth."],
bw_lunge:[["Stand tall with hands on your hips.","Step forward and lower until both knees are at about 90°.","Push through your front foot and step the back foot forward into the next lunge.","Keep walking, alternating legs."],"Take long enough steps that your front knee stays over your ankle."],
calf_raise:[["Stand with the balls of your feet on a step, heels hanging off.","Hold something for balance.","Lower your heels as far as you can.","Rise up onto your toes as high as you can and squeeze."],"Pause at the top and bottom. Bouncing makes it far less effective."],
seated_calf:[["Sit with the pad on your lower thighs and the balls of your feet on the platform.","Release the safety.","Lower your heels for a full stretch.","Push up onto your toes as high as you can."],"Works the lower calf muscle that standing raises miss. Use full range."],
lp_calf:[["Sit in the leg press with only the balls of your feet on the bottom edge of the platform.","Press the platform up with straight (not locked) knees.","Let your toes come toward you for a stretch.","Push through the balls of your feet to extend your ankles."],"Keep the safety handles engaged and never let your feet slip off the platform."],
db_calf:[["Stand holding dumbbells at your sides, the balls of your feet on a step.","Lower your heels for a stretch.","Rise up onto your toes as high as you can.","Lower slowly."],"Keep your knees straight but not locked."],
sl_calf:[["Stand on one foot on the edge of a step, holding something for balance.","Lower your heel as far as you can.","Rise up onto your toes as high as you can.","Finish all reps, then switch legs."],"Much harder than two legs. Great when you don't have weights."],
plank:[["Rest on your forearms and toes, elbows under shoulders.","Make a straight line from head to heels.","Squeeze your glutes and brace your abs like you're about to be punched.","Hold for time."],"If your hips sag or your back aches, stop. A short good plank beats a long bad one."],
crunch:[["Lie on your back with knees bent and feet flat.","Rest your fingertips lightly behind your head.","Curl your shoulders off the floor by squeezing your abs.","Lower slowly."],"Don't pull on your neck. Imagine an apple between your chin and chest."],
dead_bug:[["Lie on your back, arms pointing at the ceiling, knees bent at 90° over your hips.","Press your lower back flat into the floor.","Slowly lower your opposite arm and leg toward the floor.","Return and switch sides."],"Your lower back must stay flat. Only go as far as you can keep it down."],
russian_twist:[["Sit with knees bent and lean back slightly, back straight.","Lift your feet off the floor (or keep heels down to make it easier).","Rotate your torso to touch your hands to the floor on one side.","Rotate to the other side. Each side counts as a rep."],"Turn your shoulders, not just your arms."],
hanging_raise:[["Hang from a pull-up bar with straight arms.","Brace your abs to stop swinging.","Raise your straight legs up to hip height or higher.","Lower slowly without swinging."],"Too hard? Bend your knees (hanging knee raise)."],
cable_crunch:[["Kneel facing a high pulley with a rope attached, holding the rope beside your head.","Keep your hips still.","Crunch down, bringing your elbows toward your thighs.","Rise back up slowly."],"Round your spine to crunch. Don't just bend at the hips."],
sit_up:[["Lie on your back, knees bent, feet anchored or flat.","Cross your arms over your chest.","Sit all the way up by curling your torso.","Lower back down slowly."],"Control the way down; don't just flop back."],
decline_situp:[["Lie on a decline bench with your feet hooked under the pads.","Cross your arms over your chest.","Curl up until your torso is upright.","Lower slowly."],"A steeper decline is harder. Start with a slight angle."],
reverse_crunch:[["Lie on your back with your legs up and knees bent at 90°.","Rest your arms by your sides.","Curl your hips off the floor, bringing your knees toward your chest.","Lower slowly."],"Use your abs to lift your hips, not momentum."],
leg_raise:[["Lie on your back with your legs straight and hands under your hips.","Press your lower back into the floor.","Raise your legs until they're vertical.","Lower slowly, stopping just before your back arches."],"If your lower back lifts, bend your knees a little."],
v_up:[["Lie flat with arms stretched overhead and legs straight.","Lift your arms and legs at the same time.","Reach your hands toward your toes, forming a V.","Lower back down with control."],"Too hard? Bend your knees (tuck-ups)."],
flutter_kick:[["Lie on your back, hands under your hips, legs straight.","Lift your heels a few inches off the floor.","Kick your legs up and down in small, quick movements.","Each kick counts as a rep."],"Keep your lower back pressed into the floor."],
mountain_climber:[["Start in a high push-up position.","Drive one knee toward your chest.","Switch legs quickly, like running in place.","Each knee drive counts as a rep."],"Keep your hips level, not bouncing up and down."],
hollow_hold:[["Lie on your back with arms overhead.","Press your lower back flat into the floor.","Lift your arms, shoulders and legs a few inches off the floor.","Hold for time."],"Bend your knees or bring your arms to your sides to make it easier."],
knee_raise:[["Hang from a pull-up bar or use a captain's chair.","Brace your abs.","Bring your knees up toward your chest.","Lower slowly without swinging."],"Curl your hips up at the top for a stronger ab squeeze."],
toes_to_bar:[["Hang from a pull-up bar with straight arms.","Brace your abs and pull your shoulders down.","Swing your straight legs up until your toes touch the bar.","Lower with control."],"An advanced move. Master hanging leg raises first."],
ab_wheel:[["Kneel holding the ab wheel on the floor under your shoulders.","Brace your abs and squeeze your glutes.","Roll forward slowly as far as you can without your back arching.","Pull back to the start using your abs."],"Start with short rollouts and go further as you get stronger."],
machine_crunch:[["Adjust the seat and grab the handles or rest your arms on the pads.","Brace your abs.","Crunch forward, bringing your chest toward your knees.","Return slowly."],"Breathe out as you crunch for a stronger contraction."],
weighted_crunch:[["Lie on your back with knees bent, holding a dumbbell or plate on your chest.","Curl your shoulders off the floor.","Squeeze your abs at the top.","Lower slowly."],"Hold the weight on your chest, not behind your head."],
side_plank:[["Lie on your side, propped on your forearm with your elbow under your shoulder.","Stack your feet.","Lift your hips so your body forms a straight line.","Hold for time, then switch sides."],"Too hard? Bend your knees and balance on them instead."],
bicycle_crunch:[["Lie on your back with your hands lightly behind your head.","Lift your shoulders and bring one knee in.","Twist to bring your opposite elbow toward that knee.","Switch sides in a pedaling motion. Each side counts as a rep."],"Go slow and twist fully; speed makes it much less effective."],
heel_taps:[["Lie on your back, knees bent, feet flat.","Lift your shoulders slightly off the floor.","Reach one hand toward the heel on that side.","Alternate sides. Each tap counts as a rep."],"Keep your shoulders off the floor the whole set."],
oblique_raise:[["Hang from a pull-up bar.","Bring your knees up and twist them toward one side.","Lower with control.","Alternate sides."],"Don't swing. Keep it controlled to really work the obliques."],
woodchop:[["Set a cable high, stand side-on and grab the handle with both hands.","Feet shoulder-width, arms straight.","Pull the handle diagonally down and across your body, rotating your torso.","Return slowly. Finish one side, then switch."],"Pivot your back foot and turn from your core, not your arms."],
pallof:[["Set a cable at chest height and stand side-on, holding the handle at your chest.","Step away until there's tension.","Press the handle straight out in front of you.","Resist the twist, hold for a second, then bring it back."],"It's an anti-rotation exercise: don't let the cable turn you."],
side_bend:[["Stand holding a dumbbell in one hand.","Keep your hips still.","Bend sideways toward the dumbbell.","Stand back up by squeezing the opposite side. Finish one side, then switch."],"Hold the weight in one hand only. Two cancel each other out."],
weighted_twist:[["Sit with knees bent, holding a dumbbell or plate at your chest.","Lean back slightly with a straight back.","Rotate to bring the weight beside one hip.","Rotate to the other side. Each side counts as a rep."],"Move slowly and keep the weight close to your body."]
};
